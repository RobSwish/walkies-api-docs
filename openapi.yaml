              - customer.created
              - customer.updated
              - customer.deleted
              - customer.connected
              - customer.disconnected
              - pet.created
              - pet.updated
              - pet.deleted
              - invoice.created
              - invoice.updated
              - invoice.paid
              - invoice.overdue
              - invoice.deleted
              - credit_note.created
              - credit_note.applied
              - credit_note.unapplied
              - credit_note.voided
              - credit_note.deleted
              - expense.created
              - expense.updated
              - expense.deleted
              - service.created
              - surcharge.created
              - surcharge.updated
              - surcharge.deleted
              - service.updated
              - service.deleted
              - walk.started
              - walk.finished
              - hike.started
              - hike.finished
              - run.started
              - run.finished
              - taxi.started
              - taxi.finished
              - petsitting.started
              - petsitting.finished
              - petsitting.readyForPickup
              - activity.feedUpdated
              - message.received
              - contract.created
              - contract.signed
              - contract.updated
              - contract.deleted
              - announcement.created
              - announcement.updated
              - announcement.deleted
              - checklist.created
              - checklist.updated
              - checklist.deleted
              - custom_question.created
              - custom_question.updated
              - custom_question.deleted
              - address.created
              - address.updated
              - address.deleted
              - custom_update.created
              - custom_update.updated
              - custom_update.deleted
              - recurring_invoice.created
              - recurring_invoice.updated
              - recurring_invoice.deleted
              - appointment_window.created
              - appointment_window.updated
              - appointment_window.deleted
              - travel_log.created
              - travel_log.updated
              - travel_log.deleted
              - special_hours.created
              - special_hours.updated
              - special_hours.deleted
              - team_member.added
              - team_member.updated
              - team_member.removed
        secret:
          type: string
          description: HMAC-SHA256 secret for verifying webhook payloads
        createdDate:
          type: string
          format: date-time

    WebhookPayload:
      type: object
      properties:
