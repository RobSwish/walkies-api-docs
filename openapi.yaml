  /appointments:
    get:
      summary: List Appointments
      tags: [Appointments]
      parameters:
        - name: customerID
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Filter by date (YYYY-MM-DD)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
    post:
      summary: Create Appointment
      tags: [Appointments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate]
              properties:
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                  description: When omitted, defaults to startDate plus the primary service's duration (minutes); falls back to startDate if the service has no duration.
                timezone:
                  type: string
                  default: UTC
                status:
                  type: string
                  enum: [confirmed, requested]
                  default: confirmed
                serviceID:
                  type: string
                  description: ID of a service from GET /services. The appointment's `type` is derived from this service (a "dropin" service becomes a "checkIn" appointment); a service-less appointment is "other". `type` cannot be set directly.
                petIDs:
                  type: array
                  items:
                    type: string
                  description: Pet IDs to include
                teamMemberIDs:
                  type: array
                  items:
                    type: string
                  description: Team member IDs to assign
                customerIDs:
                  type: array
                  items:
                    type: string
                  description: Customer IDs (auto-derived from pets if not provided)
                createdByTeamMemberID:
                  type: string
                  description: >-
                    Optional. The team member to record as the creator of this appointment, validated
                    against your team (an unknown id returns 400). When set, it is stored on the
                    appointment as the creator. When omitted, the appointment is created with no
                    creator attribution (the field is left unset).
                confirmOverlap:
                  type: boolean
                  description: >-
                    If the new appointment overlaps an existing one (same team member or pet), the
                    API returns 200 with `{ requiresConfirmation: true, warning }` and does NOT book.
                    Re-send the request with confirmOverlap=true to book anyway. (External API keys
                    instead book immediately and get a `warning` on the created appointment.)
                invoiceType:
                  type: string
                  enum: [none, single, whenStarted]
                  default: none
                allDay:
                  type: boolean
                  default: false
                notes:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'

  /invoices:
    get:
      summary: List Invoices
      tags: [Invoices]
      parameters:
        - name: customerID
          in: query
