        The amount is auto-calculated from selected services unless overridden.
        Customer pets are automatically included.
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerID]
              properties:
                customerID:
                  type: string
                serviceIDs:
                  type: array
                  items:
                    type: string
                  description: IDs of services from GET /services
                amount:
                  type: number
                  description: Override auto-calculated amount (pence/cents)
                paymentMethod:
                  type: string
                  enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
                  description: Defaults to your company's preferred payment method (Settings) when omitted.
                notes:
                  type: string
                dueDate:
                  type: string
                  format: date-time
                  description: Defaults to your company's invoice terms (creation date + due-date offset days, default 7) when omitted.
                travelAmount:
                  type: number
                  description: Travel charge (pence/cents)
                discountAmount:
                  type: number
                  description: Discount (pence/cents)
                serviceTaxPercentage:
                  type: number
                serviceTaxAmount:
                  type: number
      responses:
        '201':
