          schema:
            type: string
        - name: discountID
          in: query
          description: Only the codes of this discount.
          schema:
            type: string
        - name: active
          in: query
          description: Only codes whose Active switch is on (true) or off (false).
          schema:
            type: boolean
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiscountCode'
    post:
      summary: Create Discount Code
      description: >-
        Makes a code for a discount, as the apps' Add code does. In the same write
        the discount becomes code-only (`requiresCode: true`, `hidden: true`:
        Automatically apply off), because a discount with a code only applies when
        a client types one. A fixed-amount code comes off once per booking or
        invoice. Admin and Sub Admin only.
      tags: [Discounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [discountID, code]
              additionalProperties: false
              properties:
                discountID: { type: string, description: The discount it unlocks (GET /discounts). }
                code: { type: string, example: WELCOME10, description: "3 to 30 letters, numbers or dashes; stored upper case. No other code of the company may use it." }
                active: { type: boolean, default: true, description: The Active switch. }
                validUntil: { type: string, format: date, nullable: true, description: "Last day it can be used (YYYY-MM-DD, company timezone; it works to the end of that day). null = no end date." }
                maxUses: { type: integer, minimum: 1, nullable: true, description: Total uses allowed. null = no limit. }
                maxUsesPerClient: { type: integer, minimum: 1, nullable: true, description: Uses allowed per client. null = no limit. }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountCode'
        '400':
          description: Invalid code, date or limit
        '403':
          description: Only an Admin or Sub Admin can do this
        '404':
          description: Discount not found
        '409':
          description: Another discount already uses this code
  /discount-codes/{id}:
    get:
      summary: Get Discount Code
      tags: [Discounts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscountCode'
        '404':
          description: Discount code not found
    patch:
      summary: Update Discount Code
      description: >-
        Changes a code as the apps' code editor does: the code text, its Active
        switch, its last day or its limits. Send only what changes; null clears
        an end date or a limit. A code stays with the discount it was made for.
        Admin and Sub Admin only.
      tags: [Discounts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code: { type: string, example: WELCOME10, description: "3 to 30 letters, numbers or dashes; stored upper case. No other code of the company may use it." }
                active: { type: boolean, description: The Active switch. }
                validUntil: { type: string, format: date, nullable: true, description: "Last day it can be used (YYYY-MM-DD, company timezone; it works to the end of that day). null = no end date." }
                maxUses: { type: integer, minimum: 1, nullable: true, description: Total uses allowed. null = no limit. }
                maxUsesPerClient: { type: integer, minimum: 1, nullable: true, description: Uses allowed per client. null = no limit. }
      responses:
        '200':
          description: Updated
          content:
            application/json:
