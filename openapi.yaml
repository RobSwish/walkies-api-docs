          description: Conversation not found
  /messages/broadcast:
    post:
      summary: Broadcast Message
      description: Sends one message to all linked customers, or a subset via customerIDs. Archived customers never receive a broadcast, even when listed in customerIDs; use POST /messages to message one archived customer.
      tags: [Messages]
      requestBody:
        required: true
