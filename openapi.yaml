      description: Lists a conversation's messages, newest first. Messages with photos or videos include short-lived signed links to them until they are removed 30 days after sending. Sending attachments through the API is not supported; POST /messages sends text. A Team Member's key reads only an assigned client's conversation, and only the messages sent from when they were assigned to that client.
