    get:
      summary: Get Company Region
      description: The company's country (ISO 3166-1 alpha-2), currency (ISO 4217) and IANA timezone.
      tags: [Settings]
      responses:
        '200': { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/RegionSettings' } } } }
    patch:
      summary: Update Company Region
      description: >-
        Change the company's country and/or timezone. Setting `country` automatically sets the
        matching `currency` (e.g. US→USD, GB→GBP, FR→EUR); a `currency` you pass is honoured only
        when no `country` is provided. Region affects money display business-wide. The timezone
        defines every booking, availability window and recurring appointment in the company
        calendar, so changing an established zone is refused while future schedule or calendar
        configuration exists; those records require an explicit migration first.
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegionSettings' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RegionSettings' } } } }
        '400': { description: No valid fields }
        '409': { description: Timezone change requires future-schedule migration }
  /travel-logs:
    get:
      summary: List Travel Logs
      tags: [Travel Logs]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TravelLog'
    post:
      summary: Create Travel Log
      description: >-
        Manual travel-log entry, mirroring the app's manual editor. Distance is in
        METERS (the canonical stored unit). GPS coordinates and odometer readings
        are app-only and cannot be set via the API. The created log is inactive
        (completed). When set, loggingTeamMemberID is validated against your team
        and recorded as the team member who logged the travel (used by report
        filters); when omitted, no logging team member is recorded.
      tags: [Travel Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startTime, endTime, distanceMeters]
              properties:
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                  description: Must be on or after startTime
                distanceMeters:
                  type: number
                  description: Distance in meters; must be greater than 0
                teamMemberIDs:
                  type: array
                  items:
                    type: string
                  description: Team members on the trip (unknown ids are skipped)
                loggingTeamMemberID:
                  type: string
                  description: Optional. The team member who logged this travel — validated against your team (unknown id returns 400).
                appointmentID:
                  type: string
                  description: Optional appointment this travel relates to
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelLog'
        '400':
          description: Validation error
  /travel-logs/{id}:
    get:
      summary: Get Travel Log
      tags: [Travel Logs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelLog'
        '404':
          description: Travel log not found
    patch:
      summary: Update Travel Log
      description: >-
        Edits a completed travel log (active/in-progress logs return 400).
        endTime must remain on or after startTime across partial updates.
      tags: [Travel Logs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                distanceMeters:
                  type: number
                  description: Distance in meters; must be greater than 0
                teamMemberIDs:
                  type: array
                  items:
                    type: string
                  description: Replaces the embedded team-member list (unknown ids are skipped)
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelLog'
        '404':
          description: Travel log not found
    delete:
      summary: Delete Travel Log
      tags: [Travel Logs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Travel log not found
  /special-hours:
    get:
      summary: List Special Hours
      tags: [Special Hours]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecialHours'
    post:
      summary: Create Special Hours
      description: >-
        Add a date-specific exception to the normal weekly hours. For a day off /
        holiday, send closed=true and omit times. For a day with different open hours,
        send closed=false with one or more { start, end } blocks in 24-hour HH:mm. The
        date is stored at midnight in the company timezone. To avoid duplicates, check
        the date isn't already set (GET /special-hours) before creating.
      tags: [Special Hours]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date:
                  type: string
                  format: date
                  description: Calendar date this applies to (YYYY-MM-DD)
                closed:
                  type: boolean
                  description: true = closed / not working all day (default false). When true, times is ignored.
                times:
                  type: array
                  description: Open time blocks (only when closed is false)
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start:
                        type: string
                        description: 24-hour HH:mm, e.g. 09:00
                      end:
                        type: string
                        description: 24-hour HH:mm, e.g. 17:00 (must be after start)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialHours'
        '400':
          description: Validation error
  /special-hours/{id}:
    get:
      summary: Get Special Hours
      tags: [Special Hours]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialHours'
        '404':
          description: Special hours entry not found
    patch:
      summary: Update Special Hours
      description: >-
        Update a special-hours entry. Setting closed=true clears any time blocks;
        setting closed=false lets you supply new open blocks.
      tags: [Special Hours]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                closed:
                  type: boolean
                times:
                  type: array
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start:
                        type: string
                        description: 24-hour HH:mm
                      end:
                        type: string
                        description: 24-hour HH:mm
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialHours'
        '404':
          description: Special hours entry not found
    delete:
      summary: Delete Special Hours
      description: Removes the entry so the date reverts to the normal weekly hours.
      tags: [Special Hours]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Special hours entry not found
  /working-hours:
    get:
      summary: List Working Hours
      description: The regular weekly opening hours for all 7 weekdays (0=Sunday … 6=Saturday).
      tags: [Working Hours]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkingDay'
  /working-hours/{day}:
    get:
      summary: Get Working Hours for a Weekday
      tags: [Working Hours]
      parameters:
        - name: day
          in: path
          required: true
          description: Weekday — 0–6 (0=Sunday) or a name like "Monday"
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingDay'
        '400':
          description: Invalid weekday
    patch:
      summary: Set Working Hours for a Weekday
      description: >-
        Replaces the regular weekly hours for one weekday. Send `times` as an array of
        non-overlapping { start, end } blocks in 24-hour HH:mm; send an empty array to
        mark that weekday closed.
      tags: [Working Hours]
      parameters:
        - name: day
          in: path
          required: true
          description: Weekday — 0–6 (0=Sunday) or a name like "Monday"
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [times]
              properties:
                times:
                  type: array
                  description: Non-overlapping open blocks for the weekday ([] = closed)
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start:
                        type: string
                        description: 24-hour HH:mm, e.g. 09:00
                      end:
                        type: string
                        description: 24-hour HH:mm, e.g. 17:00 (must be after start)
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkingDay'
        '400':
          description: Validation error (invalid weekday, bad times, or overlapping blocks)
