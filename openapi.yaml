                  canInvite: { type: boolean }
        '404':
          description: Customer not found
  /customers/{id}/invite:
    post:
      summary: Invite Client to Journal
      tags: [Customers]
      description: >-
        Creates the invite link the sitter apps share, for the next owner on
        this client record who has not connected yet, plus the apps' message to
        send with it in that owner's language. Send it yourself (email, text).
        The client connects by tapping it; the API cannot connect an account
        for them. Admins and Sub Admins only. Links expire.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  customerID: { type: string, description: Only on a client invite. }
                  ownerNumber: { type: integer, description: Only on a client invite. 1 for the first owner, 2 for the second. }
                  mode: { type: string, enum: [connectCustomer, createCustomer] }
                  url: { type: string, description: The link to send. It opens the Walkies Journal app, or its store page. }
                  message: { type: string, description: "The message the apps send with the link, in the client's language." }
                  language: { type: string }
                  expiresAt: { type: string, format: date-time }
        '403': { description: Not an Admin or Sub Admin }
        '404': { description: Customer not found }
        '409': { description: Both owners are already connected }
        '502': { description: The link service did not respond. Try again. }
  /customer-invites:
