      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                startTime:
                  type: string
                  format: date-time
                endTime:
                  type: string
                  format: date-time
                distanceMeters:
                  type: number
                  description: Distance in meters; must be greater than 0
                teamMemberIDs:
                  type: array
                  items:
                    type: string
                  description: Replaces the embedded team-member list (unknown ids are skipped)
      responses:
        '200':
          description: Updated
          content:
