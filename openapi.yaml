openapi: 3.0.3
info:
  title: Walkies API
  description: |
    The Walkies API allows pet sitting businesses to integrate with external tools via Zapier or direct API access.

    ## Authentication
    All requests require an API key passed as a Bearer token:
    ```
    Authorization: Bearer wk_live_...
    ```
    Generate an API key from the Walkies iOS app: **Settings > Integrations > Generate New API Key**.

    ## Rate Limits
    Requests are rate limited per API key (and per IP). Exceeding the limit returns `429` with a `Retry-After` header (seconds) — back off and retry.

    ## Pagination
    List endpoints accept `?limit=` (default 50, max 100). When more results may exist, the response includes an `X-Next-Cursor` header; pass its value back as `?cursor=` to fetch the next page. (Filtered list queries return a single capped page.)

    ## Idempotency
    Send an `Idempotency-Key` header on POST creates to retry safely: the first successful response is stored and replayed for any retry using the same key (scoped per company, ~48h).

    ## Errors
    Errors return a JSON body of the form `{ "error": "message" }`. Common status codes: `400` validation error, `401` missing/invalid API key, `403` Max subscription required, `404` not found, `429` rate limited, `500` server error.

    ## Subscription
    The API requires a **Max subscription**. Requests from accounts without an active Max subscription receive a `403` response.
  version: 1.2.0
  contact:
    name: Walkies Support
    url: https://walkies.app
servers:
  - url: https://api.personalwalkies.com
    description: Production

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key generated from the Walkies iOS app

  schemas:
    ReportPeriod:
      type: object
      description: The resolved date range a report was computed over.
      properties:
        type:
          type: string
          enum: [thisWeek, thisMonth, thisQuarter, thisYear, custom]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: Inclusive end of the period (…23:59:59.999 in the timezone).
        timezone:
          type: string
          example: Europe/London
    Customer:
      type: object
      properties:
        id:
          type: string
          example: cust123
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Smith
        email:
          type: string
          example: jane@example.com
        phoneNumber:
          type: string
          example: "+447700900000"
        picture:
          type: string
          nullable: true
          example: https://firebasestorage.googleapis.com/...
        address:
          type: string
        notes:
          type: string
        accessInformation:
          type: string
        emergencyContactName:
          type: string
        emergencyPhoneNumber:
          type: string
        secondaryFirstName:
          type: string
          nullable: true
        secondaryLastName:
          type: string
          nullable: true
        secondaryEmail:
          type: string
          nullable: true
        secondaryPhoneNumber:
          type: string
          nullable: true
        linked:
          type: boolean
        secondaryLinked:
          type: boolean
        preferredPaymentMethod:
          type: string
          nullable: true
          enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
        status:
          type: string
          enum: [active, archived]
        createdDate:
          type: string
          format: date-time

    Pet:
      type: object
      properties:
        id:
          type: string
        customerID:
          type: string
        name:
          type: string
          example: Max
        type:
          type: string
          enum: [dog, cat, pig, bird, fish, small pet, reptile, horse, other]
        breed:
          type: string
          example: Labrador
        gender:
          type: string
          enum: [Male, Female]
        weight:
          type: string
          nullable: true
        neutered:
          type: boolean
        microchipped:
          type: boolean
        medicalInformation:
          type: string
        foodInstructions:
          type: string
        status:
          type: string
          enum: [active, archived, passedAway]

    Service:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [walk, dropin, taxi, daycare, boarding, overnight, homeSitting, training, grooming, meetAndGreet, other, external, busy, holiday, birthday]
        title:
          type: string
          example: 1 Hour Walk
        description:
          type: string
        amount:
          type: number
          description: Amount in pence/cents (e.g. 2500 = GBP 25.00)
          example: 2500
        additionalPetAmount:
          type: number
          nullable: true
          description: Extra charge per additional pet (pence/cents)
        currency:
          type: string
          example: GBP
        country:
          type: string
          example: GB
        duration:
          type: integer
          nullable: true
          description: Duration in minutes
        quantity:
          type: integer
          default: 1
        cadence:
          type: string
          enum: [perService, perDay, perNight]
          default: perService
        hidden:
          type: boolean
          default: false
        position:
          type: integer
          default: 0

    Appointment:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [walk, checkIn, taxi, daycare, boarding, homeSitting, overnight, training, grooming, meetAndGreet, other, external, busy, holiday, birthday]
        status:
          type: string
          enum: [confirmed, requested, declined]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        timezone:
          type: string
          example: Europe/London
        allDay:
          type: boolean
        pets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              customerID:
                type: string
              type:
                type: string
              breed:
                type: string
              gender:
                type: string
        teamMembers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              role:
                type: string
        service:
          type: object
          nullable: true
          description: Primary service
          properties:
            id:
              type: string
            title:
              type: string
            amount:
              type: number
            type:
              type: string
            cadence:
              type: string
        additionalServices:
          type: array
          items:
            type: object
        notes:
          type: string
        customerIDs:
          type: array
          items:
            type: string

    Invoice:
      type: object
      properties:
        id:
          type: string
        customerID:
          type: string
        customerFirstName:
          type: string
        customerLastName:
          type: string
        amount:
          type: number
          description: Amount in pence/cents
        currency:
          type: string
        country:
          type: string
        reference:
          type: string
        services:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              title:
                type: string
              amount:
                type: number
              quantity:
                type: integer
              cadence:
                type: string
              currency:
                type: string
              country:
                type: string
        pets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              customerID:
                type: string
        payments:
          type: array
          items:
            type: object
        notes:
          type: string
        paid:
          type: boolean
        paymentMethod:
          type: string
          enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
        datePaid:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        travelAmount:
          type: number
          nullable: true
        discountAmount:
          type: number
          nullable: true
        tipAmount:
          type: number
          nullable: true
        serviceTaxPercentage:
          type: number
          nullable: true
        serviceTaxAmount:
          type: number
          nullable: true
        createdDate:
          type: string
          format: date-time

    Expense:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
          description: Amount in minor units (pence/cents) — e.g. 1000 = £10.00.
        category:
          type: string
          enum: [fuel, mileage, petSupplies, insurance, vehicleMaintenance, marketing, officeSupplies, vetSupplies, software, equipment, training, other]
        date:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        vendor:
          type: string
          nullable: true
        teamMemberIDs:
          type: array
          items:
            type: string
        teamMemberNames:
          type: array
          items:
            type: string
        mileageDistance:
          type: number
          nullable: true
          description: Required for mileage category
        mileageRate:
          type: number
          nullable: true
          description: Required for mileage category
        reimbursed:
          type: boolean
        createdDate:
          type: string
          format: date-time

    Announcement:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
        picture:
          type: string
          nullable: true
        createdDate:
          type: string
          format: date-time

    Webhook:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - appointment.created
              - appointment.updated
              - appointment.cancelled
              - customer.created
              - customer.updated
              - invoice.created
              - invoice.paid
              - walk.started
              - walk.finished
              - taxi.started
              - taxi.finished
              - petsitting.started
              - petsitting.finished
              - petsitting.readyForPickup
              - activity.feedUpdated
              - message.received
              - contract.signed
              - announcement.created
              - announcement.updated
              - team_member.added
              - team_member.removed
        secret:
          type: string
          description: HMAC-SHA256 secret for verifying webhook payloads
        createdDate:
          type: string
          format: date-time

    WebhookPayload:
      type: object
      properties:
        event:
          type: string
          example: appointment.created
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          description: Event-specific payload

    CompanyInfo:
      type: object
      properties:
        companyName:
          type: string
          example: Walkies
        companyLogo:
          type: string
          nullable: true
        country:
          type: string
          example: GB
        currency:
          type: string
          example: GBP

    Error:
      type: object
      properties:
        error:
          type: string

    ActivityTeamMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          example: Team Member
        picture:
          type: string
          nullable: true
    ActivityPet:
      type: object
      description: Embedded pet snapshot with per-activity tallies.
      properties:
        id:
          type: string
        name:
          type: string
        breed:
          type: string
        type:
          type: string
          example: dog
        picture:
          type: string
          nullable: true
        customerID:
          type: string
        wees:
          type: integer
        poos:
          type: integer
        food:
          type: integer
        water:
          type: integer
        treat:
          type: integer
        medication:
          type: integer
        litterBox:
          type: integer
    ActivityWeather:
      type: object
      nullable: true
      properties:
        temperature:
          type: number
          nullable: true
        condition:
          type: string
          example: cloudy
    ActivityService:
      type: object
      nullable: true
      properties:
        id:
          type: string
        title:
          type: string
        amount:
          type: number
        type:
          type: string
        cadence:
          type: string
    ChecklistItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        completed:
          type: boolean
    ActivityVideo:
      type: object
      properties:
        thumbnail:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
    UpdatesSummary:
      type: object
      description: Timeline rollup. Raw GPS coordinates are never exposed.
      properties:
        count:
          type: integer
        photos:
          type: integer
        videos:
          type: integer
    Activity:
      type: object
      description: A recorded walk, taxi journey, or check-in (shared WalkiesActivity model). Raw GPS and device identifiers are excluded.
      properties:
        id:
          type: string
        type:
          type: string
          example: walk
        companyID:
          type: string
          nullable: true
        active:
          type: boolean
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
          description: Duration in seconds.
        distance:
          type: number
          description: Distance in metres.
        notes:
          type: string
        companyName:
          type: string
          nullable: true
        companyLogo:
          type: string
          nullable: true
        streetAddress:
          type: string
        city:
          type: string
        postcode:
          type: string
        weather:
          $ref: '#/components/schemas/ActivityWeather'
        service:
          $ref: '#/components/schemas/ActivityService'
        dogs:
          type: array
          items:
            $ref: '#/components/schemas/ActivityPet'
        teamMembers:
          type: array
          items:
            $ref: '#/components/schemas/ActivityTeamMember'
        petSittingIDs:
          type: array
          items:
            type: string
        additionalChecklistItems:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        walkImages:
          type: array
          items:
            type: string
        walkVideos:
          type: array
          items:
            $ref: '#/components/schemas/ActivityVideo'
        updates:
          $ref: '#/components/schemas/UpdatesSummary'
    PetSitting:
      type: object
      description: A boarding, daycare, overnight, or other pet sitting record. Raw GPS and device identifiers are excluded.
      properties:
        id:
          type: string
        type:
          type: string
          example: boarding
        companyID:
          type: string
          nullable: true
        active:
          type: boolean
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        companyName:
          type: string
          nullable: true
        companyLogo:
          type: string
          nullable: true
        weather:
          $ref: '#/components/schemas/ActivityWeather'
        service:
          $ref: '#/components/schemas/ActivityService'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/ActivityPet'
        teamMembers:
          type: array
          items:
            $ref: '#/components/schemas/ActivityTeamMember'
        additionalChecklistItems:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        updates:
          $ref: '#/components/schemas/UpdatesSummary'
    TeamMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Alex Walker
        role:
          type: string
          enum: [Admin, Sub Admin, Team Member]
        active:
          type: boolean
        email:
          type: string
          nullable: true
        picture:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          description: Hex colour used for the team member in the calendar (e.g. "#4287f5")
          example: "#4287f5"
        activityRate:
          type: number
          nullable: true
          description: Pay rate per activity (pence/cents)
        hourlyRate:
          type: number
          nullable: true
          description: Pay rate per hour (pence/cents)
        mileRate:
          type: number
          nullable: true
          description: Pay rate per mile (pence/cents)
        serviceRates:
          type: object
          nullable: true
          additionalProperties:
            type: number
          description: Per-service pay rates keyed by service ID (pence/cents)
    Contract:
      type: object
      properties:
        id:
          type: string
        companyID:
          type: string
          nullable: true
        title:
          type: string
          example: Pet Sitting Agreement
        content:
          type: string
          description: Contract body. Newlines are preserved (stored internally with <br>).
        template:
          type: boolean
        templateID:
          type: string
          nullable: true
        customerID:
          type: string
          nullable: true
        primaryCustomerName:
          type: string
          nullable: true
        secondaryCustomerName:
          type: string
          nullable: true
        signed:
          type: boolean
        signedDate:
          type: string
          format: date-time
          nullable: true
        signedBy:
          type: string
          nullable: true
        sendToClients:
          type: boolean
        createdDate:
          type: string
          format: date-time
    Checklist:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          example: New Client Onboarding
        type:
          type: string
          enum: [customer, pet]
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        pets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              customerID:
                type: string
        customers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              firstName:
                type: string
              lastName:
                type: string
    Address:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Home
        lineOne:
          type: string
        lineTwo:
          type: string
        city:
          type: string
        postcode:
          type: string
        state:
          type: string
        country:
          type: string
        lat:
          type: number
        long:
          type: number
    CustomUpdate:
      type: object
      description: A reusable custom timeline update (CustomTimelineUpdate).
      properties:
        id:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [pet, general]
        serviceTypes:
          type: array
          items:
            type: string
        customers:
          type: array
          items:
            type: object
        pets:
          type: array
          items:
            type: object
    TravelLog:
      type: object
      description: A recorded travel/mileage log. Read-only. Raw GPS coordinates are excluded.
      properties:
        id:
          type: string
        companyID:
          type: string
          nullable: true
        distance:
          type: number
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
        pets:
          type: array
          items:
            type: object
        teamMembers:
          type: array
          items:
            type: object
        loggingTeamMember:
          type: object
          nullable: true
        appointmentID:
          type: string
          nullable: true
        startOdometerReading:
          type: number
          nullable: true
        endOdometerReading:
          type: number
          nullable: true
    SpecialHours:
      type: object
      description: >-
        A date-specific exception to the normal weekly opening hours — a day off,
        holiday, or one-off different hours. closed=true means not working that whole
        day (times is empty). The date is in the company timezone.
      properties:
        id:
          type: string
        date:
          type: string
          format: date
          description: The calendar date this applies to (YYYY-MM-DD, in the company timezone)
        closed:
          type: boolean
          description: true = closed / not working all day; false = open with the time blocks below
        times:
          type: array
          description: Open time blocks for the day (empty when closed)
          items:
            type: object
            properties:
              start:
                type: string
                description: Block start, 24-hour HH:mm (e.g. 09:00)
              end:
                type: string
                description: Block end, 24-hour HH:mm (e.g. 17:00)
    Company:
      type: object
      description: Merged public company profile plus read-only counters. Region fields (country/currency/timezone) are read-only and cannot be set via PATCH.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        location:
          type: string
        logo:
          type: string
          nullable: true
        cover:
          type: string
          nullable: true
        profile:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        address:
          type: object
          nullable: true
        country:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        preferredPaymentMethod:
          type: string
          nullable: true
        preferredInvoiceType:
          type: string
          nullable: true
        customerPaysFee:
          type: boolean
        serviceTax:
          type: number
          nullable: true
        invoicesEnabled:
          type: boolean
        subscriptionStatus:
          type: string
          nullable: true
          readOnly: true
        teamMemberCount:
          type: integer
          readOnly: true
        walkCount:
          type: integer
          readOnly: true
        taxiCount:
          type: integer
          readOnly: true
        petSittingCount:
          type: integer
          readOnly: true
        checkInCount:
          type: integer
          readOnly: true
    Conversation:
      type: object
      properties:
        id:
          type: string
        customerID:
          type: string
        customerFirstName:
          type: string
        customerLastName:
          type: string
        unreadCompanyMessageCount:
          type: integer
        unreadCustomerMessageCount:
          type: integer
        lastMessage:
          type: object
          nullable: true
    Message:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        senderID:
          type: string
        customerID:
          type: string
        companyRead:
          type: boolean
        customerRead:
          type: boolean
        sentDate:
          type: string
          format: date-time
          nullable: true

paths:
  /me:
    get:
      summary: Test Authentication
      description: Returns company information for the authenticated API key. Use this to verify your key is valid.
      tags: [Authentication]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyInfo'
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Max subscription required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers:
    get:
      summary: List Customers
      description: Returns all customers. Optionally filter by email or name.
      tags: [Customers]
      parameters:
        - name: email
          in: query
          schema:
            type: string
          description: Filter by exact email match
        - name: name
          in: query
          schema:
            type: string
          description: Filter by name (partial match on first + last name)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Create Customer
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName]
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phoneNumber:
                  type: string
                address:
                  type: string
                notes:
                  type: string
                accessInformation:
                  type: string
                emergencyContactName:
                  type: string
                emergencyPhoneNumber:
                  type: string
                preferredPaymentMethod:
                  type: string
                  enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
                secondaryFirstName:
                  type: string
                secondaryLastName:
                  type: string
                secondaryEmail:
                  type: string
                secondaryPhoneNumber:
                  type: string
                imageUrl:
                  type: string
                  description: URL of a profile picture (max 5MB)
                imageBase64:
                  type: string
                  description: Base64-encoded profile picture (max 5MB)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{id}:
    delete:
      summary: Delete Customer
      description: Soft-deletes (archives) by default, reversible via POST /customers/{id}/restore. Pass ?hard=true with header X-Confirm-Delete:true to permanently delete and cascade conversations, messages and pets.
      tags: [Customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: hard
          in: query
          schema:
            type: boolean
        - name: X-Confirm-Delete
          in: header
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: Archived (soft) or permanently deleted (hard)
        '400':
          description: Hard delete attempted without the X-Confirm-Delete header
        '404':
          description: Customer not found
    get:
      summary: Get Customer
      tags: [Customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
    patch:
