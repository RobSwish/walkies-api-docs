  /settings/region:
    get:
      summary: Get Company Region
      description: >-
        The company's country (ISO 3166-1 alpha-2), currency (ISO 4217), IANA timezone and
        business language (null = automatic, from the country).
      tags: [Settings]
      responses:
        '200': { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/RegionSettings' } } } }
    patch:
      summary: Update Company Region
      description: >-
        Change the company's country, timezone and/or business language. `businessLanguage` takes a
        supported language code (en, fr, es, pt, de, it, nl, tr, uk, da, sv, pl, nb, el, fi, ja, ko, hi) or null for automatic (the country's language); any other
        value is refused with 400. Setting `country` automatically sets the
        matching `currency` (e.g. US→USD, GB→GBP, FR→EUR); a `currency` you pass is honoured only
        when no `country` is provided. Region affects money display business-wide. The timezone
        defines every booking, availability window and recurring appointment in the company
        calendar, so changing an established zone is refused while future schedule or calendar
        configuration exists; those records require an explicit migration first.
      tags: [Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegionSettings' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RegionSettings' } } } }
        '400': { description: No valid fields }
        '409': { description: Timezone change requires future-schedule migration }
  /travel-logs:
    get:
      summary: List Travel Logs
      tags: [Travel Logs]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
        - name: active
          in: query
          description: Filter by active or completed Travel Logs before pagination.
          schema:
            type: boolean
      responses:
        '200':
          description: Success
          headers:
            X-Next-Cursor:
              description: Cursor for the next page when another page may exist.
              schema: { type: string }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TravelLog'
    post:
      summary: Create Travel Log
      description: >-
        Manual travel-log entry, mirroring the app's manual editor. Distance is in
        METERS (the canonical stored unit). GPS coordinates and odometer readings
        are app-only and cannot be set via the API. The created log is inactive
        (completed). When set, loggingTeamMemberID is validated against your team
        and recorded as the team member who logged the travel (used by report
        filters); it is also included in teamMembers so payroll and exports retain
        the attribution. Unknown team or appointment ids are rejected. A linked
        appointment and travel log are updated atomically.
      tags: [Travel Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [startTime, endTime, distanceMeters]
              properties:
                startTime:
                  type: string
                  format: date-time
                  description: RFC 3339 instant with Z or an explicit UTC offset.
                endTime:
                  type: string
                  format: date-time
                  description: RFC 3339 instant with Z or an explicit UTC offset. Must be after startTime.
                distanceMeters:
                  type: number
                  description: Distance in meters; must be greater than 0
                teamMemberIDs:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                  uniqueItems: true
                  description: Team members on the trip. Every id must exist in this company.
                loggingTeamMemberID:
                  type: string
                  description: Optional. The team member who logged this travel — validated against your team (unknown id returns 400).
                appointmentID:
                  type: string
                  description: Optional appointment in this company. An appointment can link to only one travel log.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelLog'
        '400':
          description: Validation error
        '409':
          description: The appointment is already linked to another travel log
  /travel-logs/{id}:
    get:
      summary: Get Travel Log
      tags: [Travel Logs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelLog'
        '404':
          description: Travel log not found
    patch:
      summary: Update Travel Log
      description: >-
        Edits a completed travel log. Active/in-progress logs return 409.
        endTime must remain strictly after startTime across partial updates.
      tags: [Travel Logs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                startTime:
                  type: string
                  format: date-time
                  description: RFC 3339 instant with Z or an explicit UTC offset.
                endTime:
                  type: string
                  format: date-time
                  description: RFC 3339 instant with Z or an explicit UTC offset.
                distanceMeters:
                  type: number
                  description: Distance in meters; must be greater than 0
                teamMemberIDs:
                  type: array
                  items:
                    type: string
                  maxItems: 50
                  uniqueItems: true
                  description: Replaces the assigned team members. Every id must exist in this company; the original logger remains assigned.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TravelLog'
        '404':
          description: Travel log not found
        '409':
          description: An active/in-progress travel log cannot be edited
    delete:
      summary: Delete Travel Log
      tags: [Travel Logs]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Travel log not found
        '409':
          description: An active/in-progress travel log cannot be deleted
  /special-hours:
    get:
      summary: List Special Hours
      tags: [Special Hours]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecialHours'
    post:
      summary: Create Special Hours
      description: >-
        Add a date-specific exception to the normal weekly hours. For a day off /
        holiday, send closed=true and omit times. For a day with different open hours,
        send closed=false with one or more { start, end } blocks in 24-hour HH:mm. The
        date is stored at midnight in the company timezone. To avoid duplicates, check
        the date isn't already set (GET /special-hours) before creating.
      tags: [Special Hours]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date:
                  type: string
                  format: date
                  description: Calendar date this applies to (YYYY-MM-DD)
                closed:
                  type: boolean
                  description: true = closed / not working all day (default false). When true, times is ignored.
                times:
                  type: array
                  description: Open time blocks (only when closed is false)
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start:
                        type: string
                        description: 24-hour HH:mm, e.g. 09:00
                      end:
                        type: string
                        description: 24-hour HH:mm, e.g. 17:00 (must be after start)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialHours'
        '400':
          description: Validation error
  /special-hours/{id}:
    get:
      summary: Get Special Hours
      tags: [Special Hours]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialHours'
        '404':
          description: Special hours entry not found
    patch:
      summary: Update Special Hours
