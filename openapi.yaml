          type: string
          nullable: true
        active:
          type: boolean
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        companyName:
          type: string
          nullable: true
        companyLogo:
          type: string
          nullable: true
        weather:
          $ref: '#/components/schemas/ActivityWeather'
        service:
          $ref: '#/components/schemas/ActivityService'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/ActivityPet'
        teamMembers:
          type: array
          items:
            $ref: '#/components/schemas/ActivityTeamMember'
        additionalChecklistItems:
