  /credit-notes:
    get:
      summary: List Credit Notes
      description: Credit issued to your clients, newest first.
      tags: [Credit Notes]
      parameters:
        - name: customerID
          in: query
          schema:
            type: string
        - name: status
          in: query
          description: Filter by derived status.
          schema:
            type: string
            enum: [open, partiallyApplied, applied, void]
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CreditNote'
    post:
      summary: Create Credit Note
      description: >
        Issue credit to a client. This does NOT apply it to anything — the credit
        sits on the client until applied to an invoice, which is what lets you
        credit a client who has no open invoice.
      tags: [Credit Notes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerID, amount]
              properties:
                customerID:
                  type: string
                amount:
                  type: integer
                  description: Minor units. Must be greater than zero.
                  example: 3000
                reason:
                  type: string
                  description: Client-visible. Optional.
                notes:
                  type: string
                  description: Private to your team. Never returned by the API.
                dateIssued:
                  type: string
                  format: date-time
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
        '400':
          description: Missing or invalid field
        '404':
          description: Client not found
  /credit-notes/{id}:
    get:
      summary: Get Credit Note
      tags: [Credit Notes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
        '404':
          description: Credit note not found
    patch:
      summary: Update Credit Note
      description: >
        Edits the WORDING only. `amount` and `reference` are immutable — the
        amount is drawn down by allocations already on invoices, so changing it
        would silently invalidate them. Sending either is rejected rather than
        ignored.
      tags: [Credit Notes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Client-visible. Send an empty string to clear it.
                notes:
                  type: string
                  description: Private to your team. Never returned by the API.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
        '400':
          description: An immutable field was sent, or nothing to update
        '404':
          description: Credit note not found
    delete:
      summary: Delete Credit Note
      description: >
        Permanently erases the note. This is NOT how you cancel credit — use
        void for that, which keeps the record of what was offered. Refused
        while any credit is still applied to an invoice. Requires header
        X-Confirm-Delete:true.
      tags: [Credit Notes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: X-Confirm-Delete
          in: header
          required: true
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: Deleted
        '404':
          description: Credit note not found
        '409':
          description: Credit is still applied to one or more invoices
  /credit-notes/{id}/apply:
    post:
      summary: Apply Credit Note to Invoice
      description: >
        Puts some or all of the credit against an invoice, reducing what is owed.
        Over-allocation is REFUSED rather than clamped, and the error names the
        amount that was actually available.


        SEND AN `Idempotency-Key` HEADER. Applying the same credit twice is a
        legitimate operation (two separate part-payments), so the server cannot
        tell a deliberate second application from a network retry — and an
        unkeyed retry spends the client's credit twice with no error. This is the
        one endpoint where the key is effectively required rather than advisory.
      tags: [Credit Notes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invoiceID, amount]
              properties:
                invoiceID:
                  type: string
                amount:
                  type: integer
                  description: Minor units to apply.
      responses:
        '200':
          description: Applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
        '400':
          description: Missing or invalid field
        '404':
          description: Credit note or invoice not found
        '409':
          description: >
            Refused. The note is voided, belongs to a different client, is in a
            different currency, the invoice has nothing left to pay, the amount
            exceeds what is available, or the client is paying the invoice right now.
  /credit-notes/{id}/unapply:
    post:
      summary: Remove Applied Credit
      description: >
        Reverses one allocation, returning the credit to the client. Refused on an
        invoice that has already been paid with real money.
      tags: [Credit Notes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allocationID]
              properties:
                allocationID:
                  type: string
                  description: The allocation's `id`, from the note's allocations array.
                reason:
                  type: string
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
        '400':
          description: Missing field
        '404':
          description: Credit note or allocation not found
        '409':
          description: Already removed, the invoice was paid with real money, or the client is paying it right now
  /credit-notes/{id}/void:
    post:
      summary: Void Credit Note
      description: >
        Withdraws whatever credit is LEFT on the note. The note stays on the
        client's record marked void, and any credit already applied to invoices
        stays applied — voiding writes only the credit note, never an invoice.
        A partly used note can be voided; the unused remainder is what goes.
      tags: [Credit Notes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditNote'
        '404':
          description: Credit note not found
        '409':
          description: Already voided
