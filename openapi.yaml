  /special-hours:
    get:
      summary: List Special Hours
      tags: [Special Hours]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SpecialHours'
    post:
      summary: Create Special Hours
      description: >-
        Add a date-specific exception to the normal weekly hours. For a day off /
        holiday, send closed=true and omit times. For a day with different open hours,
        send closed=false with one or more { start, end } blocks in 24-hour HH:mm. The
        date is stored at midnight in the company timezone. To avoid duplicates, check
        the date isn't already set (GET /special-hours) before creating.
      tags: [Special Hours]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date:
                  type: string
                  format: date
                  description: Calendar date this applies to (YYYY-MM-DD)
                closed:
                  type: boolean
                  description: true = closed / not working all day (default false). When true, times is ignored.
                times:
                  type: array
                  description: Open time blocks (only when closed is false)
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start:
                        type: string
                        description: 24-hour HH:mm, e.g. 09:00
                      end:
                        type: string
                        description: 24-hour HH:mm, e.g. 17:00 (must be after start)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialHours'
        '400':
          description: Validation error
  /special-hours/{id}:
    get:
      summary: Get Special Hours
      tags: [Special Hours]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialHours'
        '404':
          description: Special hours entry not found
    patch:
      summary: Update Special Hours
      description: >-
        Update a special-hours entry. Setting closed=true clears any time blocks;
        setting closed=false lets you supply new open blocks.
      tags: [Special Hours]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                closed:
                  type: boolean
                times:
                  type: array
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start:
                        type: string
                        description: 24-hour HH:mm
                      end:
                        type: string
                        description: 24-hour HH:mm
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialHours'
        '404':
          description: Special hours entry not found
    delete:
      summary: Delete Special Hours
      description: Removes the entry so the date reverts to the normal weekly hours.
      tags: [Special Hours]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '404':
          description: Special hours entry not found
