  /custom-questions:
    get:
      summary: List Custom Questions
      tags: [Custom questions]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomQuestion'
    post:
      summary: Create Custom Question
      description: >-
        The id is always a Firestore auto-id, never derived from the title: it
        doubles as a key in every answer map, and a title-derived slug containing
        "." or "/" would break writes on every client. A company may have at most
        50 questions of each type, matching the maximum size of an answer map.
      tags: [Custom questions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type]
              properties:
                title:
                  type: string
                  maxLength: 500
                  description: >-
                    Trimmed before storing. A blank or whitespace-only title is
                    rejected, because every client drops a question with no text
                    rather than render an unlabelled field.
                type:
                  type: string
                  enum: [customer, pet]
                  description: Cannot be changed after creation.
                required:
                  type: boolean
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomQuestion'
        '400':
          description: >-
            Missing or blank title, invalid type, or the company already has 50
            questions of this type.
  /custom-questions/{id}:
    get:
      summary: Get Custom Question
      tags: [Custom questions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomQuestion'
        '404':
          description: Custom question not found
    patch:
      summary: Update Custom Question
      description: >-
        `type` is immutable: sending a different value returns 400, because
        changing it would orphan every answer already collected. A title sent here
        is trimmed, and blanking it is rejected.
      tags: [Custom questions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                required:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomQuestion'
        '400':
          description: Attempted to change the immutable type
        '404':
          description: Custom question not found
    delete:
      summary: Delete Custom Question
      description: >-
        Existing answers are left on the customer/pet records. They stop being
        shown once the definition is gone, and recreating a question with the same
        id brings them back.
      tags: [Custom questions]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '404':
          description: Custom question not found
  /company:
    get:
      summary: Get Company Profile
      tags: [Company]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
    patch:
      summary: Update Company Profile
      description: >-
        Updates your company profile, billing defaults and payment handles. Region fields
        (country, currency, timezone) are read-only here and silently ignored — use
        PATCH /settings/region for those. Enabling invoiceRemindersEnabled or appointmentReminders
        requires a Max subscription (otherwise 403). The `address` and `bankTransfer` objects
        are deep-merged — send just the sub-field(s) you're changing; the rest are preserved.
      tags: [Company]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                location:
                  type: string
                logo:
                  type: string
                color:
                  type: string
                address:
                  type: object
                  description: Company business address. Sub-fields firstLine, secondLine, city, postcode, lat, long. Deep-merged — send only the fields you're changing; send the whole object as null to clear it.
                  properties:
                    firstLine: { type: string }
                    secondLine: { type: string }
                    city: { type: string }
                    postcode: { type: string }
                    lat: { type: number }
                    long: { type: number }
                preferredPaymentMethod:
                  type: string
                  description: One of Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None.
                preferredInvoiceType:
                  type: string
                  description: Default billing/invoice type — single, whenStarted, prePaid, or none.
                customerPaysFee:
                  type: boolean
                serviceTax:
                  type: number
                depositPercentage:
                  type: number
                  description: 0–100.
                dueDateOffset:
                  type: integer
                  description: Days until an invoice is due.
                depositDueDateOffset:
                  type: integer
                  description: >-
                    Days after an invoice is RAISED that its deposit falls due, counted from
                    the invoice creation date (unlike dueDateOffset, which a booked invoice
                    counts from the service date). Leave unset to make deposits due with the
                    invoice.
                invoicesEnabled:
                  type: boolean
                sendContracts:
                  type: boolean
                appointmentSharing:
                  type: boolean
                invoiceRemindersEnabled:
                  type: boolean
                  description: Automatic invoice reminders. Enabling requires a Max subscription (else 403).
                appointmentReminders:
                  type: boolean
                  description: Appointment reminders to customers. Enabling requires a Max subscription (else 403).
                appointmentReminderDelay:
                  type: number
                  description: Minutes before the appointment to send the reminder (e.g. 30).
                bankTransfer:
                  type: object
                  description: Bank-transfer details. Deep-merged — send only the fields you're changing; send the whole object as null to clear it, or a sub-field as "" to clear that field.
                  properties:
                    accountNumber: { type: string }
                    routingNumber: { type: string, description: US routing / UK sort code / CA transit number. }
                paypalURL:
                  type: string
                  description: PayPal username only (no URL / @).
                venmoURL:
