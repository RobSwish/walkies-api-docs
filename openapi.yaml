    TeamMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Alex Walker
        role:
          type: string
          enum: [Admin, Sub Admin, Team Member]
        active:
          type: boolean
        email:
          type: string
          nullable: true
        picture:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          description: Hex colour used for the team member in the calendar (e.g. "#4287f5")
          example: "#4287f5"
        activityRate:
          type: number
          nullable: true
          description: Pay rate per activity (pence/cents)
        hourlyRate:
          type: number
          nullable: true
          description: Pay rate per hour (pence/cents)
        mileRate:
          type: number
          nullable: true
          description: Pay rate per mile (pence/cents)
        serviceRates:
          type: object
          nullable: true
          additionalProperties:
            type: number
          description: Per-service pay rates keyed by service ID (pence/cents)
        workingHours:
          type: object
          description: Optional read-only weekday map, keys 0–6. Use the member working-hours route to edit; omitted from embedded appointment assignees.
          additionalProperties:
            $ref: '#/components/schemas/MemberWorkingDay'
    MemberWorkingDay:
      type: object
      description: One member override in the current company timezone; missing day keys inherit company hours.
      required: [id, timezone, times]
      additionalProperties: false
      properties:
        id: { type: string, enum: ['0', '1', '2', '3', '4', '5', '6'] }
        timezone: { type: string }
        times:
          type: array
          maxItems: 12
          description: Sorted, nonoverlapping same-day blocks; an empty array explicitly closes the day.
          items:
            type: object
            additionalProperties: false
            required: [startHour, startMinute, endHour, endMinute, timezone]
            properties:
              startHour: { type: integer, minimum: 0, maximum: 23 }
              startMinute: { type: integer, minimum: 0, maximum: 59 }
              endHour: { type: integer, minimum: 0, maximum: 23 }
              endMinute: { type: integer, minimum: 0, maximum: 59 }
              timezone: { type: string }
    MemberWorkingHoursResponse:
      type: object
      required: [teamMemberID, day, dayName, timezone, inherited, closed, times]
      properties:
        teamMemberID: { type: string }
        day: { type: integer, minimum: 0, maximum: 6 }
        dayName: { type: string }
        timezone: { type: string }
        inherited: { type: boolean }
        closed: { type: boolean, nullable: true, description: 'Null when inherited; true when explicitly closed.' }
        times:
          type: array
          maxItems: 12
          items:
            type: object
            properties:
              start: { type: string }
              end: { type: string }
    Contract:
      type: object
      properties:
        id:
          type: string
        companyID:
          type: string
          nullable: true
        title:
          type: string
          example: Pet Sitting Agreement
        content:
          type: string
          description: Contract body. Newlines are preserved (stored internally with <br>).
        template:
          type: boolean
        templateID:
          type: string
          nullable: true
        customerID:
          type: string
          nullable: true
        primaryCustomerName:
          type: string
          nullable: true
        secondaryCustomerName:
          type: string
          nullable: true
        signed:
          type: boolean
        signedDate:
          type: string
          format: date-time
          nullable: true
        signedBy:
          type: string
          nullable: true
        sendToClients:
          type: boolean
        createdDate:
          type: string
          format: date-time
    CreditNote:
      type: object
      description: >
        Credit issued to a client. A credit note is a negative invoice, not a
        payment: applying one reduces what the client owes without any money
        changing hands, so it must never be counted as income. All amounts are
        in minor units (pence/cents). `notes` is deliberately omitted — it is
        the sitter's private field and is never returned by the API.
      properties:
        id:
          type: string
        companyID:
          type: string
          nullable: true
        customerID:
          type: string
          nullable: true
        reference:
          type: string
          description: Human-readable reference, always prefixed `CN-` so it is distinct from an invoice reference.
          example: CN-a1b2c3d4e5
        amount:
          type: integer
          description: Face value in minor units. Never changes once issued.
          example: 3000
        allocatedAmount:
          type: integer
          description: Sum of live (non-reversed) allocations.
          example: 1000
        remainingAmount:
          type: integer
          description: Still available to apply. Always 0 on a voided note.
          example: 2000
        status:
          type: string
          enum: [open, partiallyApplied, applied, void]
        reason:
          type: string
          description: Client-visible reason. May be empty — a reason is optional.
          example: Cancelled visit on 12 August
        currency:
          type: string
          nullable: true
          example: GBP
        country:
          type: string
          nullable: true
          example: GB
        serviceTaxPercentage:
          type: number
          nullable: true
        serviceTaxAmount:
          type: integer
          description: >
            Tax portion INCLUDED in `amount` (VAT-inclusive), unlike invoice tax
            which is added on top. On 20% against 5000 this is 833, not 1000.
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteAllocation'
        dateIssued:
          type: string
          format: date-time
        dateCreated:
          type: string
          format: date-time
        voidedAt:
          type: string
          format: date-time
          nullable: true
    CreditNoteAllocation:
      type: object
      description: >
        One application of a credit note against one invoice. Reversal is soft —
        `reversedAt` is stamped and the entry is kept — so the audit trail
        survives a credit that was applied and then pulled back.
      properties:
        id:
          type: string
          description: Also the id of the matching row in the invoice's payments array, and the `allocationID` used to unapply.
        invoiceID:
          type: string
          nullable: true
        invoiceReference:
          type: string
        amount:
          type: integer
        dateApplied:
          type: string
          format: date-time
        reversedAt:
          type: string
          format: date-time
          nullable: true
    Checklist:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          example: New Client Onboarding
        type:
          type: string
          enum: [customer, pet]
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        pets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              customerID:
                type: string
        customers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              firstName:
                type: string
              lastName:
                type: string
    CustomQuestion:
      type: object
      description: >-
        A company-defined extra profile field. A `customer` question renders on the
        client profile editor, a `pet` question on the pet editor, and the answer is
        stored in that record's `customQuestionAnswers` map keyed by this id.
      properties:
        id:
          type: string
        title:
          type: string
          example: Where is the spare key kept?
        type:
          type: string
          enum: [customer, pet]
          description: Immutable after creation — changing it would orphan every existing answer.
        required:
          type: boolean
          description: >-
            Enforced only on the CLIENT-facing surfaces (the Journal apps and the
            self-signup link), which block the profile save until the question is
            answered. Sitter apps show the question but never block on it. The API
            deliberately does not enforce it either, so existing integrations keep
            working when a question is marked required.
    CustomQuestionAnswers:
      type: object
      description: >-
        Free-text answers keyed by custom question id (from GET /custom-questions).
        On PATCH the map is MERGED key by key: send only the answers you are
        changing and the rest are left untouched, or send the complete set as the
        apps do. Either way "" means unanswered, and sending "" is how an answer is
        cleared. Maximum 100 entries, 2000 characters each. An id matching no
        question is stored but never displayed.
      additionalProperties:
        type: string
      example:
        aB3dEfGhIjKlMnOpQrSt: Under the third plant pot
    Address:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Home
        lineOne:
          type: string
        lineTwo:
          type: string
        city:
          type: string
        postcode:
          type: string
        state:
          type: string
        country:
          type: string
        lat:
          type: number
        long:
          type: number
    CustomUpdate:
      type: object
      description: A reusable custom timeline update (CustomTimelineUpdate).
      properties:
        id:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [pet, general]
        serviceTypes:
          type: array
          items:
            type: string
        customers:
          type: array
          items:
            type: object
        pets:
          type: array
          items:
            type: object
    RecurringInvoice:
      type: object
      description: >-
        An automatic (recurring) invoice schedule. The system generates an invoice for
        the customer's activities on each run. frequency=weekly/biweekly/monthly,
        dayOfWeek 0=Sunday..6=Saturday, timeOfDay 24h HH:mm, direction=past/future,
        status=active/paused.
      properties:
        id: { type: string }
        customerID: { type: string }
        customerFirstName: { type: string }
        customerLastName: { type: string }
        frequency: { type: string, enum: [weekly, biweekly, monthly] }
        dayOfWeek: { type: integer, description: 0=Sunday..6=Saturday }
        timeOfDay: { type: string, description: "24-hour HH:mm" }
        direction: { type: string, enum: [past, future] }
        timezone: { type: string }
        status: { type: string, enum: [active, paused] }
        dueDateOffset: { type: integer, description: Days until the generated invoice is due }
        paymentMethod: { type: string }
        pets: { type: array, items: { type: object } }
        nextGenerationDate: { type: string, format: date-time, nullable: true }
        lastGeneratedDate: { type: string, format: date-time, nullable: true }
        createdDate: { type: string, format: date-time, nullable: true }
    AppointmentWindow:
      type: object
      description: A bookable time window. startTime/endTime are 24-hour HH:mm; days are weekday numbers (0=Sunday).
      properties:
        id: { type: string }
        name: { type: string }
        startTime: { type: string, description: "24-hour HH:mm" }
        endTime: { type: string, description: "24-hour HH:mm" }
        days:
          type: array
          items: { type: integer }
          description: Weekday numbers 0=Sunday..6=Saturday
    NotificationSettings:
      type: object
      description: >-
        Per-event toggles for what CUSTOMERS get notified about. All booleans (default
        true). Keys include walkStarted, walkFinished, invoiceCreated, appointmentBooked,
        appointmentAccepted, readyForPickup, etc.
      additionalProperties: { type: boolean }
    BookingSettings:
      type: object
      description: Customer-facing booking, availability and cancellation settings.
      properties:
        allowClientBooking: { type: boolean, description: Whether customers can request/book appointments }
        allowTeamMemberSelection: { type: boolean, nullable: true, description: Whether customers can pick a team member }
        appointmentWindows: { type: boolean, nullable: true, description: Whether bookings use appointment windows }
        appointmentWindowsBasedOnAvailability: { type: boolean, nullable: true, description: "Only show windows with enough time for the booking: a window is offered only when a team member has room in it for the booking, leaving travelBufferMinutes around their other appointments. Only applies while appointmentWindows is on." }
        checkAvailability: { type: boolean, description: Whether availability is checked when customers book (so they cannot book unavailable slots) }
        allowCustomerCancellation: { type: boolean, description: Whether customers can cancel }
        cancellationDaysBeforeAppointment: { type: integer, description: "The free-cancellation window: minimum days before an appointment a customer may cancel free of charge. At least 1 while the cancellation fee is on." }
        cancellationFeeEnabled: { type: boolean, description: "Whether a cancellation fee applies to appointments cancelled inside the window. Turning it on raises cancellationDaysBeforeAppointment to at least 1." }
        cancellationFeeValueType: { type: string, enum: [percentage, fixed, fullPrice], description: "How the fee is worked out: a percentage of the appointment's price, a flat amount (never more than the appointment's price), or its full price." }
        cancellationFeePercentage: { type: number, nullable: true, minimum: 0, exclusiveMinimum: true, maximum: 100, description: Fee percentage when cancellationFeeValueType is percentage }
        cancellationFeeAmount: { type: integer, nullable: true, minimum: 1, description: Flat fee in minor units when cancellationFeeValueType is fixed }
        travelBufferMinutes: { type: integer, minimum: 0, maximum: 240, description: "Minutes clients must leave between their booking and another appointment for the same team member. Applies to exact times when checkAvailability is on, and to appointment windows when appointmentWindowsBasedOnAvailability is on. 0 = no buffer." }
        blockBookingsWhenInvoicesUnpaid: { type: boolean, description: "Whether clients with an overdue invoice (due date passed, money still owing) must pay it before they can book. Sitter-created appointments are never blocked. Turning it off also turns off blockBookingsForAllUnpaidInvoices. Default false." }
        blockBookingsForAllUnpaidInvoices: { type: boolean, description: "Only while blockBookingsWhenInvoicesUnpaid is on: whether clients with any unpaid invoice, even one that is not due yet, must pay it before they can book. Clients billed monthly are then blocked whenever an invoice is open. Setting it on while blockBookingsWhenInvoicesUnpaid is off is refused. Default false." }
        allowSameDayBooking: { type: boolean, description: "Whether clients can book for today. Off means the earliest a client can book is tomorrow, by the company's local day; stays and appointment windows that start today count as same day. Sitter-created appointments are never blocked. Default true." }
        allowNewClientBooking: { type: boolean, description: "Whether people who are not clients yet can request a booking from the public profile and website (they are added to the clients when the sitter accepts their first booking). Only applies while allowClientBooking is on. Existing clients are unaffected. Default true." }
        autoAcceptExistingClients: { type: boolean, description: "Accept bookings from existing clients automatically: a client already on the client list who books gets Booked at once instead of a request, with the usual booking confirmation. A booking that clashes, is over capacity, is outside working hours or has no payment method for its invoice stays a request (see autoAcceptSkippedReason on the appointment). Admins and Sub Admins only. Default false." }
        autoAcceptNewClients: { type: boolean, description: "Accept bookings from new clients automatically: someone booking for the first time through the public profile or website is accepted at once and becomes an active client, under the same checks as autoAcceptExistingClients. Admins and Sub Admins only. Default false." }
        tipsEnabled: { type: boolean, description: "Allow tips: whether clients can add a tip when they pay an invoice or pay at booking, and whether Auto-pay adds their tip. When false, clients are never offered a tip and any tip a client sends is not charged; tips the business records itself are unaffected. Default true." }
        noTipOption: { type: boolean, description: "Show No tip: add a No tip choice to the tip amounts clients can pick when they pay. Only applies while tipsEnabled is on. Default false." }
        newClientFirstBookingServiceID: { type: string, nullable: true, description: "The service a new client's first booking has to be, such as a meet and greet (a service ID). A new client is someone who signed up through the public booking page and has no accepted booking yet; once the sitter accepts their first booking they can book any service. Only applies while allowClientBooking and allowNewClientBooking are on. If the service is deleted or hidden, the requirement is off. null when off. In PATCH, send an empty string to turn it off." }
    RegionSettings:
      type: object
      description: >-
        Company region. Setting `country` auto-sets `currency` (the apps' country→currency map);
        `currency` sent on its own (no `country`) is used as-is. `timezone` is the authoritative
        booking calendar and cannot be changed once future appointments, repeat series,
        weekly/special hours, appointment windows, surcharge rules, or recurring invoices exist.
        `businessLanguage` is the language the business works in.
      properties:
        country: { type: string, description: ISO 3166-1 alpha-2 country code (e.g. US, GB, FR). Setting this auto-sets currency. }
        currency: { type: string, description: ISO 4217 currency code. Derived from country when country is set; honoured directly only when country is omitted. }
        timezone: { type: string, description: IANA timezone name (e.g. Europe/London, America/New_York). }
        businessLanguage:
          type: string
          nullable: true
          description: >-
            The business's language, as a lowercase ISO 639-1 code from the supported languages
            (currently en, fr, es, pt, de, it, nl, tr, uk, da, sv, pl, nb, el, fi, ja, ko, hi; pt is Brazilian Portuguese). Messages to clients and team members who have no language of their
            own, and the public website, use it. null means automatic: the country's language
            (e.g. FR→fr, BE→nl, BR→pt, GB→en). Send null to return to automatic. A person's own app
            language always wins over it.
    TravelLog:
      type: object
      description: >-
        A recorded travel/mileage log. Raw GPS coordinates are excluded from API responses.
        Distance and odometer values are always stored and returned in metres.
      properties:
        id:
          type: string
        companyID:
          type: string
          nullable: true
        distance:
          type: number
          description: Distance travelled, in metres.
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
        pets:
          type: array
          items:
            type: object
        teamMembers:
          type: array
          items:
            type: object
        loggingTeamMember:
          type: object
          nullable: true
        appointmentID:
          type: string
          nullable: true
        startOdometerReading:
          type: number
          nullable: true
        endOdometerReading:
          type: number
          nullable: true
    SpecialHours:
      type: object
      description: >-
        A date-specific exception to the normal weekly opening hours — a day off,
        holiday, or one-off different hours. closed=true means not working that whole
        day (times is empty). The date is in the company timezone.
      properties:
        id:
          type: string
        date:
          type: string
          format: date
          description: The calendar date this applies to (YYYY-MM-DD, in the company timezone)
        closed:
          type: boolean
          description: true = closed / not working all day; false = open with the time blocks below
        times:
          type: array
          description: Open time blocks for the day (empty when closed)
          items:
            type: object
            properties:
              start:
                type: string
                description: Block start, 24-hour HH:mm (e.g. 09:00)
              end:
                type: string
                description: Block end, 24-hour HH:mm (e.g. 17:00)
    WorkingDay:
      type: object
      description: >-
        The regular WEEKLY working/opening hours for one weekday. closed=true means
        no hours that weekday (times is empty). Blocks are non-overlapping.
      properties:
        day:
          type: integer
          description: Weekday index, 0=Sunday … 6=Saturday
        dayName:
          type: string
          description: Weekday name (e.g. Monday)
        closed:
          type: boolean
          description: true = closed that weekday (times is empty)
        times:
          type: array
          description: Open time blocks for the weekday (empty when closed)
          items:
            type: object
            properties:
              start:
                type: string
                description: Block start, 24-hour HH:mm (e.g. 09:00)
              end:
                type: string
                description: Block end, 24-hour HH:mm (e.g. 17:00)
    Company:
      type: object
      description: Merged public company profile plus read-only counters. Region fields (country/currency/timezone) are read-only and cannot be set via PATCH.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        location:
          type: string
        logo:
          type: string
          nullable: true
        cover:
          type: string
          nullable: true
        profile:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        address:
          type: object
          nullable: true
        country:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        preferredPaymentMethod:
          type: string
          nullable: true
        preferredInvoiceType:
          type: string
          nullable: true
        customerPaysFee:
          type: boolean
        serviceTax:
          type: number
          nullable: true
        depositPercentage:
          type: number
          nullable: true
        dueDateOffset:
          type: integer
          nullable: true
        depositDueDateOffset:
          type: integer
          nullable: true
          description: >
            Days after an invoice is RAISED that its deposit falls due. Counted from the
            invoice creation date, unlike dueDateOffset, which a booked invoice counts
            from the service date. Null means deposits are due with the invoice.
        invoicesEnabled:
          type: boolean
        sendContracts:
          type: boolean
        appointmentSharing:
          type: boolean
        invoiceRemindersEnabled:
          type: boolean
          description: Automatic reminders for unpaid invoices. Enabling via PATCH requires a Max subscription.
        appointmentReminders:
          type: boolean
          description: Reminders sent to clients before appointments. Enabling via PATCH requires a Max subscription.
        appointmentReminderDelay:
          type: integer
          nullable: true
          description: Minutes before the appointment the reminder is sent.
        bankTransfer:
          type: object
          nullable: true
          description: Bank-transfer details. Sub-fields accountNumber and routingNumber (US routing / UK sort code / CA transit). Deep-merged on PATCH — send only the fields you're changing.
          properties:
            accountNumber: { type: string }
            routingNumber: { type: string }
        paypalURL:
          type: string
          nullable: true
          description: PayPal username only (no URL / @). Rendered as paypal.me/<username>.
        venmoURL:
          type: string
          nullable: true
          description: Venmo username only (no URL / @). Rendered as venmo.com/<username>.
        cashAppURL:
          type: string
          nullable: true
          description: Cash App cashtag including the leading $ (e.g. $jane). Rendered as cash.app/$<cashtag>.
        zelleInformation:
          type: string
          nullable: true
          description: Zelle recipient — an email or phone number.
        chequeTitle:
          type: string
          nullable: true
          description: Payee name for cheques.
        otherService:
          type: string
          nullable: true
          description: Free-text instructions for the "Other" payment method.
        subscriptionStatus:
          type: string
          nullable: true
          readOnly: true
        teamMemberCount:
          type: integer
          readOnly: true
        walkCount:
          type: integer
          readOnly: true
        hikeCount:
          type: integer
          readOnly: true
        runCount:
          type: integer
          readOnly: true
        taxiCount:
          type: integer
          readOnly: true
        petSittingCount:
          type: integer
          readOnly: true
    Conversation:
      type: object
      properties:
        id:
          type: string
        customerID:
          type: string
        customerFirstName:
          type: string
        customerLastName:
          type: string
        unreadCompanyMessageCount:
          type: integer
        unreadCustomerMessageCount:
          type: integer
        lastMessage:
          type: object
          nullable: true
          description: The latest message in the conversation. Attachment URLs follow the same rules as on a Message.
          properties:
            message:
              type: string
            senderID:
              type: string
            sentDate:
              type: string
              format: date-time
              nullable: true
            attachments:
              type: array
              items:
                $ref: '#/components/schemas/MessageAttachment'
            attachmentsExpired:
              type: boolean
            messageIsAttachmentFallback:
              type: boolean
    MessageAttachment:
      type: object
      description: >-
        A photo, video, GIF or file sent with a message (Max companies and their clients). A file message
        carries exactly one file, of any type except audio, up to 25 MB. Photos, videos and files are removed
        30 days after the message was sent; the message text stays. Until then `url` (and `posterUrl` for a
        video) is a signed link that works for about an hour, so fetch the file soon after reading it. A
        file's link always downloads it (it is never shown in the browser). GIFs link to KLIPY. Once removed,
        only `id` and `type` are returned and the message has `attachmentsExpired: true`.
      properties:
        id:
          type: string
        type:
          type: string
          enum: [image, video, gif, file]
        width:
          type: number
          nullable: true
        height:
          type: number
          nullable: true
        duration:
          type: number
          nullable: true
          description: Video length in seconds.
        url:
          type: string
          nullable: true
          description: Short-lived signed link to the file, or the KLIPY link for a GIF.
        posterUrl:
          type: string
          nullable: true
          description: Short-lived signed link to a video's poster image.
        fileName:
          type: string
          description: A file's name as it was sent (files only).
        size:
          type: integer
          nullable: true
          description: A file's size in bytes (files only).
        contentType:
          type: string
          nullable: true
          description: A file's media type as the sender's device reported it (files only).
    AutoReplySettings:
      type: object
      properties:
        enabled:
          type: boolean
          description: Off unless the business turns it on.
        message:
          type: string
          maxLength: 1000
    Message:
      type: object
      properties:
        id:
          type: string
        autoReply:
          type: boolean
          readOnly: true
          description: True when the business's automatic reply sent this message. Omitted on every other message.
        message:
          type: string
          description: The message text. When `messageIsAttachmentFallback` is true this is generic text such as "Sent a photo" that Walkies added for apps that cannot show attachments, not something the sender typed.
        senderID:
          type: string
        actorUserID:
          type: string
          readOnly: true
          description: Authenticated individual associated with a server-verified attribution snapshot. Omitted for legacy and machine-originated messages without a verified individual.
        actorType:
          type: string
          enum: [teamMember, owner]
          readOnly: true
        linkPreview:
          type: object
          readOnly: true
          description: Optional server-fetched first-link preview. Fetching never delays send. MCP message results retain text metadata but omit inline image bytes.
          properties:
            status:
              type: string
              enum: [pending, ready, none]
            url:
              type: string
              maxLength: 2048
            title:
              type: string
              maxLength: 300
            description:
              type: string
              maxLength: 1000
            imageDataURL:
              type: string
              maxLength: 21871
              description: Optional validated JPEG data URL, at most 16 KiB decoded and 320 pixels. Never an external image URL.
            themeColor:
              type: string
              pattern: '^#[0-9A-F]{6}$'
              description: Optional colour from the page's theme-color meta tag (the first valid one without a media query, else the light-scheme one), normalised to uppercase "#RRGGBB". Omitted when the page has none.
        linkPreviewSuppressed:
          type: boolean
          readOnly: true
          description: True after the sender removes the card. Text remains unchanged and fetch retries cannot restore the card.
        actorDisplayName:
          type: string
          maxLength: 120
          readOnly: true
          description: Customer-safe send-time display label. Use only with the complete actor tuple; do not resolve a current name for historical messages.
        customerID:
          type: string
        companyRead:
          type: boolean
        customerRead:
          type: boolean
        sentDate:
          type: string
          format: date-time
          nullable: true
        sentByAssistant:
          type: boolean
          description: Present and true when this message was sent by the Walkies AI assistant. Omitted for messages sent by a human team member.
        attachments:
          type: array
          description: Photos, videos and GIFs sent with the message, in display order. Empty for a text message.
          items:
            $ref: '#/components/schemas/MessageAttachment'
        attachmentsExpired:
          type: boolean
          description: True once the message's photos and videos have been removed (30 days after sending).
        messageIsAttachmentFallback:
          type: boolean

paths:
  /me:
    get:
      summary: Test Authentication
      description: Returns company information for the authenticated API key. Use this to verify your key is valid.
      tags: [Authentication]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyInfo'
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Walkies API subscription required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers:
    get:
      summary: List Customers
      description: Returns all customers. Optionally filter by email or name.
      tags: [Customers]
      parameters:
        - name: email
          in: query
          schema:
            type: string
          description: Filter by exact email match
        - name: name
          in: query
          schema:
            type: string
          description: Filter by name (partial match on first + last name)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Create Customer
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName]
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phoneNumber:
                  type: string
                address:
                  type: string
                notes:
                  type: string
                accessInformation:
                  type: string
                emergencyContactName:
                  type: string
                emergencyPhoneNumber:
                  type: string
                preferredPaymentMethod:
                  type: string
                  enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
                preferredInvoiceType:
                  type: string
                  description: This client's default billing/invoice type.
                  enum: [single, whenStarted, prePaid, recurring, none]
                preferredLanguage:
                  type: string
                  enum: [en, fr, es, pt, de, it, nl, tr, uk, da, sv, pl, nb, el, fi, ja, ko, hi]
                  description: Language for messages to the main owner. Sets it as chosen by the business, so the client's Journal app won't change it.
                secondaryPreferredLanguage:
                  type: string
                  enum: [en, fr, es, pt, de, it, nl, tr, uk, da, sv, pl, nb, el, fi, ja, ko, hi]
                  description: Language for messages to the second owner.
                secondaryFirstName:
                  type: string
