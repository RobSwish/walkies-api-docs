  /webhooks:
    get:
      summary: List Webhook Subscriptions
      tags: [Webhooks]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Webhook'
    post:
      summary: Subscribe to Webhooks
      description: |
        Subscribe to receive webhook notifications when events occur.
        Webhook payloads are signed with HMAC-SHA256 using the returned secret.
        The signature is sent in the `X-Walkies-Signature` header.
      tags: [Webhooks]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url:
                  type: string
                  format: uri
                  description: URL to receive webhook POST requests
                events:
                  type: array
                  items:
                    type: string
                    enum:
                      - appointment.created
                      - appointment.updated
                      - appointment.cancelled
                      - customer.created
                      - customer.updated
                      - invoice.created
                      - invoice.paid
                      - walk.started
                      - walk.finished
                      - taxi.started
                      - taxi.finished
                      - petsitting.started
                      - petsitting.finished
                      - petsitting.readyForPickup
                      - message.received
                      - contract.signed
                      - announcement.created
                      - announcement.updated
                      - team_member.added
                      - team_member.removed
      responses:
        '201':
          description: Subscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'

  /webhooks/{id}:
    delete:
      summary: Unsubscribe from Webhook
      tags: [Webhooks]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
