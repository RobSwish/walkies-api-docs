          description: Broadcast sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  sentTo:
                    type: integer
                  skippedNoName:
                    type: integer
                    description: Linked customers left out because neither owner has a name.
                  skippedArchived:
                    type: integer
                    description: Archived customers left out of the broadcast.
        '400':
          description: No linked customers or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
