  /recurring-invoices:
    get:
      summary: List Recurring Invoices
      tags: [Recurring Invoices]
      parameters:
        - { name: limit, in: query, schema: { type: integer } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: Success
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RecurringInvoice' } } } }
    post:
      summary: Create Recurring Invoice
      description: >-
        Create an automatic invoice schedule for a customer. A client may have only ONE
        recurring invoice — if one already exists this returns 409 (with the existing id);
        update that one instead. status defaults to active; the first run is computed from
        frequency/dayOfWeek/timeOfDay in the company timezone; paymentMethod + dueDateOffset
        default from company settings. The response includes nextGenerationDate (the next run).
      tags: [Recurring Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerID, frequency]
              properties:
                customerID: { type: string }
                frequency: { type: string, enum: [weekly, biweekly, monthly] }
                dayOfWeek: { type: integer, description: '0=Sunday..6=Saturday (default 1=Monday)' }
                timeOfDay: { type: string, description: '24-hour HH:mm (default 09:00)' }
                direction: { type: string, enum: [past, future], description: 'Bill the past or upcoming period (default past)' }
                status: { type: string, enum: [active, paused] }
                dueDateOffset: { type: integer }
                paymentMethod: { type: string }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/RecurringInvoice' } } } }
        '400': { description: Validation error }
        '409': { description: The client already has a recurring invoice (update it instead); response includes existingId }
  /recurring-invoices/{id}:
    get:
      summary: Get Recurring Invoice
      tags: [Recurring Invoices]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Success, content: { application/json: { schema: { $ref: '#/components/schemas/RecurringInvoice' } } } }
        '404': { description: Not found }
    patch:
      summary: Update Recurring Invoice
      description: Change the schedule (frequency/dayOfWeek/timeOfDay recompute the next run), direction, status (pause/resume), paymentMethod, or dueDateOffset.
      tags: [Recurring Invoices]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                frequency: { type: string, enum: [weekly, biweekly, monthly] }
                dayOfWeek: { type: integer }
                timeOfDay: { type: string }
                direction: { type: string, enum: [past, future] }
                status: { type: string, enum: [active, paused] }
                dueDateOffset: { type: integer }
                paymentMethod: { type: string }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/RecurringInvoice' } } } }
        '404': { description: Not found }
    delete:
      summary: Delete Recurring Invoice
      tags: [Recurring Invoices]
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200': { description: Deleted }
        '404': { description: Not found }
