  /appointments/{id}:
    patch:
      summary: Update Appointment
      description: >-
        Updates schedule/status fields, reassigns team members, and changes the service or add-ons.
        Changing the service to one with a different cadence (perService/perDay/perNight) affects how
        billing quantity is derived; when that happens the response includes a `warning` and the dates
        are left unchanged (pass startDate/endDate to adjust them). Offsetless
        schedule values are company-local; the company timezone is required and
        cannot be overridden by the caller. A legacy appointment stamped with a
        different timezone must be explicitly migrated by supplying both
        startDate and endDate before its schedule is changed. Notes, status and
        request acceptance preserve its stored instant and timezone metadata;
        responses and business rules project that instant into company time.
      tags: [Appointments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [confirmed, requested, declined]
                  description: >-
                    Set to confirmed on a requested appointment to ACCEPT the request. On
                    accept, the customer is notified by default (set notifyCustomer:false
                    to suppress).
                notifyCustomer:
                  type: boolean
                  description: >-
                    Only applies when accepting a request (requested → confirmed). Defaults
                    to true (the customer gets an "appointment accepted" notification);
                    set false to accept without notifying.
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                timezone:
                  type: string
                  readOnly: true
                  description: Ignored on input; schedule edits retain the company timezone.
                allDay:
                  type: boolean
                notes:
                  type: string
                serviceID:
                  type: string
                  description: >-
                    Optional. Changes the primary service (look up ids via GET /services). The appointment's
                    `type` updates automatically to match the new service. If the new
                    service has a different cadence (perService/perDay/perNight) the response includes a
                    `warning` and the dates are NOT auto-adjusted — review them and pass startDate/endDate
                    if the duration should change.
                additionalServiceIDs:
                  type: array
                  items:
                    type: string
                  description: >-
                    Optional. Sets the add-on services on this appointment (look up ids via GET /services).
                    Sending this REPLACES the current add-ons, so include every add-on that should remain.
                    Send an empty array to remove all add-ons.
                teamMemberIDs:
                  type: array
                  items:
                    type: string
                  description: >-
                    Optional. Reassigns the team members (sitters) on this appointment. Each id is
                    resolved against your team; unknown ids are skipped. Sending this REPLACES the
                    current assignee list, so include every team member who should be assigned (look
                    up ids via GET /team). Omit to leave the assignees unchanged.
                updatedByTeamMemberID:
                  type: string
                  description: >-
                    Optional. The team member to record as having made this update, validated against
                    your team (an unknown id returns 400). When set, it is stored on the appointment as
                    the last updater. When omitted, no updater is recorded for this change.
                depositDueDate:
                  type: string
                  format: date-time
                  nullable: true
                  description: >-
                    Optional. Sets the deposit deadline frozen onto this booking, which the
                    generated invoice inherits. Send null (or an empty string) to clear it, which
                    returns the deposit to falling due with the invoice. Setting a date (rather than clearing one)
                    returns 400 unless the appointment's stored invoiceType is 'single' or
                    'prePaid' AND it actually takes a deposit: a 'whenStarted' invoice computes
                    its own dates when the visit starts, and a booking with no deposit has
                    nothing for the deadline to apply to. invoiceType cannot be changed by this
                    endpoint, so the check is always against the stored value. Stored at the
                    start of the day in the company's timezone.
                confirmOverlap:
                  type: boolean
                  description: >-
                    When rescheduling to a time that overlaps another appointment (same team member or
                    pet), the API returns 200 with `{ requiresConfirmation: true, warning }` and does NOT
                    apply the change. Re-send with confirmOverlap=true to reschedule anyway. (External API
                    keys instead apply immediately and get a `warning`.)
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
        '404':
          description: Appointment not found
        '409':
          description: Legacy appointment requires explicit company-timezone migration
    delete:
      summary: Delete Appointment
      tags: [Appointments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '404':
          description: Appointment not found
