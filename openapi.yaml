  /services:
    get:
      summary: List Services
      description: Returns all configured services for your company.
      tags: [Services]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      summary: Create Service
      tags: [Services]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type]
              properties:
                title:
                  type: string
                  example: 1 Hour Walk
                type:
                  type: string
                  enum: [walk, dropin, hike, run, taxi, daycare, boarding, overnight, homeSitting, training, grooming, meetAndGreet, other]
                amount:
                  type: integer
                  description: >-
                    Price in MINOR UNITS (pence/cents), NOT major units. Multiply the user's amount
                    by 100, e.g. GBP 25.00 = 2500, GBP 10 = 1000.
                    REQUIRED unless pricingType is hourly, where it is derived from hourlyRate and
                    any value sent is overwritten.
                  example: 2500
                cadence:
                  type: string
                  enum: [perService, perDay, perNight]
                  default: perService
                allowOtherBookingsDuringStay:
                  type: boolean
                  nullable: true
                  description: Pet sitting services only. False stops the assigned team member being booked for other services during the stay. Null clears it.
                description:
                  type: string
                duration:
                  type: integer
                  description: Duration in minutes
                capacity:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: >-
                    Optional. How many pets can book the same start time with one team member. Unset
                    means one booking at a time. Customer bookings cannot go over it.
                bookingHours:
                  type: object
                  nullable: true
                  description: >-
                    Optional booking hours: when clients can book this service. Keys are weekdays "0" (Sunday)
                    to "6" (Saturday); each is { times: [{ startHour, startMinute, endHour, endMinute }] } in the
                    company timezone, up to 12 blocks a day that don't overlap. A missing weekday is closed.
                    Only client bookings are limited; staff can book any time. Unset uses the business hours.
                  additionalProperties:
                    type: object
                    properties:
                      times:
                        type: array
                        maxItems: 12
                        items:
                          type: object
                          properties:
                            startHour: { type: integer, minimum: 0, maximum: 23 }
                            startMinute: { type: integer, minimum: 0, maximum: 59 }
                            endHour: { type: integer, minimum: 0, maximum: 23 }
                            endMinute: { type: integer, minimum: 0, maximum: 59 }
                bookingSpecialDates:
                  type: object
                  nullable: true
                  description: >-
                    Optional special dates for this service's booking hours. Keys are company-local dates
                    "YYYY-MM-DD" (up to 400); each is { closed: true } or { times: [{ startHour, startMinute, endHour,
                    endMinute }] } with 1 to 12 blocks that don't overlap. On that date the service is closed or uses
                    these hours instead of its weekly booking hours. Company hours and special days still apply.
                    Past dates are kept but ignored. Only client bookings are limited.
                  additionalProperties:
                    type: object
                    properties:
                      date: { type: string, format: date, readOnly: true }
                      closed: { type: boolean }
                      times:
                        type: array
                        maxItems: 12
                        items:
                          type: object
                          properties:
                            startHour: { type: integer, minimum: 0, maximum: 23 }
                            startMinute: { type: integer, minimum: 0, maximum: 59 }
                            endHour: { type: integer, minimum: 0, maximum: 23 }
                            endMinute: { type: integer, minimum: 0, maximum: 59 }
                additionalPetAmount:
                  type: integer
                  description: Extra charge per additional pet, in MINOR UNITS (pence/cents) — × 100, e.g. £5 = 500.
                additionalPetAmounts:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
                  description: >-
                    Per-species extra charge per additional pet, in MINOR UNITS, keyed by pet type
                    (dog, small dog, large dog, puppy, cat, pig, bird, fish, small pet, reptile,
                    horse, other). Values must be non-negative integers; 0 makes that exact type
                    free as an additional pet. A pet type with no exact key falls back to
                    additionalPetAmount. Dog and the other dog types are independent keys.
                includedPetCount:
                  type: integer
                  nullable: true
                  minimum: 1
                  description: How many pets the base price covers before additional-pet charges apply. Blank means 1.
                pricingType:
                  type: string
                  enum: [fixed, hourly]
                  default: fixed
                  description: >-
                    Set to `hourly` to bill by time. An hourly service is priced from
                    `hourlyRate` and billed in whole `billingIncrementMinutes` units taken from
                    the booked span, so `amount` is DERIVED and any value sent for it is
                    overwritten. `amount` is therefore not required when creating an hourly
                    service, but `hourlyRate` is, and cadence must stay `perService`.
                hourlyRate:
                  type: integer
                  description: >-
                    Price per HOUR in MINOR UNITS (pence/cents) - x 100, e.g. GBP 30.00/hr = 3000.
                    Required when pricingType is hourly.
                  example: 3000
                additionalPetHourlyRate:
                  type: integer
                  description: Extra charge per additional pet, per HOUR, in MINOR UNITS.
                additionalPetHourlyRates:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
                  description: >-
                    Per-species extra charge per additional pet, per HOUR, in MINOR UNITS, keyed
                    exactly as additionalPetAmounts is. Scaled to the billing increment to derive
                    additionalPetAmounts.
                billingIncrementMinutes:
                  type: integer
                  enum: [15, 30, 60]
                  default: 30
                  description: The billable unit for an hourly service. Part units round up.
                minimumBillableMinutes:
                  type: integer
                  minimum: 0
                  description: Optional floor on the billed time for an hourly service, in minutes.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'

  /services/{id}:
    patch:
      summary: Update Service
      tags: [Services]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                type:
                  type: string
                amount:
                  type: number
                  description: Amount in pence/cents
                cadence:
                  type: string
                  enum: [perService, perDay, perNight]
                allowOtherBookingsDuringStay:
                  type: boolean
                  nullable: true
                  description: Pet sitting services only. False stops the assigned team member being booked for other services during the stay. Null clears it.
                description:
                  type: string
                duration:
                  type: integer
                capacity:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: >-
                    Optional. How many pets can book the same start time with one team member. Unset
                    means one booking at a time. Pass null to clear it.
                bookingHours:
                  type: object
                  nullable: true
                  description: >-
                    Optional booking hours: when clients can book this service. Keys are weekdays "0" (Sunday)
                    to "6" (Saturday); each is { times: [{ startHour, startMinute, endHour, endMinute }] } in the
                    company timezone, up to 12 blocks a day that don't overlap. A missing weekday is closed.
                    Only client bookings are limited; staff can book any time. Unset uses the business hours. Pass null to clear it; a value replaces the whole week.
                  additionalProperties:
                    type: object
                    properties:
                      times:
                        type: array
                        maxItems: 12
                        items:
                          type: object
                          properties:
                            startHour: { type: integer, minimum: 0, maximum: 23 }
                            startMinute: { type: integer, minimum: 0, maximum: 59 }
                            endHour: { type: integer, minimum: 0, maximum: 23 }
                            endMinute: { type: integer, minimum: 0, maximum: 59 }
                bookingSpecialDates:
                  type: object
                  nullable: true
                  description: >-
                    Optional special dates for this service's booking hours. Keys are company-local dates
                    "YYYY-MM-DD" (up to 400); each is { closed: true } or { times: [{ startHour, startMinute, endHour,
                    endMinute }] } with 1 to 12 blocks that don't overlap. On that date the service is closed or uses
                    these hours instead of its weekly booking hours. Company hours and special days still apply.
                    Past dates are kept but ignored. Only client bookings are limited. On update a value replaces every special date; null or {} clears them.
                  additionalProperties:
                    type: object
                    properties:
                      date: { type: string, format: date, readOnly: true }
                      closed: { type: boolean }
                      times:
                        type: array
                        maxItems: 12
                        items:
                          type: object
                          properties:
                            startHour: { type: integer, minimum: 0, maximum: 23 }
                            startMinute: { type: integer, minimum: 0, maximum: 59 }
                            endHour: { type: integer, minimum: 0, maximum: 23 }
                            endMinute: { type: integer, minimum: 0, maximum: 59 }
                additionalPetAmount:
                  type: integer
                  description: Extra charge per additional pet, in MINOR UNITS (pence/cents).
                additionalPetAmounts:
                  type: object
                  nullable: true
                  additionalProperties:
                    type: integer
                    minimum: 0
                  description: >-
                    Per-species extra charge per additional pet, in MINOR UNITS, keyed by pet type
                    (dog, small dog, large dog, puppy, cat, pig, bird, fish, small pet, reptile,
                    horse, other). Dog and the other dog types are independent keys. The map
                    replaces the stored one wholesale (omitted species are removed). Send null to
                    clear every per-species rate.
                includedPetCount:
                  type: integer
                  nullable: true
                  minimum: 1
                  description: How many pets the base price covers before additional-pet charges apply. Send null to clear it.
                pricingType:
                  type: string
                  enum: [fixed, hourly]
                  description: >-
                    Switch a service between a fixed price and hourly billing. Setting `hourly`
                    requires the service to have (or to be given in the same request) an
                    `hourlyRate`, and re-derives `amount` from it. Setting `fixed` clears every
                    hourly field; `amount` then keeps whatever you send, or the last derived
                    per-unit price.
                hourlyRate:
                  type: integer
                  description: Price per HOUR in MINOR UNITS (pence/cents). Re-derives amount when changed.
                additionalPetHourlyRate:
                  type: integer
                  description: Extra charge per additional pet, per HOUR, in MINOR UNITS.
                additionalPetHourlyRates:
                  type: object
                  nullable: true
                  additionalProperties:
                    type: integer
                    minimum: 0
                  description: >-
                    Per-species extra charge per additional pet, per HOUR, in MINOR UNITS. Replaces
                    the stored map wholesale (omitted species are removed); send null to clear.
                billingIncrementMinutes:
                  type: integer
                  enum: [15, 30, 60]
                  description: The billable unit for an hourly service. Re-derives amount when changed.
                minimumBillableMinutes:
                  type: integer
                  minimum: 0
                  description: Optional floor on the billed time for an hourly service, in minutes.
                hidden:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          description: Service not found
    delete:
      summary: Delete Service
      description: Soft-deletes the service (sets hidden=true) so existing invoice/appointment references are preserved.
      tags: [Services]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted (hidden)
        '404':
          description: Service not found
    get:
      summary: Get Service
      tags: [Services]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          description: Service not found

  /surcharges:
    get:
      summary: List Surcharges
      description: Returns the company's surcharge catalog.
      tags: [Surcharges]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum rules to return in this page.
        - name: cursor
          in: query
          description: Document id returned in X-Next-Cursor by the previous page.
          schema:
            type: string
      responses:
        '200':
          description: Success
          headers:
            X-Next-Cursor:
              description: Pass this value as cursor to read the next page. Omitted when no further page is indicated.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Surcharge'
    post:
      summary: Create Surcharge
      description: >-
        Creates a catalog surcharge. It auto-applies to matching NEW bookings
        from creation onward; existing appointments and invoices are never
        retro-surcharged.
      tags: [Surcharges]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, valueType]
              properties:
                title:
                  type: string
                  maxLength: 100
                  example: Christmas
                valueType:
                  type: string
                  enum: [fixed, percentage]
                amount:
                  type: integer
                  minimum: 1
                  description: >-
                    Required for valueType fixed. MINOR UNITS (pence/cents), NOT
                    major units: £5.00 = 500.
                  example: 500
                percentage:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 100
                  description: Required for valueType percentage. Must be above 0 and no more than 100; 15 = 15% of the matched services' line totals.
                startDate:
                  type: string
                  format: date
                  description: Inclusive company-local calendar date. Offset-bearing date-times are accepted for compatibility and normalised to the containing company day.
                endDate:
                  type: string
                  format: date
                  description: Inclusive company-local calendar date. Offset-bearing date-times are accepted for compatibility and normalised to the containing company day.
                repeatsAnnually:
                  type: boolean
                  default: false
                  description: Both startDate and endDate are required when true.
                daysOfWeek:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                  description: 0 = Sunday .. 6 = Saturday. Omit or empty for any day.
                startMinuteOfDay:
                  type: integer
                  minimum: 0
                  maximum: 1439
                  description: >-
                    Company-local minute of day (540 = 09:00). Tests the
                    appointment's START time; wraps midnight when end < start.
                    Both time bounds must be supplied and cannot be equal.
                endMinuteOfDay:
                  type: integer
                  minimum: 0
                  maximum: 1439
                  description: Must be supplied with startMinuteOfDay and cannot equal it.
                serviceIDs:
                  type: array
                  items:
                    type: string
                  description: Omit or empty for all services.
                petTypes:
                  type: array
                  items:
                    type: string
                    enum: [dog, small dog, large dog, puppy, cat, pig, bird, fish, small pet, reptile, horse, other]
                  description: Matching is exact, so each dog type must be selected separately. Omit or empty for any pet. Combined with petIDs as an intersection.
                petIDs:
                  type: array
                  items:
                    type: string
                customerIDs:
                  type: array
                  items:
                    type: string
                  description: Omit or empty for any client. Tested against each pet's own owner, not the appointment's customer, so a booking shared by two households is surcharged only when one of the scoped client's pets is on it. Client scoping never multiplies a fixed amount; it is charged once per appointment, or per stay day or night. Only petTypes and petIDs multiply it by the matching pets.
                hidden:
                  type: boolean
                  default: false
                  description: Omit or false to apply the new surcharge automatically when its criteria are met, as the apps' Automatically apply switch does by default. Only true makes it manual only.
                position:
                  type: integer
                  default: 0
                  minimum: 0
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Surcharge'

  /surcharges/{id}:
    get:
      summary: Get Surcharge
      tags: [Surcharges]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Surcharge'
        '404':
          description: Surcharge not found
    patch:
      summary: Update Surcharge
      description: >-
        Updates the catalog entry only. Surcharges already applied to
        appointments or invoices are frozen snapshots and never change.
        Explicit null clears an optional window field (startDate, endDate,
        startMinuteOfDay, endMinuteOfDay). Time bounds must be set or cleared
        together. An annual date bound cannot be cleared unless
        repeatsAnnually is also disabled (or both annual bounds remain set).
      tags: [Surcharges]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 100
                valueType:
                  type: string
                  enum: [fixed, percentage]
                amount:
                  type: integer
                  minimum: 1
                  description: Positive MINOR UNITS (pence/cents).
                percentage:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 100
                  description: Must be above 0 and no more than 100.
                startDate:
                  type: string
                  format: date
                  nullable: true
                  description: Inclusive company-local calendar date; null clears it.
                endDate:
                  type: string
                  format: date
                  nullable: true
                  description: Inclusive company-local calendar date; null clears it.
                repeatsAnnually:
                  type: boolean
                daysOfWeek:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                startMinuteOfDay:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 1439
                  description: Set or clear together with endMinuteOfDay; the two values cannot be equal.
                endMinuteOfDay:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 1439
                  description: Set or clear together with startMinuteOfDay; the two values cannot be equal.
                serviceIDs:
                  type: array
                  items:
                    type: string
                petTypes:
                  type: array
                  items:
                    type: string
                    enum: [dog, small dog, large dog, puppy, cat, pig, bird, fish, small pet, reptile, horse, other]
                  description: Matching is exact, so each dog type must be selected separately.
                petIDs:
                  type: array
                  items:
                    type: string
                customerIDs:
                  type: array
                  items:
                    type: string
                hidden:
                  type: boolean
                  description: true turns Automatically apply off (manual only); false turns it back on.
                position:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Surcharge'
        '404':
          description: Surcharge not found
    delete:
      summary: Delete Surcharge
      description: >-
        Permanently deletes the catalog entry (unlike the soft-hide on
        services). Applied surcharges are frozen copies, so issued invoices
        keep rendering their snapshots; deletion only stops future
        auto-apply and removes it from pickers.
      tags: [Surcharges]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '404':
          description: Surcharge not found

  /vaccinations/types:
