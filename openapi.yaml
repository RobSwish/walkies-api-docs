        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '404':
          description: Pet not found
    delete:
      summary: Delete Pet
      description: Soft-archives by default (status=archived). Pass ?hard=true with header X-Confirm-Delete:true to permanently delete.
      tags: [Pets]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: hard
          in: query
          schema:
            type: string
            enum: ['true', 'false']
        - name: X-Confirm-Delete
          in: header
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: Archived or deleted
        '400':
          description: Hard delete requires confirmation header
        '404':
          description: Pet not found
