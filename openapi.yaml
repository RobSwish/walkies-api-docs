        setting closed=false lets you supply new open blocks.
      tags: [Special Hours]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                date:
                  type: string
                  format: date
                closed:
                  type: boolean
                times:
                  type: array
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start:
                        type: string
                        description: 24-hour HH:mm
                      end:
                        type: string
                        description: 24-hour HH:mm
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpecialHours'
        '404':
          description: Special hours entry not found
