  /surcharges:
    get:
      summary: List Surcharges
      description: Returns the company's surcharge catalog.
      tags: [Surcharges]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          description: Maximum rules to return in this page.
        - name: cursor
          in: query
          schema:
            type: string
          description: Document id returned in X-Next-Cursor by the previous page.
      responses:
        '200':
          description: Success
          headers:
            X-Next-Cursor:
              description: Pass this value as cursor to read the next page. Omitted when no further page is indicated.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Surcharge'
    post:
      summary: Create Surcharge
      description: >-
        Creates a catalog surcharge. It auto-applies to matching NEW bookings
        from creation onward; existing appointments and invoices are never
        retro-surcharged.
      tags: [Surcharges]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, valueType]
              properties:
                title:
                  type: string
                  maxLength: 100
                  example: Christmas
                valueType:
                  type: string
                  enum: [fixed, percentage]
                amount:
                  type: integer
                  minimum: 1
                  description: >-
                    Required for valueType fixed. MINOR UNITS (pence/cents), NOT
                    major units: £5.00 = 500.
                  example: 500
                percentage:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 100
                  description: Required for valueType percentage. Must be above 0 and no more than 100; 15 = 15% of the matched services' line totals.
                startDate:
                  type: string
                  format: date
                  description: Inclusive company-local calendar date. Offset-bearing date-times are accepted for compatibility and normalised to the containing company day.
                endDate:
                  type: string
                  format: date
                  description: Inclusive company-local calendar date. Offset-bearing date-times are accepted for compatibility and normalised to the containing company day.
                repeatsAnnually:
                  type: boolean
                  default: false
                  description: Both startDate and endDate are required when true.
                daysOfWeek:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                  description: 0 = Sunday .. 6 = Saturday. Omit or empty for any day.
                startMinuteOfDay:
                  type: integer
                  minimum: 0
                  maximum: 1439
                  description: >-
                    Company-local minute of day (540 = 09:00). Tests the
                    appointment's START time; wraps midnight when end < start.
                    Both time bounds must be supplied and cannot be equal.
                endMinuteOfDay:
                  type: integer
                  minimum: 0
                  maximum: 1439
                  description: Must be supplied with startMinuteOfDay and cannot equal it.
                serviceIDs:
                  type: array
                  items:
                    type: string
                  description: Omit or empty for all services.
                petTypes:
                  type: array
                  items:
                    type: string
                    enum: [dog, cat, pig, bird, fish, small pet, reptile, horse, other]
                  description: Omit or empty for any pet. Combined with petIDs as an intersection.
                petIDs:
                  type: array
                  items:
                    type: string
                customerIDs:
                  type: array
                  items:
                    type: string
                  description: Omit or empty for any client. Tested against each pet's own owner, not the appointment's customer, so a booking shared by two households is surcharged only for the scoped client's pets.
                hidden:
                  type: boolean
                  default: false
                position:
                  type: integer
                  default: 0
                  minimum: 0
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Surcharge'

  /surcharges/{id}:
    get:
      summary: Get Surcharge
      tags: [Surcharges]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Surcharge'
        '404':
          description: Surcharge not found
    patch:
      summary: Update Surcharge
      description: >-
        Updates the catalog entry only. Surcharges already applied to
        appointments or invoices are frozen snapshots and never change.
        Explicit null clears an optional window field (startDate, endDate,
        startMinuteOfDay, endMinuteOfDay). Time bounds must be set or cleared
        together. An annual date bound cannot be cleared unless
        repeatsAnnually is also disabled (or both annual bounds remain set).
      tags: [Surcharges]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  maxLength: 100
                valueType:
                  type: string
                  enum: [fixed, percentage]
                amount:
                  type: integer
                  minimum: 1
                  description: Positive MINOR UNITS (pence/cents).
                percentage:
                  type: number
                  minimum: 0
                  exclusiveMinimum: true
                  maximum: 100
                  description: Must be above 0 and no more than 100.
                startDate:
                  type: string
                  format: date
                  nullable: true
                  description: Inclusive company-local calendar date; null clears it.
                endDate:
                  type: string
                  format: date
                  nullable: true
                  description: Inclusive company-local calendar date; null clears it.
                repeatsAnnually:
                  type: boolean
                daysOfWeek:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                startMinuteOfDay:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 1439
                  description: Set or clear together with endMinuteOfDay; the two values cannot be equal.
                endMinuteOfDay:
                  type: integer
                  nullable: true
                  minimum: 0
                  maximum: 1439
                  description: Set or clear together with startMinuteOfDay; the two values cannot be equal.
                serviceIDs:
                  type: array
                  items:
                    type: string
                petTypes:
                  type: array
                  items:
                    type: string
                    enum: [dog, cat, pig, bird, fish, small pet, reptile, horse, other]
                petIDs:
                  type: array
                  items:
                    type: string
                customerIDs:
                  type: array
                  items:
                    type: string
                hidden:
                  type: boolean
                position:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Surcharge'
        '404':
          description: Surcharge not found
    delete:
      summary: Delete Surcharge
      description: >-
        Permanently deletes the catalog entry (unlike the soft-hide on
        services). Applied surcharges are frozen copies, so issued invoices
        keep rendering their snapshots; deletion only stops future
        auto-apply and removes it from pickers.
      tags: [Surcharges]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted
        '404':
          description: Surcharge not found

  /appointments:
    get:
      summary: List Appointments
      tags: [Appointments]
      parameters:
        - name: customerID
          in: query
          schema:
            type: string
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Filter by date (YYYY-MM-DD)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Appointment'
    post:
      summary: Create Appointment
      description: >-
        Creates an appointment in the company's configured IANA timezone.
        Offsetless date-times are interpreted as company-local wall times;
        offset-bearing RFC3339 values identify an instant which is displayed in
        the company timezone. Booking is refused when the company has no valid
        timezone. A caller cannot override the appointment timezone.
      tags: [Appointments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startDate]
              properties:
                startDate:
                  type: string
                  format: date-time
                endDate:
                  type: string
                  format: date-time
                  description: When omitted, defaults to startDate plus the primary service's duration (minutes); falls back to startDate if the service has no duration.
                timezone:
                  type: string
                  readOnly: true
                  description: >-
                    Ignored on input. The server stamps the company's configured
                    IANA timezone.
                status:
                  type: string
                  enum: [confirmed, requested]
                  default: confirmed
                serviceID:
                  type: string
                  description: ID of a service from GET /services. The appointment's `type` is derived from this service (a "dropin" service becomes a "checkIn" appointment); a service-less appointment is "other". `type` cannot be set directly.
                petIDs:
                  type: array
                  items:
                    type: string
                  description: Pet IDs to include
                teamMemberIDs:
                  type: array
                  items:
                    type: string
                  description: >-
                    Team member IDs to assign. When omitted on a single-person team, the
                    sole team member is auto-assigned (mirrors the app); multi-person
                    teams are left unassigned.
                customerIDs:
                  type: array
                  items:
                    type: string
                  description: Customer IDs (auto-derived from pets if not provided)
                createdByTeamMemberID:
                  type: string
                  description: >-
                    Optional. The team member to record as the creator of this appointment, validated
                    against your team (an unknown id returns 400). When set, it is stored on the
                    appointment as the creator. When omitted, the appointment is created with no
                    creator attribution (the field is left unset).
                confirmOverlap:
                  type: boolean
                  description: >-
                    If the new appointment overlaps an existing one (same team member or pet), the
                    API returns 200 with `{ requiresConfirmation: true, warning }` and does NOT book.
                    Re-send the request with confirmOverlap=true to book anyway. (External API keys
                    instead book immediately and get a `warning` on the created appointment.)
                invoiceType:
                  type: string
                  enum: [none, single, whenStarted]
                  description: >-
                    How the appointment is billed. DEFAULTS TO 'none' — booking does NOT
                    create an invoice unless you explicitly pass 'single' (invoice now) or
                    'whenStarted' (invoice when the visit starts). Client/company billing
                    preferences are NOT auto-applied; create an invoice separately if needed.
                paymentMethod:
                  type: string
                  description: >-
                    Optional override for the generated invoice's payment method (only used
                    when invoiceType is single/whenStarted). When omitted on an invoiced
                    appointment, it's resolved from the client's preferredPaymentMethod, then
                    the company's, then 'None'. Ignored when there's no invoice.
                deposit:
                  type: boolean
                  description: >-
                    Optional. Whether the generated invoice applies the company's default
                    deposit (depositPercentage). Defaults to true when the appointment is
                    invoiced (invoiceType is not 'none'), false otherwise. The due date
                    always follows the company's dueDateOffset.
                depositDueDate:
                  type: string
                  format: date-time
                  description: >-
                    Optional. Freezes a deposit deadline onto the booking, which the
                    generated invoice inherits. Returns 400 unless invoiceType is 'single'
                    AND the booking takes a deposit: a date stamped at booking is already
                    stale by the time a 'whenStarted' invoice is raised, so that path always
                    recomputes, and a booking with no deposit has nothing for the deadline
                    to apply to. Omit to use the company's depositDueDateOffset.
                allDay:
                  type: boolean
                  default: false
                notes:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'

  /invoices:
    get:
      summary: List Invoices
      tags: [Invoices]
      parameters:
        - name: customerID
          in: query
          schema:
            type: string
        - name: paid
          in: query
          schema:
            type: string
            enum: ['true', 'false']
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invoice'
    post:
      summary: Create Invoice
      description: |
        Creates an invoice for a customer. Services must reference existing services from your account (use GET /services to list them).
        Customer pets are automatically included.

        This route has two explicit pricing contracts. Existing integrations
        remain on `legacy-total-v1` when `pricingProtocol` is omitted: `amount`
        is the already-composed final invoice total, and optional tax, travel
        and discount fields are stored without changing that total. Automatic
        surcharges are not applied on the legacy protocol.

        Set `pricingProtocol` to `service-subtotal-v2` to use automatic pricing.
        In v2, `amount` overrides the selected services' subtotal; automatic
        surcharges and tax are then resolved and travel is added and discount
        subtracted. No request shape is used to infer v2.
      tags: [Invoices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerID]
              properties:
                pricingProtocol:
                  type: string
                  enum: [legacy-total-v1, service-subtotal-v2]
                  default: legacy-total-v1
                  description: >-
                    Explicit amount/pricing contract. Omit (or use
                    legacy-total-v1) to keep amount as the final total exactly
                    as in the original API. Use service-subtotal-v2 to treat
                    amount as a service-subtotal override and automatically
                    compose surcharge, tax, travel and discount. Unknown
                    values are rejected; the server never guesses from other
                    fields.
                customerID:
                  type: string
                serviceIDs:
                  type: array
                  items:
                    type: string
                  description: IDs of services from GET /services
                amount:
                  type: number
                  description: >-
                    Amount in pence/cents. Under the default
                    legacy-total-v1 protocol this is the final invoice total.
                    Under service-subtotal-v2 it overrides the selected
                    services' subtotal before surcharge, tax, travel and
                    discount. When omitted, both protocols start from the
                    selected services' calculated amount.
                coveredDates:
                  type: array
                  maxItems: 366
                  items:
                    type: string
                    format: date-time
                  description: >-
                    service-subtotal-v2 only. Dates the services cover,
                    evaluated in the company timezone. Supply these for
                    calendar/day-of-week surcharge rules. When omitted only
                    rules without date, weekday or time predicates auto-apply.
                    Ignored under legacy-total-v1.
                paymentMethod:
                  type: string
                  enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
                  description: Defaults to your company's preferred payment method (Settings) when omitted.
                notes:
                  type: string
                dueDate:
                  type: string
                  format: date-time
                  description: Defaults to your company's invoice terms (creation date + due-date offset days, default 7) when omitted.
                deposit:
                  type: number
                  description: Deposit required up front (pence/cents). Omit or pass 0 for no deposit.
                depositDueDate:
                  type: string
                  format: date-time
                  description: >
                    When the deposit falls due. Only written alongside a deposit, and clamped
                    so it can never fall after dueDate. Omit to use your company's
                    depositDueDateOffset, or to leave the deposit due with the invoice.
                travelAmount:
                  type: number
                  description: >-
                    Travel charge (pence/cents). Added to amount by
                    service-subtotal-v2; descriptive only under
                    legacy-total-v1 because amount is already final.
                discountAmount:
                  type: number
                  description: >-
                    Discount (pence/cents). Subtracted from amount by
                    service-subtotal-v2; descriptive only under
                    legacy-total-v1 because amount is already final.
                serviceTaxPercentage:
                  type: number
                  description: >-
                    In service-subtotal-v2, the tax percentage applied to the
                    service subtotal plus automatic surcharge; defaults to the
                    company setting when omitted. In legacy-total-v1 it is
                    stored only and does not change amount.
                serviceTaxAmount:
                  type: number
                  description: >-
                    Tax in minor units. In service-subtotal-v2, when
                    serviceTaxPercentage is supplied (or configured by the
                    company), this must equal that percentage of the service
                    subtotal plus automatic surcharge; an inconsistent
                    override is rejected. In legacy-total-v1 it is stored only
                    and does not change amount.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

