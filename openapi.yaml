openapi: 3.0.3
info:
  title: Walkies API
  description: |
    ## Authentication
    All requests require an API key passed as a Bearer token:
    ```
    Authorization: Bearer wk_live_...
    ```
    Generate an API key from the Walkies web app: **Settings > Integrations > Generate key**. API keys are managed on the web only; the mobile apps don't generate them.

    ## Rate Limits
    Requests are rate limited per API key (and per IP). Exceeding the limit returns `429` with a `Retry-After` header (seconds) — back off and retry.

    ## Pagination
    List endpoints accept `?limit=` (default 50, max 100). When more results may exist, the response includes an `X-Next-Cursor` header; pass its value back as `?cursor=` to fetch the next page. (Filtered list queries return a single capped page.)

    ## Idempotency
    Send an `Idempotency-Key` header on POST creates to retry safely: the first successful response is stored and replayed for any retry using the same key (scoped per company, ~48h).

    ## Errors
    Errors return a JSON body of the form `{ "error": "message" }`. Common status codes: `400` validation error, `401` missing/invalid API key, `403` Walkies API subscription required, `404` not found, `429` rate limited, `500` server error.

    ## Subscription
    The API requires a **Walkies API subscription**. Requests from accounts without an active Walkies API subscription receive a `403` response.
  version: 1.2.0
  contact:
    name: Walkies Support
    url: https://walkies.app
servers:
  - url: https://api.personalwalkies.com
    description: Production

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key generated from the Walkies web app under Settings > Integrations.

  schemas:
    ReportPeriod:
      type: object
      description: The resolved date range a report was computed over.
      properties:
        type:
          type: string
          enum: [thisWeek, thisMonth, thisQuarter, thisYear, custom]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: Inclusive end of the period (…23:59:59.999 in the timezone).
        timezone:
          type: string
          example: Europe/London
          description: >-
            Frozen company scheduling timezone for this appointment. All
            appointment wall-clock dates, recurrence and pricing use this zone.
    Customer:
      type: object
      properties:
        id:
          type: string
          example: cust123
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Smith
        email:
          type: string
          example: jane@example.com
        phoneNumber:
          type: string
          example: "+447700900000"
        picture:
          type: string
          nullable: true
          example: https://firebasestorage.googleapis.com/...
        address:
          type: string
        notes:
          type: string
        accessInformation:
          type: string
        emergencyContactName:
          type: string
        emergencyPhoneNumber:
          type: string
        secondaryFirstName:
          type: string
          nullable: true
        secondaryLastName:
          type: string
          nullable: true
        secondaryEmail:
          type: string
          nullable: true
        secondaryPhoneNumber:
          type: string
          nullable: true
        linked:
          type: boolean
        secondaryLinked:
          type: boolean
        preferredPaymentMethod:
          type: string
          nullable: true
          enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
        preferredInvoiceType:
          type: string
          nullable: true
          description: This client's default billing/invoice type (takes priority over the company default).
          enum: [single, whenStarted, prePaid, recurring, none]
        status:
          type: string
          enum: [active, archived]
        customQuestionAnswers:
          $ref: '#/components/schemas/CustomQuestionAnswers'
        createdDate:
          type: string
          format: date-time

    Pet:
      type: object
      properties:
        id:
          type: string
        customerID:
          type: string
        name:
          type: string
          example: Max
        type:
          type: string
          enum: [dog, cat, pig, bird, fish, small pet, reptile, horse, other]
        breed:
          type: string
          example: Labrador
        gender:
          type: string
          enum: [Male, Female]
        weight:
          type: string
          nullable: true
        neutered:
          type: boolean
        microchipped:
          type: boolean
        medicalInformation:
          type: string
        foodInstructions:
          type: string
        status:
          type: string
          enum: [active, archived, passedAway]
        customQuestionAnswers:
          $ref: '#/components/schemas/CustomQuestionAnswers'

    Service:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [walk, dropin, hike, run, taxi, daycare, boarding, overnight, homeSitting, training, grooming, meetAndGreet, other, external, busy, holiday, birthday]
        title:
          type: string
          example: 1 Hour Walk
        description:
          type: string
        amount:
          type: number
          description: Amount in pence/cents (e.g. 2500 = GBP 25.00)
          example: 2500
        additionalPetAmount:
          type: number
          nullable: true
          description: Extra charge per additional pet (pence/cents). Generic fallback for pet types with no additionalPetAmounts entry.
        additionalPetAmounts:
          type: object
          nullable: true
          additionalProperties:
            type: integer
          description: >-
            Per-species extra charge per additional pet, in pence/cents, keyed by pet type
            (dog, cat, pig, bird, fish, small pet, reptile, horse, other). A key present with
            value 0 makes that species free as an additional pet; a pet type with no key falls
            back to additionalPetAmount.
        currency:
          type: string
          example: GBP
        country:
          type: string
          example: GB
        duration:
          type: integer
          nullable: true
          description: Duration in minutes
        quantity:
          type: integer
          default: 0
          readOnly: true
          description: >
            Always 0 on a catalog service, and ignored if supplied on create or update.
            Quantity is a per-line value that only applies to a service embedded in an
            appointment or invoice.
        cadence:
          type: string
          enum: [perService, perDay, perNight]
          default: perService
        hidden:
          type: boolean
          default: false
        position:
          type: integer
          default: 0

    Surcharge:
      type: object
      description: >-
        A catalog surcharge: a named fixed amount or percentage automatically
        applied to bookings that match its window (date range, optional annual
        repeat, days of week, time of day) and scope (services, pet types,
        specific pets, specific clients). Applied surcharges are FROZEN
        snapshots on the appointment and invoice, so later edits or deletes
        here never change documents already issued.
      properties:
        id:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 100
          example: Christmas
          description: Rendered verbatim to the customer on invoices and receipts.
        valueType:
          type: string
          enum: [fixed, percentage]
        amount:
          type: number
          nullable: true
          minimum: 1
          description: Fixed amount in pence/cents. Set when valueType is fixed.
          example: 500
        percentage:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          description: Percentage of the matched services' line totals (15 = 15%). Set when valueType is percentage.
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        repeatsAnnually:
          type: boolean
          default: false
          description: >-
            When true the window's year is ignored (24 Dec to 2 Jan repeats
            every year, wrapping New Year). Both startDate and endDate are
            required for an annual window.
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: 0 = Sunday .. 6 = Saturday. Empty means any day.
        startMinuteOfDay:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1439
          description: >-
            Company-local minute of day the window opens (540 = 09:00). Tested
            against the appointment's START time; all-day appointments never
            match a timed surcharge. End before start wraps midnight.
        endMinuteOfDay:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1439
          description: >-
            Company-local minute of day the window closes. Both time bounds
            must be present or absent, and they cannot be equal.
        serviceIDs:
          type: array
          items:
            type: string
          description: Catalog service ids the surcharge applies to. Empty means all services.
        petTypes:
          type: array
          items:
            type: string
            enum: [dog, cat, pig, bird, fish, small pet, reptile, horse, other]
          description: Pet types the surcharge applies to. Empty means any pet.
        petIDs:
          type: array
          items:
            type: string
          description: Specific pet ids. Empty means any pet. Combined with petTypes as an intersection.
        customerIDs:
          type: array
          items:
            type: string
          description: >-
            Specific client ids. Empty means any client. Tested against each
            PET'S OWN owner, not the appointment's customer, so a booking
            shared by two households is surcharged only for the scoped
            client's pets. Combined with petTypes and petIDs as an
            intersection.
        hidden:
          type: boolean
          default: false
          description: Paused surcharges never apply automatically. A sitter may still choose one explicitly from the manual Add surcharge screen when its scope matches.
        position:
          type: integer
          default: 0
          minimum: 0
        currency:
          type: string
          example: GBP
          readOnly: true
        country:
          type: string
          example: GB
          readOnly: true
        timezone:
          type: string
          readOnly: true
          description: Authoritative IANA company timezone stamped by the server.
          example: Europe/London
        dateCreated:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    AppliedSurcharge:
      type: object
      readOnly: true
      description: >-
        A surcharge snapshot frozen onto an invoice or appointment at
        resolution time. The title and rate never change after stamping, and
        the document's surchargeAmount is the arithmetic authority. API reads
        add a signed "Surcharge adjustment" compatibility row when legacy rows
        drift, so the visible entries always sum exactly to that scalar.
        Read-only through the API; client-supplied surcharge fields on writes
        are ignored.
      properties:
        surchargeID:
          type: string
          description: The catalog surcharge this entry resolved from.
        title:
          type: string
        valueType:
          type: string
          enum: [fixed, percentage]
        percentage:
          type: number
          nullable: true
        baseAmount:
          type: number
          nullable: true
          description: The matched line total (pence/cents) a percentage was taken on.
        units:
          type: integer
          description: Covered units charged (nights, matching pets, or their product). 1 for a plain in-window appointment.
        amount:
          type: number
          description: >-
            Resolved amount in pence/cents. Normally positive; a synthetic
            Surcharge adjustment row may be negative to reconcile legacy data
            to the authoritative surchargeAmount scalar.
        overridden:
          type: boolean
          description: A sitter hand-edited this amount; it is never recomputed.
        manual:
          type: boolean
          description: Added by hand from the catalog rather than auto-matched.
        customerAmounts:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Optional frozen allocation by customer id. Fixed pet/client-scoped
            rules allocate by matching owner; percentages are priced separately
            from each household's pet-filtered service line. Legacy snapshots
            omit this map and are billed to the appointment's primary customer
            once.

    Appointment:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [walk, checkIn, hike, run, taxi, daycare, boarding, homeSitting, overnight, training, grooming, meetAndGreet, other, external, busy, holiday, birthday]
        status:
          type: string
          enum: [confirmed, requested, declined]
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        timezone:
          type: string
          example: Europe/London
        allDay:
          type: boolean
        pets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              customerID:
                type: string
              type:
                type: string
              breed:
                type: string
              gender:
                type: string
        teamMembers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              role:
                type: string
        service:
          type: object
          nullable: true
          description: Primary service
          properties:
            id:
              type: string
            title:
              type: string
            amount:
              type: number
            type:
              type: string
            cadence:
              type: string
        additionalServices:
          type: array
          items:
            type: object
        notes:
          type: string
        customerIDs:
          type: array
          items:
            type: string
        invoiceType:
          type: string
          enum: [none, single, whenStarted, prePaid]
          description: How this appointment raises an invoice, if at all.
        deposit:
          type: boolean
          description: >-
            Whether the generated invoice applies the company's default deposit
            (depositPercentage). Meaningless when invoiceType is 'none'.
        depositAmount:
          type: number
          nullable: true
          description: >-
            A fixed deposit in minor units, set by the apps instead of the company
            percentage. When present the invoice trigger uses it ahead of
            depositPercentage, so a booking can carry a real deposit with `deposit`
            false. Null when the booking has no fixed amount.
        depositDueDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            The deposit deadline frozen onto this booking, which the generated invoice
            inherits. Null when none was set, which means the deposit falls due with the
            invoice itself (or on the company's depositDueDateOffset, applied when the
            invoice is raised). Only ever set for invoiceType 'single' or 'prePaid'.
        surcharges:
          type: array
          nullable: true
          readOnly: true
          items:
            $ref: '#/components/schemas/AppliedSurcharge'
        surchargeAmount:
          type: number
          nullable: true
          readOnly: true
          description: Sum of the applied surcharge entries' amounts, in pence/cents. Server-maintained.
        excludedSurchargeIDs:
          type: array
          readOnly: true
          items:
            type: string
          description: >-
            Canonical catalog surcharge ids that staff excluded from automatic
            pricing for this appointment. Manual, overridden and legacy keyless
            frozen rows are unaffected. API appointment writes cannot set this field.

    Invoice:
      type: object
      properties:
        id:
          type: string
        customerID:
          type: string
        customerFirstName:
          type: string
        customerLastName:
          type: string
        amount:
          type: number
          description: Amount in pence/cents
        currency:
          type: string
        country:
          type: string
        reference:
          type: string
        services:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              title:
                type: string
              amount:
                type: number
              quantity:
                type: integer
              cadence:
                type: string
              currency:
                type: string
              country:
                type: string
        pets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              customerID:
                type: string
        payments:
          type: array
          items:
            type: object
        notes:
          type: string
        paid:
          type: boolean
        paymentMethod:
          type: string
          enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
        datePaid:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        deposit:
          type: number
          nullable: true
          description: Deposit required up front (pence/cents). Part of `amount`, not an extra charge.
        depositDueDate:
          type: string
          format: date-time
          nullable: true
          description: >
            When the deposit falls due. Null means the deposit is due with the invoice
            (there is no separate deadline), which is how every invoice raised before
            deposit deadlines existed looks. Never later than `dueDate`.
        travelAmount:
          type: number
          nullable: true
        discountAmount:
          type: number
          nullable: true
        tipAmount:
          type: number
          nullable: true
        surcharges:
          type: array
          nullable: true
          readOnly: true
          items:
            $ref: '#/components/schemas/AppliedSurcharge'
        surchargeAmount:
          type: number
          nullable: true
          readOnly: true
          description: >-
            Sum of the applied surcharge entries' amounts, in pence/cents.
            Server-maintained; client-supplied surcharge fields on writes are
            ignored.
        serviceTaxPercentage:
          type: number
          nullable: true
        serviceTaxAmount:
          type: number
          nullable: true
        coveredDates:
          type: array
          items:
            type: string
            format: date-time
          description: Service dates used to evaluate date/day surcharge rules.
        createdDate:
          type: string
          format: date-time

    Expense:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
          description: Amount in minor units (pence/cents) — e.g. 1000 = £10.00.
        category:
          type: string
          enum: [fuel, mileage, petSupplies, insurance, vehicleMaintenance, marketing, officeSupplies, vetSupplies, software, equipment, training, other]
        date:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        vendor:
          type: string
          nullable: true
        teamMemberIDs:
          type: array
          items:
            type: string
        teamMemberNames:
          type: array
          items:
            type: string
        mileageDistance:
          type: number
          nullable: true
          description: Required for mileage category
        mileageRate:
          type: number
          nullable: true
          description: Required for mileage category
        reimbursed:
          type: boolean
        createdDate:
          type: string
          format: date-time

    Announcement:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        message:
          type: string
        picture:
          type: string
          nullable: true
        createdDate:
          type: string
          format: date-time

    Webhook:
      type: object
      properties:
        id:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
            enum:
              - appointment.created
              - appointment.updated
              - appointment.cancelled
              - appointment.deleted
              - customer.created
              - customer.updated
              - customer.deleted
              - pet.created
              - pet.updated
              - pet.deleted
              - invoice.created
              - invoice.updated
              - invoice.paid
              - invoice.overdue
              - invoice.deleted
              - expense.created
              - expense.updated
              - expense.deleted
              - service.created
              - surcharge.created
              - surcharge.updated
              - surcharge.deleted
              - service.updated
              - service.deleted
              - walk.started
              - walk.finished
              - hike.started
              - hike.finished
              - run.started
              - run.finished
              - taxi.started
              - taxi.finished
              - petsitting.started
              - petsitting.finished
              - petsitting.readyForPickup
              - activity.feedUpdated
              - message.received
              - contract.created
              - contract.signed
              - contract.updated
              - contract.deleted
              - announcement.created
              - announcement.updated
              - announcement.deleted
              - checklist.created
              - checklist.updated
              - checklist.deleted
              - custom_question.created
              - custom_question.updated
              - custom_question.deleted
              - address.created
              - address.updated
              - address.deleted
              - custom_update.created
              - custom_update.updated
              - custom_update.deleted
              - recurring_invoice.created
              - recurring_invoice.updated
              - recurring_invoice.deleted
              - appointment_window.created
              - appointment_window.updated
              - appointment_window.deleted
              - travel_log.created
              - travel_log.updated
              - travel_log.deleted
              - special_hours.created
              - special_hours.updated
              - special_hours.deleted
              - team_member.added
              - team_member.updated
              - team_member.removed
        secret:
          type: string
          description: HMAC-SHA256 secret for verifying webhook payloads
        createdDate:
          type: string
          format: date-time

    WebhookPayload:
      type: object
      properties:
        event:
          type: string
          example: appointment.created
        timestamp:
          type: string
          format: date-time
        data:
          type: object
          description: Event-specific payload

    CompanyInfo:
      type: object
      properties:
        companyName:
          type: string
          example: Walkies
        companyLogo:
          type: string
          nullable: true
        country:
          type: string
          example: GB
        currency:
          type: string
          example: GBP

    Error:
      type: object
      properties:
        error:
          type: string

    ActivityTeamMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
          example: Team Member
        picture:
          type: string
          nullable: true
    ActivityPet:
      type: object
      description: Embedded pet snapshot with per-activity tallies.
      properties:
        id:
          type: string
        name:
          type: string
        breed:
          type: string
        type:
          type: string
          example: dog
        picture:
          type: string
          nullable: true
        customerID:
          type: string
        wees:
          type: integer
        poos:
          type: integer
        food:
          type: integer
        water:
          type: integer
        treat:
          type: integer
        medication:
          type: integer
        litterBox:
          type: integer
    ActivityWeather:
      type: object
      nullable: true
      properties:
        temperature:
          type: number
          nullable: true
        condition:
          type: string
          example: cloudy
    ActivityService:
      type: object
      nullable: true
      properties:
        id:
          type: string
        title:
          type: string
        amount:
          type: number
        type:
          type: string
        cadence:
          type: string
    ChecklistItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        completed:
          type: boolean
    ActivityVideo:
      type: object
      properties:
        thumbnail:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
    UpdatesSummary:
      type: object
      description: Timeline rollup. Raw GPS coordinates are never exposed.
      properties:
        count:
          type: integer
        photos:
          type: integer
        videos:
          type: integer
    Activity:
      type: object
      description: A recorded walk, hike, run, taxi journey, or check-in (shared WalkiesActivity model). Raw GPS and device identifiers are excluded.
      properties:
        id:
          type: string
        type:
          type: string
          example: walk
        companyID:
          type: string
          nullable: true
        active:
          type: boolean
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        duration:
          type: integer
          description: Duration in seconds.
        distance:
          type: number
          description: Distance in metres.
        notes:
          type: string
        companyName:
          type: string
          nullable: true
        companyLogo:
          type: string
          nullable: true
        streetAddress:
          type: string
        city:
          type: string
        postcode:
          type: string
        weather:
          $ref: '#/components/schemas/ActivityWeather'
        service:
          $ref: '#/components/schemas/ActivityService'
        dogs:
          type: array
          items:
            $ref: '#/components/schemas/ActivityPet'
        teamMembers:
          type: array
          items:
            $ref: '#/components/schemas/ActivityTeamMember'
        petSittingIDs:
          type: array
          items:
            type: string
        additionalChecklistItems:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        walkImages:
          type: array
          items:
            type: string
        walkVideos:
          type: array
          items:
            $ref: '#/components/schemas/ActivityVideo'
        updates:
          $ref: '#/components/schemas/UpdatesSummary'
    PetSitting:
      type: object
      description: A boarding, daycare, overnight, or other pet sitting record. Raw GPS and device identifiers are excluded.
      properties:
        id:
          type: string
        type:
          type: string
          example: boarding
        companyID:
          type: string
          nullable: true
        active:
          type: boolean
        startTime:
          type: string
          format: date-time
          nullable: true
        endTime:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
        companyName:
          type: string
          nullable: true
        companyLogo:
          type: string
          nullable: true
        weather:
          $ref: '#/components/schemas/ActivityWeather'
        service:
          $ref: '#/components/schemas/ActivityService'
        pets:
          type: array
          items:
            $ref: '#/components/schemas/ActivityPet'
        teamMembers:
          type: array
          items:
            $ref: '#/components/schemas/ActivityTeamMember'
        additionalChecklistItems:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        updates:
          $ref: '#/components/schemas/UpdatesSummary'
    TeamMember:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Alex Walker
        role:
          type: string
          enum: [Admin, Sub Admin, Team Member]
        active:
          type: boolean
        email:
          type: string
          nullable: true
        picture:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
          description: Hex colour used for the team member in the calendar (e.g. "#4287f5")
          example: "#4287f5"
        activityRate:
          type: number
          nullable: true
          description: Pay rate per activity (pence/cents)
        hourlyRate:
          type: number
          nullable: true
          description: Pay rate per hour (pence/cents)
        mileRate:
          type: number
          nullable: true
          description: Pay rate per mile (pence/cents)
        serviceRates:
          type: object
          nullable: true
          additionalProperties:
            type: number
          description: Per-service pay rates keyed by service ID (pence/cents)
    Contract:
      type: object
      properties:
        id:
          type: string
        companyID:
          type: string
          nullable: true
        title:
          type: string
          example: Pet Sitting Agreement
        content:
          type: string
          description: Contract body. Newlines are preserved (stored internally with <br>).
        template:
          type: boolean
        templateID:
          type: string
          nullable: true
        customerID:
          type: string
          nullable: true
        primaryCustomerName:
          type: string
          nullable: true
        secondaryCustomerName:
          type: string
          nullable: true
        signed:
          type: boolean
        signedDate:
          type: string
          format: date-time
          nullable: true
        signedBy:
          type: string
          nullable: true
        sendToClients:
          type: boolean
        createdDate:
          type: string
          format: date-time
    CreditNote:
      type: object
      description: >
        Credit issued to a client. A credit note is a negative invoice, not a
        payment: applying one reduces what the client owes without any money
        changing hands, so it must never be counted as income. All amounts are
        in minor units (pence/cents). `notes` is deliberately omitted — it is
        the sitter's private field and is never returned by the API.
      properties:
        id:
          type: string
        companyID:
          type: string
          nullable: true
        customerID:
          type: string
          nullable: true
        reference:
          type: string
          description: Human-readable reference, always prefixed `CN-` so it is distinct from an invoice reference.
          example: CN-a1b2c3d4e5
        amount:
          type: integer
          description: Face value in minor units. Never changes once issued.
          example: 3000
        allocatedAmount:
          type: integer
          description: Sum of live (non-reversed) allocations.
          example: 1000
        remainingAmount:
          type: integer
          description: Still available to apply. Always 0 on a voided note.
          example: 2000
        status:
          type: string
          enum: [open, partiallyApplied, applied, void]
        reason:
          type: string
          description: Client-visible reason. May be empty — a reason is optional.
          example: Cancelled visit on 12 August
        currency:
          type: string
          nullable: true
          example: GBP
        country:
          type: string
          nullable: true
          example: GB
        serviceTaxPercentage:
          type: number
          nullable: true
        serviceTaxAmount:
          type: integer
          description: >
            Tax portion INCLUDED in `amount` (VAT-inclusive), unlike invoice tax
            which is added on top. On 20% against 5000 this is 833, not 1000.
        allocations:
          type: array
          items:
            $ref: '#/components/schemas/CreditNoteAllocation'
        dateIssued:
          type: string
          format: date-time
        dateCreated:
          type: string
          format: date-time
        voidedAt:
          type: string
          format: date-time
          nullable: true
    CreditNoteAllocation:
      type: object
      description: >
        One application of a credit note against one invoice. Reversal is soft —
        `reversedAt` is stamped and the entry is kept — so the audit trail
        survives a credit that was applied and then pulled back.
      properties:
        id:
          type: string
          description: Also the id of the matching row in the invoice's payments array, and the `allocationID` used to unapply.
        invoiceID:
          type: string
          nullable: true
        invoiceReference:
          type: string
        amount:
          type: integer
        dateApplied:
          type: string
          format: date-time
        reversedAt:
          type: string
          format: date-time
          nullable: true
    Checklist:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
          example: New Client Onboarding
        type:
          type: string
          enum: [customer, pet]
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChecklistItem'
        pets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              customerID:
                type: string
        customers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              firstName:
                type: string
              lastName:
                type: string
    CustomQuestion:
      type: object
      description: >-
        A company-defined extra profile field. A `customer` question renders on the
        client profile editor, a `pet` question on the pet editor, and the answer is
        stored in that record's `customQuestionAnswers` map keyed by this id.
      properties:
        id:
          type: string
        title:
          type: string
          example: Where is the spare key kept?
        type:
          type: string
          enum: [customer, pet]
          description: Immutable after creation — changing it would orphan every existing answer.
        required:
          type: boolean
          description: >-
            Enforced only on the CLIENT-facing surfaces (the Journal apps and the
            self-signup link), which block the profile save until the question is
            answered. Sitter apps show the question but never block on it. The API
            deliberately does not enforce it either, so existing integrations keep
            working when a question is marked required.
    CustomQuestionAnswers:
      type: object
      description: >-
        Free-text answers keyed by custom question id (from GET /custom-questions).
        On PATCH the map is MERGED key by key: send only the answers you are
        changing and the rest are left untouched, or send the complete set as the
        apps do. Either way "" means unanswered, and sending "" is how an answer is
        cleared. Maximum 100 entries, 2000 characters each. An id matching no
        question is stored but never displayed.
      additionalProperties:
        type: string
      example:
        aB3dEfGhIjKlMnOpQrSt: Under the third plant pot
    Address:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
          example: Home
        lineOne:
          type: string
        lineTwo:
          type: string
        city:
          type: string
        postcode:
          type: string
        state:
          type: string
        country:
          type: string
        lat:
          type: number
        long:
          type: number
    CustomUpdate:
      type: object
      description: A reusable custom timeline update (CustomTimelineUpdate).
      properties:
        id:
          type: string
        message:
          type: string
        type:
          type: string
          enum: [pet, general]
        serviceTypes:
          type: array
          items:
            type: string
        customers:
          type: array
          items:
            type: object
        pets:
          type: array
          items:
            type: object
    RecurringInvoice:
      type: object
      description: >-
        An automatic (recurring) invoice schedule. The system generates an invoice for
        the customer's activities on each run. frequency=weekly/biweekly/monthly,
        dayOfWeek 0=Sunday..6=Saturday, timeOfDay 24h HH:mm, direction=past/future,
        status=active/paused.
      properties:
        id: { type: string }
        customerID: { type: string }
        customerFirstName: { type: string }
        customerLastName: { type: string }
        frequency: { type: string, enum: [weekly, biweekly, monthly] }
        dayOfWeek: { type: integer, description: 0=Sunday..6=Saturday }
        timeOfDay: { type: string, description: "24-hour HH:mm" }
        direction: { type: string, enum: [past, future] }
        timezone: { type: string }
        status: { type: string, enum: [active, paused] }
        dueDateOffset: { type: integer, description: Days until the generated invoice is due }
        paymentMethod: { type: string }
        pets: { type: array, items: { type: object } }
        nextGenerationDate: { type: string, format: date-time, nullable: true }
        lastGeneratedDate: { type: string, format: date-time, nullable: true }
        createdDate: { type: string, format: date-time, nullable: true }
    AppointmentWindow:
      type: object
      description: A bookable time window. startTime/endTime are 24-hour HH:mm; days are weekday numbers (0=Sunday).
      properties:
        id: { type: string }
        name: { type: string }
        startTime: { type: string, description: "24-hour HH:mm" }
        endTime: { type: string, description: "24-hour HH:mm" }
        days:
          type: array
          items: { type: integer }
          description: Weekday numbers 0=Sunday..6=Saturday
    NotificationSettings:
      type: object
      description: >-
        Per-event toggles for what CUSTOMERS get notified about. All booleans (default
        true). Keys include walkStarted, walkFinished, invoiceCreated, appointmentBooked,
        appointmentAccepted, readyForPickup, etc.
      additionalProperties: { type: boolean }
    BookingSettings:
      type: object
      description: Customer-facing booking, availability and cancellation settings.
      properties:
        allowClientBooking: { type: boolean, description: Whether customers can request/book appointments }
        allowTeamMemberSelection: { type: boolean, nullable: true, description: Whether customers can pick a team member }
        appointmentWindows: { type: boolean, nullable: true, description: Whether bookings use appointment windows }
        appointmentWindowsBasedOnAvailability: { type: boolean, nullable: true }
        checkAvailability: { type: boolean, description: Whether availability is checked when customers book (so they cannot book unavailable slots) }
        allowCustomerCancellation: { type: boolean, description: Whether customers can cancel }
        cancellationDaysBeforeAppointment: { type: integer, description: Minimum days before an appointment a customer may cancel }
    RegionSettings:
      type: object
      description: >-
        Company region. Setting `country` auto-sets `currency` (the apps' country→currency map);
        `currency` sent on its own (no `country`) is used as-is. `timezone` is the authoritative
        booking calendar and cannot be changed once future appointments, repeat series,
        weekly/special hours, appointment windows, surcharge rules, or recurring invoices exist.
      properties:
        country: { type: string, description: ISO 3166-1 alpha-2 country code (e.g. US, GB, FR). Setting this auto-sets currency. }
        currency: { type: string, description: ISO 4217 currency code. Derived from country when country is set; honoured directly only when country is omitted. }
        timezone: { type: string, description: IANA timezone name (e.g. Europe/London, America/New_York). }
    TravelLog:
      type: object
      description: A recorded travel/mileage log. Read-only. Raw GPS coordinates are excluded.
      properties:
        id:
          type: string
        companyID:
          type: string
          nullable: true
        distance:
          type: number
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
          nullable: true
        active:
          type: boolean
        pets:
          type: array
          items:
            type: object
        teamMembers:
          type: array
          items:
            type: object
        loggingTeamMember:
          type: object
          nullable: true
        appointmentID:
          type: string
          nullable: true
        startOdometerReading:
          type: number
          nullable: true
        endOdometerReading:
          type: number
          nullable: true
    SpecialHours:
      type: object
      description: >-
        A date-specific exception to the normal weekly opening hours — a day off,
        holiday, or one-off different hours. closed=true means not working that whole
        day (times is empty). The date is in the company timezone.
      properties:
        id:
          type: string
        date:
          type: string
          format: date
          description: The calendar date this applies to (YYYY-MM-DD, in the company timezone)
        closed:
          type: boolean
          description: true = closed / not working all day; false = open with the time blocks below
        times:
          type: array
          description: Open time blocks for the day (empty when closed)
          items:
            type: object
            properties:
              start:
                type: string
                description: Block start, 24-hour HH:mm (e.g. 09:00)
              end:
                type: string
                description: Block end, 24-hour HH:mm (e.g. 17:00)
    WorkingDay:
      type: object
      description: >-
        The regular WEEKLY working/opening hours for one weekday. closed=true means
        no hours that weekday (times is empty). Blocks are non-overlapping.
      properties:
        day:
          type: integer
          description: Weekday index, 0=Sunday … 6=Saturday
        dayName:
          type: string
          description: Weekday name (e.g. Monday)
        closed:
          type: boolean
          description: true = closed that weekday (times is empty)
        times:
          type: array
          description: Open time blocks for the weekday (empty when closed)
          items:
            type: object
            properties:
              start:
                type: string
                description: Block start, 24-hour HH:mm (e.g. 09:00)
              end:
                type: string
                description: Block end, 24-hour HH:mm (e.g. 17:00)
    Company:
      type: object
      description: Merged public company profile plus read-only counters. Region fields (country/currency/timezone) are read-only and cannot be set via PATCH.
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        location:
          type: string
        logo:
          type: string
          nullable: true
        cover:
          type: string
          nullable: true
        profile:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        address:
          type: object
          nullable: true
        country:
          type: string
          readOnly: true
        currency:
          type: string
          readOnly: true
        timezone:
          type: string
          readOnly: true
        preferredPaymentMethod:
          type: string
          nullable: true
        preferredInvoiceType:
          type: string
          nullable: true
        customerPaysFee:
          type: boolean
        serviceTax:
          type: number
          nullable: true
        depositPercentage:
          type: number
          nullable: true
        dueDateOffset:
          type: integer
          nullable: true
        depositDueDateOffset:
          type: integer
          nullable: true
          description: >
            Days after an invoice is RAISED that its deposit falls due. Counted from the
            invoice creation date, unlike dueDateOffset, which a booked invoice counts
            from the service date. Null means deposits are due with the invoice.
        invoicesEnabled:
          type: boolean
        sendContracts:
          type: boolean
        appointmentSharing:
          type: boolean
        invoiceRemindersEnabled:
          type: boolean
          description: Automatic reminders for unpaid invoices. Enabling via PATCH requires a Max subscription.
        appointmentReminders:
          type: boolean
          description: Reminders sent to clients before appointments. Enabling via PATCH requires a Max subscription.
        appointmentReminderDelay:
          type: integer
          nullable: true
          description: Minutes before the appointment the reminder is sent.
        bankTransfer:
          type: object
          nullable: true
          description: Bank-transfer details. Sub-fields accountNumber and routingNumber (US routing / UK sort code / CA transit). Deep-merged on PATCH — send only the fields you're changing.
          properties:
            accountNumber: { type: string }
            routingNumber: { type: string }
        paypalURL:
          type: string
          nullable: true
          description: PayPal username only (no URL / @). Rendered as paypal.me/<username>.
        venmoURL:
          type: string
          nullable: true
          description: Venmo username only (no URL / @). Rendered as venmo.com/<username>.
        cashAppURL:
          type: string
          nullable: true
          description: Cash App cashtag including the leading $ (e.g. $jane). Rendered as cash.app/$<cashtag>.
        zelleInformation:
          type: string
          nullable: true
          description: Zelle recipient — an email or phone number.
        chequeTitle:
          type: string
          nullable: true
          description: Payee name for cheques.
        otherService:
          type: string
          nullable: true
          description: Free-text instructions for the "Other" payment method.
        subscriptionStatus:
          type: string
          nullable: true
          readOnly: true
        teamMemberCount:
          type: integer
          readOnly: true
        walkCount:
          type: integer
          readOnly: true
        hikeCount:
          type: integer
          readOnly: true
        runCount:
          type: integer
          readOnly: true
        taxiCount:
          type: integer
          readOnly: true
        petSittingCount:
          type: integer
          readOnly: true
        checkInCount:
          type: integer
          readOnly: true
    Conversation:
      type: object
      properties:
        id:
          type: string
        customerID:
          type: string
        customerFirstName:
          type: string
        customerLastName:
          type: string
        unreadCompanyMessageCount:
          type: integer
        unreadCustomerMessageCount:
          type: integer
        lastMessage:
          type: object
          nullable: true
    Message:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        senderID:
          type: string
        customerID:
          type: string
        companyRead:
          type: boolean
        customerRead:
          type: boolean
        sentDate:
          type: string
          format: date-time
          nullable: true
        sentByAssistant:
          type: boolean
          description: Present and true when this message was sent by the Walkies AI assistant. Omitted for messages sent by a human team member.

paths:
  /me:
    get:
      summary: Test Authentication
      description: Returns company information for the authenticated API key. Use this to verify your key is valid.
      tags: [Authentication]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyInfo'
        '401':
          description: Invalid or missing API key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Walkies API subscription required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /customers:
    get:
      summary: List Customers
      description: Returns all customers. Optionally filter by email or name.
      tags: [Customers]
      parameters:
        - name: email
          in: query
          schema:
            type: string
          description: Filter by exact email match
        - name: name
          in: query
          schema:
            type: string
          description: Filter by name (partial match on first + last name)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Customer'
    post:
      summary: Create Customer
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firstName, lastName]
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phoneNumber:
                  type: string
                address:
                  type: string
                notes:
                  type: string
                accessInformation:
                  type: string
                emergencyContactName:
                  type: string
                emergencyPhoneNumber:
                  type: string
                preferredPaymentMethod:
                  type: string
                  enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
                preferredInvoiceType:
                  type: string
                  description: This client's default billing/invoice type.
                  enum: [single, whenStarted, prePaid, recurring, none]
                secondaryFirstName:
                  type: string
                secondaryLastName:
                  type: string
                secondaryEmail:
                  type: string
                secondaryPhoneNumber:
                  type: string
                imageUrl:
                  type: string
                  description: URL of a profile picture (max 5MB)
                imageBase64:
                  type: string
                  description: Base64-encoded profile picture (max 5MB)
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers/{id}:
    delete:
      summary: Delete Customer
      description: Soft-deletes (archives) by default, reversible via POST /customers/{id}/restore. Pass ?hard=true with header X-Confirm-Delete:true to permanently delete and cascade conversations, messages and pets.
      tags: [Customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: hard
          in: query
          schema:
            type: boolean
        - name: X-Confirm-Delete
          in: header
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: Archived (soft) or permanently deleted (hard)
        '400':
          description: Hard delete attempted without the X-Confirm-Delete header
        '404':
          description: Customer not found
    get:
      summary: Get Customer
      tags: [Customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          description: Customer not found
    patch:
      summary: Update Customer
      tags: [Customers]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                phoneNumber:
                  type: string
                address:
                  type: string
                notes:
                  type: string
                preferredPaymentMethod:
                  type: string
                  description: This client's default payment method.
                  enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
                preferredInvoiceType:
                  type: string
                  description: This client's default billing/invoice type (priority over the company default).
                  enum: [single, whenStarted, prePaid, recurring, none]
                imageUrl:
                  type: string
                  description: URL of a profile picture (max 5MB)
                imageBase64:
                  type: string
                  description: Base64-encoded profile picture (max 5MB)
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /pets:
    post:
      summary: Create Pet
      tags: [Pets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, customerID, type, gender]
              properties:
                name:
                  type: string
                customerID:
                  type: string
                type:
                  type: string
                  enum: [dog, cat, pig, bird, fish, small pet, reptile, horse, other]
                gender:
                  type: string
                  enum: [Male, Female]
                breed:
                  type: string
                weight:
                  type: string
                neutered:
                  type: boolean
                microchipped:
                  type: boolean
                medicalInformation:
                  type: string
                foodInformation:
                  type: string
                vetPhoneNumber:
                  type: string
                dobDay:
                  type: integer
                dobMonth:
                  type: integer
                dobYear:
                  type: integer
                imageUrl:
                  type: string
                imageBase64:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Validation error or customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      summary: List Pets
      description: Returns pets. Optionally filter by customer or name.
      tags: [Pets]
      parameters:
        - name: customerID
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
          description: Filter by pet name (partial match)
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'

  /services:
    get:
      summary: List Services
      description: Returns all configured services for your company.
      tags: [Services]
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
    post:
      summary: Create Service
      tags: [Services]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, type, amount]
              properties:
                title:
                  type: string
                  example: 1 Hour Walk
                type:
                  type: string
                  enum: [walk, dropin, hike, run, taxi, daycare, boarding, overnight, homeSitting, training, grooming, meetAndGreet, other]
                amount:
                  type: integer
                  description: >-
                    Price in MINOR UNITS (pence/cents), NOT major units. Multiply the user's amount
                    by 100 — e.g. £25.00 = 2500, £10 = 1000.
                  example: 2500
                cadence:
                  type: string
                  enum: [perService, perDay, perNight]
                  default: perService
                description:
                  type: string
                duration:
                  type: integer
                  description: Duration in minutes
                additionalPetAmount:
                  type: integer
                  description: Extra charge per additional pet, in MINOR UNITS (pence/cents) — × 100, e.g. £5 = 500.
                additionalPetAmounts:
                  type: object
                  additionalProperties:
                    type: integer
                    minimum: 0
                  description: >-
                    Per-species extra charge per additional pet, in MINOR UNITS, keyed by pet type
                    (dog, cat, pig, bird, fish, small pet, reptile, horse, other). Values must be
                    non-negative integers; 0 makes that species free as an additional pet. A pet
                    type with no key falls back to additionalPetAmount.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'

  /services/{id}:
    patch:
      summary: Update Service
      tags: [Services]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                type:
                  type: string
                amount:
                  type: number
                  description: Amount in pence/cents
                cadence:
                  type: string
                  enum: [perService, perDay, perNight]
                description:
                  type: string
                duration:
                  type: integer
                additionalPetAmount:
                  type: integer
                  description: Extra charge per additional pet, in MINOR UNITS (pence/cents).
                additionalPetAmounts:
                  type: object
                  nullable: true
                  additionalProperties:
                    type: integer
                    minimum: 0
                  description: >-
                    Per-species extra charge per additional pet, in MINOR UNITS, keyed by pet type
                    (dog, cat, pig, bird, fish, small pet, reptile, horse, other). The map replaces
                    the stored one wholesale (omitted species are removed). Send null to clear every
                    per-species rate.
                hidden:
                  type: boolean
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          description: Service not found
    delete:
      summary: Delete Service
      description: Soft-deletes the service (sets hidden=true) so existing invoice/appointment references are preserved.
      tags: [Services]
      parameters:
