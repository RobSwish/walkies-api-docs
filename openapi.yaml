openapi: 3.0.3
info:
  title: Walkies API
  description: |
    ## Getting API access
    The API needs a **Walkies API subscription**, which is separate from your Walkies plan. To subscribe, sign in to the Walkies web app as an Admin or Sub Admin, open [Settings > Integrations > Walkies API](https://petsitter.personalwalkies.com/petsitter/settings/walkies-api) and choose **Get the Walkies API**. Once you're subscribed, create a key on the same page with **Generate key**. Keys are created on the web only, not in the Walkies mobile apps.

    ## Authentication
    All requests require an API key passed as a Bearer token:
    ```
    Authorization: Bearer wk_live_...
    ```
    Generate an API key from the Walkies web app: **Settings > Integrations > Walkies API > Generate key**. API keys are managed on the web only; the mobile apps don't generate them.

    ## Permissions
    A key acts as the Admin or Sub Admin who created it, with the same permissions they have in the Walkies apps. A key stops working if that person is deactivated, removed, or no longer an Admin or Sub Admin, so create keys from an account that will stay in place. A key created by a Sub Admin cannot add, remove or promote an Admin, or change an Admin's details other than pay rates and colour. Nobody can change their own role or active status. A request the creator's role does not allow returns `403` with `"code": "FORBIDDEN_FOR_ROLE"`.

    ## Rate Limits
    Requests are rate limited per company (and per IP). Reports have their own lower limit, and some actions that send messages are metered separately: broadcasts (30 an hour), export emails (30 an hour, 100 a day) and invoice reminders (one per invoice per hour). Exceeding a limit returns `429` with a `Retry-After` header (seconds). Back off and retry after that many seconds.

    ## Webhooks
    A company can have up to 100 active webhooks. Subscribing the same URL to the same events again returns the existing webhook (`200`, without its secret) instead of creating a copy. Webhook URLs must be public `https` addresses.

    ## Export emails
    Report, invoice and data exports can only be emailed to a team member or the company email address on file.

    ## Pagination
    List endpoints accept `?limit=` (default 50, max 100). When more results may exist, the response includes an `X-Next-Cursor` header; pass its value back as `?cursor=` to fetch the next page. (Filtered list queries return a single capped page.)

    ## Idempotency
    Send a unique `Idempotency-Key` header of 1 to 200 bytes on POST creates. The key is bound to the API key, route, and request body for about 48 hours. The first successful response is stored before it is returned and is replayed on a matching retry. A simultaneous retry returns `409` with `Retry-After`; reusing the key for different input also returns `409`.

    ## Errors
    Errors return a JSON body of the form `{ "error": "message" }`. Common status codes: `400` validation error, `401` missing/invalid API key, `403` Walkies API subscription required or not allowed for the key creator's role, `404` not found, `409` conflict, webhook limit or idempotency request in progress, `429` rate limited, `500` server error.

    ## Subscription
    The API requires a **Walkies API subscription**. Requests from accounts without an active Walkies API subscription receive a `403` response.
  version: 1.5.0
  contact:
    name: Walkies Support
    url: https://walkies.app
servers:
  - url: https://api.personalwalkies.com
    description: Production

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: API key generated from the Walkies web app under Settings > Integrations.

  schemas:
    TipsReportRow:
      type: object
      description: One tip (or one member's share of a split tip) in the Tips report. Amounts in minor units.
      properties:
        invoiceId: { type: string }
        appointmentId: { type: string, nullable: true, description: Null for a whole invoice with no appointments }
        customerName: { type: string }
        service: { type: string, nullable: true, description: The appointment's primary service, else the invoice's first service }
        serviceType: { type: string, description: 'Service type raw value (walk, dropin, ...); other when unknown' }
        date: { type: string, format: date-time, description: The appointment's start, or when the invoice was paid for a whole-invoice row }
        amount: { type: integer }
        currency: { type: string, nullable: true, description: The invoice's currency }
        fullAmount: { type: integer, description: 'Split rows only: the whole shared tip this row is a share of' }
        sharedWith:
          type: array
          description: Split rows only. The other team members the tip was split with.
          items: { type: object, properties: { id: { type: string }, name: { type: string } } }
        teamMembers:
          type: array
          description: Shared rows only. Every team member on the appointment, by name.
          items: { type: object, properties: { id: { type: string }, name: { type: string } } }
    ReportPeriod:
      type: object
      description: The resolved date range a report was computed over.
      properties:
        type:
          type: string
          enum: [thisWeek, thisMonth, thisQuarter, thisYear, custom]
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
          description: Inclusive end of the period (…23:59:59.999 in the timezone).
        timezone:
          type: string
          example: Europe/London
          description: >-
            Frozen company scheduling timezone for this appointment. All
            appointment wall-clock dates, recurrence and pricing use this zone.
    Customer:
      type: object
      properties:
        id:
          type: string
          example: cust123
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Smith
        email:
          type: string
          example: jane@example.com
        phoneNumber:
          type: string
          example: "+447700900000"
        picture:
          type: string
          nullable: true
          example: https://firebasestorage.googleapis.com/...
        address:
          type: string
        notes:
          type: string
        accessInformation:
          type: string
        emergencyContactName:
          type: string
        emergencyPhoneNumber:
          type: string
        secondaryFirstName:
          type: string
          nullable: true
        secondaryLastName:
          type: string
          nullable: true
        secondaryEmail:
          type: string
          nullable: true
        secondaryPhoneNumber:
          type: string
          nullable: true
        linked:
          type: boolean
        secondaryLinked:
          type: boolean
        preferredPaymentMethod:
          type: string
          nullable: true
          enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
        preferredInvoiceType:
          type: string
          nullable: true
          description: This client's default billing/invoice type (takes priority over the company default).
          enum: [single, whenStarted, prePaid, recurring, none]
        preferredLanguage:
          type: string
          nullable: true
          example: fr
          description: >-
            Language for messages (emails, texts, notifications) to the main
            owner, as a language code. Null means automatic (their Journal
            app's language, else the company default).
        secondaryPreferredLanguage:
          type: string
          nullable: true
          description: Language for messages to the second owner, as preferredLanguage.
        status:
          type: string
          enum: [active, archived, pending]
          description: pending is a new client who asked to book from the public profile; they become active when their first booking is accepted.
        assignedTeamMemberIDs:
          type: array
          items:
            type: string
          description: >-
            The Team Members (team member ids) who may message this client. Admins
            and Sub Admins reach every client. Change it with POST and DELETE
            /customers/{id}/team-members; PATCH /customers never changes it.
        customQuestionAnswers:
          $ref: '#/components/schemas/CustomQuestionAnswers'
        createdDate:
          type: string
          format: date-time

    Pet:
      type: object
      properties:
        id:
          type: string
        customerID:
          type: string
        name:
          type: string
          example: Max
        type:
          type: string
          enum: [dog, small dog, large dog, puppy, cat, pig, bird, fish, small pet, reptile, horse, other]
        breed:
          type: string
          example: Labrador
        gender:
          type: string
          enum: [Male, Female]
        weight:
          type: string
          nullable: true
        neutered:
          type: boolean
        microchipped:
          type: boolean
        medicalInformation:
          type: string
        foodInstructions:
          type: string
        status:
          type: string
          enum: [active, archived, passedAway, pending]
          description: pending is a pet a new client added while asking to book; it becomes active with the client.
        customQuestionAnswers:
          $ref: '#/components/schemas/CustomQuestionAnswers'

    Service:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [walk, dropin, hike, run, taxi, daycare, boarding, overnight, homeSitting, training, grooming, meetAndGreet, other, external, busy, holiday, birthday]
        title:
          type: string
          example: 1 Hour Walk
        description:
          type: string
        amount:
          type: number
          description: Amount in pence/cents (e.g. 2500 = GBP 25.00)
          example: 2500
        additionalPetAmount:
          type: number
          nullable: true
          description: Extra charge per additional pet (pence/cents). Generic fallback for pet types with no additionalPetAmounts entry.
        additionalPetAmounts:
          type: object
          nullable: true
          additionalProperties:
            type: integer
          description: >-
            Per-species extra charge per additional pet, in pence/cents, keyed by pet type
            (dog, small dog, large dog, puppy, cat, pig, bird, fish, small pet, reptile, horse,
            other). A key present with value 0 makes that exact type free as an additional pet;
            a pet type with no exact key falls back to additionalPetAmount. Dog, small dog,
            large dog, and puppy are independent keys.
        includedPetCount:
          type: integer
          nullable: true
          minimum: 1
          description: >-
            How many pets the base price covers before additional-pet charges apply. Blank means 1.
            The pets with the highest rates are the ones covered.
        currency:
          type: string
          example: GBP
        country:
          type: string
          example: GB
        duration:
          type: integer
          nullable: true
          description: Duration in minutes
        quantity:
          type: integer
          default: 0
          readOnly: true
          description: >
            Always 0 on a catalog service, and ignored if supplied on create or update.
            Quantity is a per-line value that only applies to a service embedded in an
            appointment or invoice.
        cadence:
          type: string
          enum: [perService, perDay, perNight]
          default: perService
        allowOtherBookingsDuringStay:
          type: boolean
          nullable: true
          description: >
            Pet sitting services only (per day, per night, boarding, home sitting, overnight).
            False stops the assigned team member being booked for other services during the
            stay. Unset or true changes nothing. Send null on update to clear it.
        capacity:
          type: integer
          minimum: 1
          nullable: true
          description: >-
            Optional. How many pets can book the same start time with one team member. Unset
            means one booking at a time. Customer bookings cannot go over it.
        bookingHours:
          type: object
          nullable: true
          description: >-
            Optional booking hours: when clients can book this service. Keys are weekdays "0" (Sunday)
            to "6" (Saturday); each is { times: [{ startHour, startMinute, endHour, endMinute }] } in the
            company timezone, up to 12 blocks a day that don't overlap. A missing weekday is closed.
            Only client bookings are limited; staff can book any time. Unset uses the business hours.
          additionalProperties:
            type: object
            properties:
              times:
                type: array
                maxItems: 12
                items:
                  type: object
                  properties:
                    startHour: { type: integer, minimum: 0, maximum: 23 }
                    startMinute: { type: integer, minimum: 0, maximum: 59 }
                    endHour: { type: integer, minimum: 0, maximum: 23 }
                    endMinute: { type: integer, minimum: 0, maximum: 59 }
        bookingSpecialDates:
          type: object
          nullable: true
          description: >-
            Optional special dates for this service's booking hours. Keys are company-local dates
            "YYYY-MM-DD" (up to 400); each is { closed: true } or { times: [{ startHour, startMinute, endHour,
            endMinute }] } with 1 to 12 blocks that don't overlap. On that date the service is closed or uses
            these hours instead of its weekly booking hours. Company hours and special days still apply.
            Past dates are kept but ignored. Only client bookings are limited.
          additionalProperties:
            type: object
            properties:
              date: { type: string, format: date, readOnly: true }
              closed: { type: boolean }
              times:
                type: array
                maxItems: 12
                items:
                  type: object
                  properties:
                    startHour: { type: integer, minimum: 0, maximum: 23 }
                    startMinute: { type: integer, minimum: 0, maximum: 59 }
                    endHour: { type: integer, minimum: 0, maximum: 23 }
                    endMinute: { type: integer, minimum: 0, maximum: 59 }
        pricingType:
          type: string
          enum: [fixed, hourly]
          default: fixed
          description: >-
            How the service is billed. `fixed` charges `amount` per unit of its cadence.
            `hourly` charges by time: the service is authored as `hourlyRate` per hour and
            billed in whole `billingIncrementMinutes` units derived from the booked span,
            so `amount` becomes the DERIVED price of one increment and `quantity` becomes
            the number of increments. An hourly service always keeps cadence `perService`.
        hourlyRate:
          type: number
          nullable: true
          description: >-
            Price per HOUR in pence/cents. Required when pricingType is hourly, and the
            source of truth for that service's price: `amount` is derived from it and any
            `amount` supplied on create or update is overwritten.
          example: 3000
        additionalPetHourlyRate:
          type: number
          nullable: true
          description: Extra charge per additional pet, per HOUR (pence/cents). Generic fallback for pet types with no additionalPetHourlyRates entry.
        additionalPetHourlyRates:
          type: object
          nullable: true
          additionalProperties:
            type: integer
          description: >-
            Per-species extra charge per additional pet, per HOUR, keyed by pet type exactly
            as additionalPetAmounts is. Scaled to the billing increment to produce
            additionalPetAmounts. Replaced wholesale on update; send null to clear.
        billingIncrementMinutes:
          type: integer
          enum: [15, 30, 60]
          nullable: true
          default: 30
          description: The billable unit for an hourly service. Part units round up. Null on a fixed-price service.
        minimumBillableMinutes:
          type: integer
          nullable: true
          description: Optional floor on the billed time for an hourly service, in minutes.
        hidden:
          type: boolean
          default: false
        position:
          type: integer
          default: 0

    Discount:
      type: object
      description: A catalogue discount (WAL-37), read-only in the API.
      properties:
        id: { type: string }
        title: { type: string }
        valueType: { type: string, enum: [fixed, percentage] }
        amount: { type: integer, nullable: true, description: Minor units when valueType is fixed. A fixed amount applies once per appointment (a whole stay counts once); to apply it per day or per night the sitter raises the row quantity on the appointment or invoice. }
        percentage: { type: number, nullable: true }
        currency: { type: string, nullable: true }
        hidden: { type: boolean, description: "Automatically apply off: manual, or code-only." }
        requiresCode: { type: boolean, description: Only applies when a client types one of its codes. }
        startDate: { type: string, format: date-time, nullable: true }
        endDate: { type: string, format: date-time, nullable: true }
        repeatsAnnually: { type: boolean }
        daysOfWeek: { type: array, items: { type: integer } }
        serviceIDs: { type: array, items: { type: string } }
        petTypes: { type: array, items: { type: string } }
        customerIDs: { type: array, items: { type: string } }
        position: { type: integer }

    DiscountCode:
      type: object
      description: >-
        A code that unlocks a catalogue discount for one booking or invoice
        (WAL-12). The API makes, edits and deletes them exactly as the apps' code
        editor does.
      properties:
        id: { type: string }
        code: { type: string, example: WELCOME10, description: "Stored upper case, 3 to 30 letters, digits or hyphens." }
        discountID: { type: string }
        discountTitle: { type: string, nullable: true, description: "The discount's title, or null when the discount was deleted." }
        valueType: { type: string, nullable: true, enum: [fixed, percentage] }
        amount: { type: integer, nullable: true, description: Fixed discount in minor units when valueType is fixed. It comes off once per appointment (a whole stay counts once); to take it off per day or per night the sitter raises the row quantity on the appointment or invoice. }
        percentage: { type: number, nullable: true, description: Percentage when valueType is percentage. }
        currency: { type: string, nullable: true }
        active: { type: boolean, description: "The code's Active switch." }
        state:
          type: string
          enum: [active, inactive, expired, usedUp, discountDeleted]
          description: >-
            Whether a client can use the code right now, checked in this order:
            switched off, its discount deleted, past its last day, total uses
            reached. The per-client limit depends on the client, so it is not a state.
        validUntil: { type: string, format: date-time, nullable: true, description: "End of the code's last day in the company timezone, or null for no end date." }
        maxUses: { type: integer, nullable: true, description: Total uses allowed, or null for no limit. }
        maxUsesPerClient: { type: integer, nullable: true, description: Uses allowed per client, or null for no limit. }
        uses: { type: integer, description: How many times it has been used. }
        createdDate: { type: string, format: date-time, nullable: true }
        updatedDate: { type: string, format: date-time, nullable: true }

    Surcharge:
      type: object
      description: >-
        A catalog surcharge: a named fixed amount or percentage automatically
        applied to bookings that match its window (date range, optional annual
        repeat, days of week, time of day) and scope (services, pet types,
        specific pets, specific clients). Applied surcharges are FROZEN
        snapshots on the appointment and invoice, so later edits or deletes
        here never change documents already issued.
      properties:
        id:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 100
          example: Christmas
          description: Rendered verbatim to the customer on invoices and receipts.
        valueType:
          type: string
          enum: [fixed, percentage]
        amount:
          type: number
          nullable: true
          minimum: 1
          description: Fixed amount in pence/cents. Set when valueType is fixed. It is added once per appointment (a whole stay counts once); to add it per day or per night the sitter raises the row quantity on the appointment or invoice.
          example: 500
        percentage:
          type: number
          nullable: true
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          description: Percentage of the matched services' line totals (15 = 15%). Set when valueType is percentage.
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        repeatsAnnually:
          type: boolean
          default: false
          description: >-
            When true the window's year is ignored (24 Dec to 2 Jan repeats
            every year, wrapping New Year). Both startDate and endDate are
            required for an annual window.
        daysOfWeek:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: 0 = Sunday .. 6 = Saturday. Empty means any day.
        startMinuteOfDay:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1439
          description: >-
            Company-local minute of day the window opens (540 = 09:00). Tested
            against the appointment's START time; all-day appointments never
            match a timed surcharge. End before start wraps midnight.
        endMinuteOfDay:
          type: integer
          nullable: true
          minimum: 0
          maximum: 1439
          description: >-
            Company-local minute of day the window closes. Both time bounds
            must be present or absent, and they cannot be equal.
        serviceIDs:
          type: array
          items:
            type: string
          description: Catalog service ids the surcharge applies to. Empty means all services.
        petTypes:
          type: array
          items:
            type: string
            enum: [dog, small dog, large dog, puppy, cat, pig, bird, fish, small pet, reptile, horse, other]
          description: Pet types the surcharge applies to. Matching is exact, so each dog type must be selected separately. Empty means any pet.
        petIDs:
          type: array
          items:
            type: string
          description: Specific pet ids. Empty means any pet. Combined with petTypes as an intersection.
        customerIDs:
          type: array
          items:
            type: string
          description: >-
            Specific client ids. Empty means any client. Tested against each
            PET'S OWN owner, not the appointment's customer, so a booking
            shared by two households is surcharged only for the scoped
            client's pets. Combined with petTypes and petIDs as an
            intersection.
        hidden:
          type: boolean
          default: false
          description: >-
            The inverse of the apps' Automatically apply switch. false (the
            default) applies the surcharge automatically to new bookings when
            its criteria are met. true makes it manual only, shown as
            "(Manual)" in the apps: it never applies automatically, but a
            sitter may still choose it explicitly from the Add surcharge
            screen when its scope matches.
        position:
          type: integer
          default: 0
          minimum: 0
        currency:
          type: string
          example: GBP
          readOnly: true
        country:
          type: string
          example: GB
          readOnly: true
        timezone:
          type: string
          readOnly: true
          description: Authoritative IANA company timezone stamped by the server.
          example: Europe/London
        dateCreated:
          type: string
          format: date-time
          nullable: true
          readOnly: true

    AppliedSurcharge:
      type: object
      readOnly: true
      description: >-
        A surcharge snapshot frozen onto an invoice or appointment at
        resolution time. The title and rate never change after stamping, and
        the document's surchargeAmount is the arithmetic authority. API reads
        add a signed "Surcharge adjustment" compatibility row when legacy rows
        drift, so the visible entries always sum exactly to that scalar.
        Read-only through the API; client-supplied surcharge fields on writes
        are ignored.
      properties:
        surchargeID:
          type: string
          description: The catalog surcharge this entry resolved from.
        title:
          type: string
        valueType:
          type: string
          enum: [fixed, percentage]
        percentage:
          type: number
          nullable: true
        baseAmount:
          type: number
          nullable: true
          description: The matched line total (pence/cents) a percentage was taken on.
        units:
          type: integer
          description: Covered units charged (nights, matching pets, or their product). 1 for a plain in-window appointment.
        amount:
          type: number
          description: >-
            Resolved amount in pence/cents, for every application of the rule
            (quantity times the single application). Normally positive; a
            synthetic Surcharge adjustment row may be negative to reconcile
            legacy data to the authoritative surchargeAmount scalar.
        quantity:
          type: integer
          minimum: 1
          description: >-
            How many times the rule is applied (for example two "Extra stop"
            charges). 1 for a single application. amount and customerAmounts
            already include it; the single price is amount divided by quantity.
            Merged invoices (a whole series, combined invoices) sum it.
        entryID:
          type: string
          description: >-
            Present only on a one-off surcharge the sitter typed in (surchargeID
            is empty, manual is true): its own id, the same on every occurrence
            of a series and on invoices built from them. Rows with different
            entryIDs are separate charges even with the same title and amount.
        overridden:
          type: boolean
          description: A sitter hand-edited this amount; it is never recomputed.
        manual:
          type: boolean
          description: >-
            Added by hand rather than auto-matched: a catalog rule picked by
            hand, or a one-off (no surchargeID, with an entryID).
        customerAmounts:
          type: object
          additionalProperties:
            type: integer
          description: >-
            Optional frozen allocation by customer id. Fixed pet/client-scoped
            rules allocate by matching owner; percentages are priced separately
            from each household's pet-filtered service line. Legacy snapshots
            omit this map and are billed to the appointment's primary customer
            once.
    AppliedDiscount:
      type: object
      readOnly: true
      description: >-
        A discount snapshot (WAL-37): the AppliedSurcharge shape keyed by
        discountID, with a positive amount that is SUBTRACTED. The document's
        discountAmount is the arithmetic authority; a scalar-only legacy
        document reads as one keyless manual "Discount" row, and drift adds a
        signed "Discount adjustment" row. A row capped to 0 is kept.
      properties:
        discountID:
          type: string
          description: The catalog discount this row resolved from; empty for one-off and legacy rows.
        entryID:
          type: string
          description: A one-off row's own ID, copied to every occurrence and invoice; rows merge by ID, never by name.
        discountCodeID:
          type: string
          description: Present when a client applied this discount with a discount code (WAL-12). The ID of the code, never the code itself. A fixed-amount code comes off once per booking or invoice, so on an appointment this row is that appointment's share of the code's amount.
        quantity:
          type: integer
          minimum: 2
          description: How many times this discount is applied. Absent means 1; amount already includes it.
        title:
          type: string
        valueType:
          type: string
          enum: [fixed, percentage]
        percentage:
          type: number
          nullable: true
        baseAmount:
          type: number
          nullable: true
        units:
          type: integer
        amount:
          type: number
        overridden:
          type: boolean
        manual:
          type: boolean
        customerAmounts:
          type: object
          additionalProperties:
            type: integer

    Vaccination:
      type: object
      description: >-
        A vaccination, treatment or test on a pet's record. Dates are calendar
        days (YYYY-MM-DD). `status` is worked out against the company's own day:
        overdue (past its due date), dueSoon (due today or within the company's
        due-soon window), upToDate, or noDueDate (tests and other entries that do
        not expire). A record replaced by a newer dose of the same type is
        `superseded` and is never overdue.
      properties:
        id: { type: string, readOnly: true }
        customerID: { type: string, readOnly: true }
        petID: { type: string }
        petName: { type: string, readOnly: true }
        type: { type: string, description: A key from GET /vaccinations/types, or `other` with a typeName. }
        typeName: { type: string }
        category: { type: string, enum: [vaccine, treatment, test, other], readOnly: true }
        dateGiven: { type: string, format: date, nullable: true }
        dateDue: { type: string, format: date, nullable: true }
        status: { type: string, enum: [overdue, dueSoon, upToDate, noDueDate], readOnly: true }
        daysOverdue: { type: integer, readOnly: true }
        daysUntilDue: { type: integer, readOnly: true }
        batchNumber: { type: string, nullable: true }
        administeredBy: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        verificationState: { type: string, enum: [unverified, verified, rejected], readOnly: true }
        verificationNote: { type: string, nullable: true, readOnly: true }
        certificateAttached: { type: boolean, readOnly: true }
        superseded: { type: boolean, readOnly: true }
        supersededByID: { type: string, nullable: true, readOnly: true }
        addedByRole: { type: string, enum: [sitter, customer], readOnly: true }
        createdDate: { type: string, format: date-time, readOnly: true }
        updatedDate: { type: string, format: date-time, readOnly: true }
    PayrollRun:
      type: object
      description: >-
        A saved payroll, the same record the apps show in Payroll. It is a
        snapshot: rates and totals are as they were when it was run. Money is
        in minor units (pence/cents). Gross pay is the service rows plus any
        travel the run pays, extra pay and tips; net pay equals gross pay.
      properties:
        id: { type: string, readOnly: true }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        payMode: { type: string, enum: [perActivity, perHour] }
        includeTravelDistance: { type: boolean }
        includeTravelDuration: { type: boolean }
        totalGrossPay: { type: integer, nullable: true }
        totalNetPay: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        createdDate: { type: string, format: date-time, nullable: true, description: Set on payrolls run through the API. }
        teamMembers:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              activityRate: { type: number }
              hourlyRate: { type: number }
              mileRate: { type: number }
              activityPercentRate: { type: number, nullable: true }
              activityCount: { type: number }
              activityDurationSeconds: { type: number }
              travelDistanceMeters: { type: number }
              travelDurationSeconds: { type: number }
              serviceBreakdown:
                type: array
                items:
                  type: object
                  properties:
                    serviceID: { type: string }
                    serviceTitle: { type: string }
                    serviceType: { type: string }
                    count: { type: number }
                    durationSeconds: { type: number }
                    rateType: { type: string, nullable: true, enum: [fixed, percent, hourly] }
                    rate: { type: number }
                    revenue: { type: number, nullable: true }
                    total: { type: integer }
              extraPay: { type: integer }
              tips: { type: integer }
              notes: { type: string, nullable: true }
              grossPay: { type: integer, nullable: true }
              netPay: { type: integer, nullable: true }
    Appointment:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [walk, checkIn, hike, run, taxi, daycare, boarding, homeSitting, overnight, training, grooming, meetAndGreet, other, external, busy, holiday, birthday]
        status:
          type: string
          enum: [confirmed, requested, declined]
        bookingGroupID:
          type: string
          nullable: true
          readOnly: true
          description: "Shared by appointments booked together: a client's request of several dates, or several dates added at once. Null for an appointment booked on its own. A repeating series is identified separately."
        teamMemberResponses:
          type: array
          readOnly: true
          description: "Each team member who was asked to accept this appointment, and their answer. Empty when nobody was asked. A team member who declined is no longer in teamMembers."
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              status:
                type: string
                enum: [waiting, accepted, declined]
              askedAt:
                type: string
                format: date-time
                nullable: true
              answeredAt:
                type: string
                format: date-time
                nullable: true
        businessAcceptedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: "When the business accepted this booking (by hand, automatically or through the API). A requested appointment with a time here is waiting for an assigned team member to accept it."
        acceptedAutomatically:
          type: boolean
          readOnly: true
          description: "True when the business acceptance was automatic (the booking settings' autoAcceptExistingClients or autoAcceptNewClients)."
        autoAcceptSkippedReason:
          type: string
          nullable: true
          readOnly: true
          enum: [clash, capacity, workingHours, paymentMethod, primaryService, timezone, null]
          description: "Why a booking the business accepts automatically was left as a request: it overlaps another appointment, the service is full, it is outside working hours, its invoice has no payment method, it has no service, or the business has no time zone. Null otherwise."
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        timezone:
          type: string
          example: Europe/London
        allDay:
          type: boolean
        pets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              customerID:
                type: string
              type:
                type: string
              breed:
                type: string
              gender:
                type: string
        teamMembers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              role:
                type: string
        service:
          type: object
          nullable: true
          description: Primary service
          properties:
            id:
              type: string
            title:
              type: string
            amount:
              type: number
            type:
              type: string
            cadence:
              type: string
        additionalServices:
          type: array
          items:
            type: object
        notes:
          type: string
        customerIDs:
          type: array
          items:
            type: string
        groupID:
          type: string
          readOnly: true
          description: Shared by every appointment in a repeating series. The same as `id` for a one-off.
        repeats:
          type: array
          readOnly: true
          items: { type: integer }
          description: The weekdays a series repeats on, 0 = Sunday. Empty for a one-off.
        repeatEndDate:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: The end of the series' last day.
        invoiceType:
          type: string
          enum: [none, single, whenStarted, prePaid]
          description: How this appointment raises an invoice, if at all.
        deposit:
          type: boolean
          description: >-
            Whether the generated invoice applies the company's default deposit
            (depositPercentage). Meaningless when invoiceType is 'none'.
        depositAmount:
          type: number
          nullable: true
          description: >-
            A fixed deposit in minor units, set by the apps instead of the company
            percentage. When present the invoice trigger uses it ahead of
            depositPercentage, so a booking can carry a real deposit with `deposit`
            false. Null when the booking has no fixed amount.
        depositDueDate:
          type: string
          format: date-time
          nullable: true
          description: >-
            The deposit deadline frozen onto this booking, which the generated invoice
            inherits. Null when none was set, which means the deposit falls due with the
            invoice itself (or on the company's depositDueDateOffset, applied when the
            invoice is raised). Only ever set for invoiceType 'single' or 'prePaid'.
        surcharges:
          type: array
          nullable: true
          readOnly: true
          items:
            $ref: '#/components/schemas/AppliedSurcharge'
        surchargeAmount:
          type: number
          nullable: true
          readOnly: true
          description: Sum of the applied surcharge entries' amounts, in pence/cents. Server-maintained.
        excludedSurchargeIDs:
          type: array
          readOnly: true
          items:
            type: string
          description: >-
            Canonical catalog surcharge ids that staff excluded from automatic
            pricing for this appointment. Manual, overridden and legacy keyless
            frozen rows are unaffected. API appointment writes cannot set this field.
        discountAmount:
          type: number
          readOnly: true
          description: >-
            Total discount in pence/cents, subtracted from the total. Present only
            when the appointment carries a discount decision.
        discounts:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/AppliedDiscount'
          description: >-
            Applied discount rows (WAL-37). Present only when the document carries a
            discount decision. Server-maintained; client-supplied rows are ignored.
        excludedDiscountIDs:
          type: array
          readOnly: true
          items:
            type: string
          description: Catalog discount ids staff excluded from automatic pricing. Read-only.

    Invoice:
      type: object
      properties:
        id:
          type: string
        customerID:
          type: string
        customerFirstName:
          type: string
        customerLastName:
          type: string
        amount:
          type: number
          description: Amount in pence/cents
        currency:
          type: string
        country:
          type: string
        reference:
          type: string
        services:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              type:
                type: string
              title:
                type: string
              amount:
                type: number
              quantity:
                type: integer
              cadence:
                type: string
              currency:
                type: string
              country:
                type: string
              oneOff:
                type: boolean
                description: Present (true) on a one-off add-on typed onto this invoice, not from the service catalogue.
              cancellationFee:
                type: boolean
                description: Present (true) on the line that charges a late cancellation's fee in place of the appointment.
        cancellationFeeInvoice:
          type: boolean
          description: Present (true) when the invoice was raised only to charge a cancellation fee.
        pets:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              customerID:
                type: string
        payments:
          type: array
          items:
            type: object
        notes:
          type: string
        paid:
          type: boolean
        paymentMethod:
          type: string
          enum: [Payment link, Bank transfer, PayPal, Venmo, Cash, Cheque, Zelle, Cash App, Other, None]
        datePaid:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date-time
          nullable: true
        deposit:
          type: number
          nullable: true
          description: Deposit required up front (pence/cents). Part of `amount`, not an extra charge.
        depositDueDate:
          type: string
          format: date-time
          nullable: true
          description: >
            When the deposit falls due. Null means the deposit is due with the invoice
            (there is no separate deadline), which is how every invoice raised before
            deposit deadlines existed looks. Never later than `dueDate`.
        travelAmount:
          type: number
          nullable: true
        discountAmount:
          type: number
          nullable: true
        tipAmount:
          type: number
          nullable: true
        surcharges:
          type: array
          nullable: true
          readOnly: true
          items:
            $ref: '#/components/schemas/AppliedSurcharge'
        surchargeAmount:
          type: number
          nullable: true
          readOnly: true
          description: >-
            Sum of the applied surcharge entries' amounts, in pence/cents.
            Server-maintained; client-supplied surcharge fields on writes are
            ignored.
        discounts:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/AppliedDiscount'
          description: >-
            Applied discount rows (WAL-37). Present only when the document carries a
            discount decision. Server-maintained; client-supplied rows are ignored.
        serviceTaxPercentage:
          type: number
          nullable: true
        serviceTaxAmount:
          type: number
          nullable: true
        coveredDates:
          type: array
          items:
            type: string
            format: date-time
          description: Service dates used to evaluate date/day surcharge rules.
        createdDate:
          type: string
          format: date-time

    Expense:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
          description: Amount in minor units (pence/cents) — e.g. 1000 = £10.00.
        category:
          type: string
          enum: [fuel, mileage, petSupplies, insurance, vehicleMaintenance, marketing, officeSupplies, vetSupplies, software, equipment, training, other]
        date:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        vendor:
          type: string
          nullable: true
        teamMemberIDs:
          type: array
          items:
            type: string
        teamMemberNames:
          type: array
          items:
            type: string
        mileageDistance:
          type: number
          nullable: true
          description: Required for mileage category
        mileageRate:
          type: number
          nullable: true
          description: Required for mileage category
        reimbursed:
          type: boolean
        createdDate:
          type: string
          format: date-time

    Announcement:
