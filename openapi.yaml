                  ownerNumber: { type: integer, description: Only on a client invite. 1 for the first owner, 2 for the second. }
                  mode: { type: string, enum: [connectCustomer, createCustomer] }
                  url: { type: string, description: The link to send. It opens the Walkies Journal app, or its store page. }
                  message: { type: string, description: "The message the apps send with the link, in the client's language." }
                  language: { type: string }
                  expiresAt: { type: string, format: date-time }
        '403': { description: Not an Admin or Sub Admin }
