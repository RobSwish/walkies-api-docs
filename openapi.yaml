                  type: object
                  properties:
                    id: { type: string, description: Same as key. }
                    key: { type: string }
                    name: { type: string }
                    category: { type: string }
                    species: { type: array, nullable: true, items: { type: string } }
                    defaultValidityMonths: { type: integer, nullable: true }
                    regions: { type: array, nullable: true, items: { type: string } }
  /vaccinations:
    get:
      summary: List Vaccinations
      tags: [Vaccinations]
      description: Live records, soonest due first, records with no due date last. The `X-Today` response header is the company day the status was worked out against.
      parameters:
        - { name: customerID, in: query, schema: { type: string } }
        - { name: petID, in: query, schema: { type: string } }
        - name: status
          in: query
          schema: { type: string, enum: [overdue, dueSoon, upToDate, noDueDate] }
        - name: includeSuperseded
          in: query
          description: Include older doses a newer record has replaced.
          schema: { type: string, enum: ['true', 'false'] }
        - name: dueSoonDays
          in: query
          description: Days ahead that count as due soon, 1 to 90. Defaults to the company's vaccination alert setting.
          schema: { type: integer }
        - { name: limit, in: query, schema: { type: integer } }
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vaccination'
    post:
      summary: Add Vaccination
      tags: [Vaccinations]
      description: >-
        Records a vaccination on a pet, through the same checks the apps use.
        The client is found from the pet. A newer dose of the same type marks
        the older one superseded. Sending the same record twice returns the
        first one with 200; send an Idempotency-Key to control this yourself.
        Vaccination records need the company to be on Pro or Max.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [petID, type]
              properties:
                petID: { type: string }
                type: { type: string, description: A key from GET /vaccinations/types. }
                typeName: { type: string, description: Required when type is other. }
                dateGiven: { type: string, format: date }
                dateDue: { type: string, format: date }
                batchNumber: { type: string }
                administeredBy: { type: string }
                notes: { type: string }
                verified: { type: boolean, description: Admins and Sub Admins only. Marks it verified in the same save. }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vaccination'
        '200':
          description: The same record was already saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vaccination'
        '400': { description: Invalid input, such as a future date given or a due date before it }
        '403': { description: Not allowed for your role (only Admins and Sub Admins verify or delete), or the company is not on Pro or Max }
        '404': { description: Not found }
