  # ── Reports ────────────────────────────────────────────────────────────────
  # Server-side replicas of the iOS business reports — the API returns the same
  # numbers the sitter sees in the app. Shared query params on every report:
  #   period (thisWeek|thisMonth|thisQuarter|thisYear|custom, default thisMonth),
  #   startDate & endDate (required when period=custom), timezone (IANA; defaults
  #   to the company timezone). ALL money fields are MINOR UNITS (pennies/cents).
  /reports/profit-loss:
    get:
      summary: Profit & Loss report
      description: >-
        Cash-basis P&L for the period. Income is payment-apportioned (each payment
        contributes pro-rata to its invoice's services/travel/tips/discounts/tax;
        fees are the literal per-payment fee when the customer pays fees; refunds
        are attributed by refund date). Expenses are grouped by category. Net
        profit = total income - total expenses. Amounts in minor units.
      tags: [Reports]
      parameters:
        - { name: period, in: query, description: 'thisWeek starts on the company country''s first day of week (GB Monday, US Sunday)', schema: { type: string, enum: [thisWeek, thisMonth, thisQuarter, thisYear, custom], default: thisMonth } }
        - { name: startDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD only (other formats rejected)', schema: { type: string } }
        - { name: endDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD; must be on or after startDate', schema: { type: string } }
        - { name: timezone, in: query, description: 'IANA tz (default: company timezone)', schema: { type: string } }
      responses:
        '200':
          description: Profit & loss report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { type: string }
                  period: { $ref: '#/components/schemas/ReportPeriod' }
                  income:
                    type: object
                    description: Minor units; payment-apportioned values may be fractional.
                    properties:
                      serviceRevenue: { type: number }
                      travelRevenue: { type: number }
                      tipsRevenue: { type: number }
                      discounts: { type: number }
                      fees: { type: number }
                      refunds: { type: number }
                      taxCollected: { type: number }
                      totalIncome: { type: number }
                  expenses:
                    type: object
                    properties:
                      byCategory:
                        type: array
                        items: { type: object, properties: { category: { type: string }, amount: { type: number } } }
                      total: { type: number }
                  netProfit: { type: number }
              example:
                report: profit_loss
                period: { type: thisMonth, start: '2026-06-01T00:00:00.000+01:00', end: '2026-06-30T23:59:59.999+01:00', timezone: Europe/London }
                income: { serviceRevenue: 120000, travelRevenue: 5000, tipsRevenue: 3000, discounts: 2000, fees: 450, refunds: 0, taxCollected: 24000, totalIncome: 125550 }
                expenses: { byCategory: [ { category: fuel, amount: 8000 } ], total: 8000 }
                netProfit: 117550

  /reports/payments:
    get:
      summary: Payments report (ledger)
      description: >-
        Bank-statement-style ledger of payments and refunds in the period. Totals
        split into regular / deposits / refunds, with net = regular + deposits -
        refunds. Ledger is sorted newest-first; refunds appear as negative amounts.
        Amounts in minor units.
      tags: [Reports]
      parameters:
        - { name: period, in: query, description: 'thisWeek starts on the company country''s first day of week (GB Monday, US Sunday)', schema: { type: string, enum: [thisWeek, thisMonth, thisQuarter, thisYear, custom], default: thisMonth } }
        - { name: startDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD only (other formats rejected)', schema: { type: string } }
        - { name: endDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD; must be on or after startDate', schema: { type: string } }
        - { name: timezone, in: query, description: 'IANA tz (default: company timezone)', schema: { type: string } }
      responses:
        '200':
          description: Payments report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { type: string }
                  period: { $ref: '#/components/schemas/ReportPeriod' }
                  totals:
                    type: object
                    properties:
                      regular: { type: number }
                      deposits: { type: number }
                      refunds: { type: number }
                      net: { type: number }
                  ledger:
                    type: array
                    description: Newest-first; capped at 1000 entries (truncated=true when capped). Totals always cover the full set.
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [payment, refund] }
                        date: { type: string, format: date-time }
                        customer: { type: string }
                        paymentType: { type: string, enum: [regular, deposit], description: Payment rows only — absent on refund rows }
                        paymentMethod: { type: string, nullable: true, description: Payment rows only; null when no method was recorded }
                        amount: { type: number, description: Negative on refund rows }
                  truncated: { type: boolean, description: Present (true) when the ledger was capped at 1000 entries }
              example:
                report: payments
                period: { type: thisMonth, start: '2026-06-01T00:00:00.000+01:00', end: '2026-06-30T23:59:59.999+01:00', timezone: Europe/London }
                totals: { regular: 100000, deposits: 20000, refunds: 5000, net: 115000 }
                ledger:
                  - { kind: payment, date: '2026-06-20T14:00:00.000+01:00', customer: Jane Smith, paymentType: regular, paymentMethod: Cash, amount: 5000 }
                  - { kind: refund, date: '2026-06-15T11:00:00.000+01:00', customer: Ann Lee, amount: -1500 }

  /reports/invoices-summary:
    get:
      summary: Invoices summary report
      description: >-
        Revenue analytics over invoices. Headline total is net of refunds, with a
        service-type breakdown (amount + quantity), a payment-method breakdown, and
        a per-customer breakdown. Amounts in minor units. NOTE the payment-method
        breakdown uses the stored invoice amount (an iOS quirk), while every other
        total is net of refunds.
      tags: [Reports]
      parameters:
        - { name: period, in: query, description: 'thisWeek starts on the company country''s first day of week (GB Monday, US Sunday)', schema: { type: string, enum: [thisWeek, thisMonth, thisQuarter, thisYear, custom], default: thisMonth } }
        - { name: startDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD only (other formats rejected)', schema: { type: string } }
        - { name: endDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD; must be on or after startDate', schema: { type: string } }
        - { name: timezone, in: query, description: 'IANA tz (default: company timezone)', schema: { type: string } }
        - { name: status, in: query, description: Which invoices to include, schema: { type: string, enum: [paid, unpaid, all], default: paid } }
        - { name: dateField, in: query, description: 'Which date field the period filters on. Defaults to datePaid for status=paid, otherwise dateCreated. datePaid is only valid with status=paid (unpaid invoices have no datePaid) — other combinations return 400. depositDueDate reports only on invoices that carry a deposit deadline: invoices without one are absent from the field entirely and are therefore excluded, so this total is NOT a subset of the same period measured by dateCreated.', schema: { type: string, enum: [dateCreated, dueDate, datePaid, depositDueDate] } }
      responses:
        '200':
          description: Invoices summary report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { type: string }
                  period: { $ref: '#/components/schemas/ReportPeriod' }
                  filter: { type: object, properties: { status: { type: string }, dateField: { type: string } } }
                  totals:
                    type: object
                    properties:
                      total: { type: number }
                      invoiceCount: { type: integer }
                      travel: { type: number }
                      tips: { type: number }
                      discounts: { type: number }
                      refunds: { type: number }
                  serviceBreakdown:
                    type: array
                    items: { type: object, properties: { type: { type: string }, quantity: { type: integer }, amount: { type: number } } }
                  paymentMethodBreakdown:
                    type: array
                    items: { type: object, properties: { method: { type: string }, amount: { type: number } } }
                  customerBreakdown:
                    type: array
                    items: { type: object, properties: { customerID: { type: string }, name: { type: string }, amount: { type: number } } }

  /reports/forecast:
    get:
      summary: Forecast report
      description: >-
        Projected revenue from confirmed appointments whose start falls in the
        period (service totals + travel + tips - discounts; tax excluded).
        Includes a service-type breakdown, a per-customer breakdown, and the
        appointment list. Amounts in minor units.
      tags: [Reports]
      parameters:
        - { name: period, in: query, description: 'thisWeek starts on the company country''s first day of week (GB Monday, US Sunday)', schema: { type: string, enum: [thisWeek, thisMonth, thisQuarter, thisYear, custom], default: thisMonth } }
        - { name: startDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD only (other formats rejected)', schema: { type: string } }
        - { name: endDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD; must be on or after startDate', schema: { type: string } }
        - { name: timezone, in: query, description: 'IANA tz (default: company timezone)', schema: { type: string } }
      responses:
        '200':
          description: Forecast report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { type: string }
                  period: { $ref: '#/components/schemas/ReportPeriod' }
                  forecastTotal: { type: number }
                  appointmentCount: { type: integer }
                  serviceBreakdown:
                    type: array
                    items: { type: object, properties: { type: { type: string }, quantity: { type: integer }, amount: { type: number } } }
                  additional: { type: object, properties: { travel: { type: number }, tips: { type: number }, discounts: { type: number } } }
                  customerBreakdown:
                    type: array
                    items: { type: object, properties: { customerID: { type: string }, amount: { type: number } } }
                  appointments:
                    type: array
                    description: Capped at 1000 entries (truncated=true when capped); totals cover the full set.
                    items:
                      type: object
                      properties:
                        reference: { type: string }
                        startDate: { type: string, format: date-time }
                        amount: { type: number }
                        services:
                          type: array
                          items: { type: object, properties: { title: { type: string }, type: { type: string }, quantity: { type: integer } } }
                  truncated: { type: boolean, description: Present (true) when the appointments list was capped at 1000 entries }

  /reports/payroll:
    get:
      summary: Payroll report
      description: >-
        Per-team-member pay for the period over confirmed activities
        (busy/holiday/birthday excluded). Two modes - perActivity (rate per
        service, using the member's per-service rate or default activity rate) or
        perHour (hours x hourly rate). Optionally includes travel distance/duration
        pay. netPay = grossPay (no deductions). Amounts in minor units.
      tags: [Reports]
      parameters:
        - { name: period, in: query, description: 'thisWeek starts on the company country''s first day of week (GB Monday, US Sunday)', schema: { type: string, enum: [thisWeek, thisMonth, thisQuarter, thisYear, custom], default: thisMonth } }
        - { name: startDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD only (other formats rejected)', schema: { type: string } }
        - { name: endDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD; must be on or after startDate', schema: { type: string } }
        - { name: timezone, in: query, description: 'IANA tz (default: company timezone)', schema: { type: string } }
        - { name: payMode, in: query, schema: { type: string, enum: [perActivity, perHour], default: perActivity } }
        - { name: includeTravelDistance, in: query, schema: { type: boolean, default: false } }
        - { name: includeTravelDuration, in: query, schema: { type: boolean, default: false } }
        - { name: teamMemberId, in: query, description: Limit to a single team member, schema: { type: string } }
      responses:
        '200':
          description: Payroll report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { type: string }
                  period: { $ref: '#/components/schemas/ReportPeriod' }
                  payMode: { type: string }
                  includeTravelDistance: { type: boolean }
                  includeTravelDuration: { type: boolean }
                  teamMembers:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        picture: { type: string, nullable: true }
                        rates: { type: object, properties: { activityRate: { type: number }, hourlyRate: { type: number }, mileRate: { type: number } } }
                        activityCount: { type: integer }
                        activityDurationSeconds: { type: integer }
                        travel:
                          type: object
                          description: Travel pay is included in grossPay only when the matching includeTravel* param is true.
                          properties:
                            distanceMeters: { type: number }
                            durationSeconds: { type: integer }
                            distancePay: { type: number }
                            durationPay: { type: number }
                        serviceBreakdown:
                          type: array
                          items: { type: object, properties: { serviceID: { type: string }, serviceTitle: { type: string }, serviceType: { type: string }, count: { type: integer }, durationSeconds: { type: integer }, rate: { type: number }, total: { type: number } } }
                        grossPay: { type: number }
                        netPay: { type: number, description: Always equals grossPay (no deductions) }
                  totals:
                    type: object
                    properties:
                      totalGrossPay: { type: number }
                      totalActivities: { type: integer }
                      totalHours: { type: number }
                      averagePay: { type: number }

  /invoices/{id}/remind:
    post:
      summary: Send Invoice Reminder
      description: >-
        Sends a one-off unpaid-invoice reminder to the client — the same notification the
        app's "Send reminder" button sends (amount due + how to pay). The invoice must be
        UNPAID (a paid invoice returns 400). This is a manual nudge, separate from the
        automatic reminder schedule.
      tags: [Invoices]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                teamMemberID: { type: string, description: The sender — pre-marks the reminder's activity-feed row read for them. }
      responses:
        '200': { description: Sent, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, invoiceID: { type: string }, remindedCustomers: { type: integer } } } } } }
        '400': { description: Invoice already paid, or no client to remind }
        '404': { description: Invoice not found }
  /invoices/{id}/export:
    post:
      summary: Export Invoice (email PDF)
      description: >-
        Generates the invoice/receipt PDF (identical to the in-app export) and EMAILS it as an
        attachment. Recipient is `email` if provided, otherwise the team member's on-file email
        (resolved from `teamMemberID`); returns 400 if neither resolves.
      tags: [Invoices]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, description: Send to this address (overrides the on-file lookup). }
                teamMemberID: { type: string, description: Resolve the recipient from this team member's on-file email. }
      responses:
        '200': { description: Sent, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, sentTo: { type: string }, filename: { type: string } } } } } }
        '400': { description: No recipient email available, or invalid email }
        '404': { description: Invoice not found }
  /reports/{type}/export:
    post:
      summary: Export Report (email CSV)
      description: >-
        Builds the report CSV (matching the in-app export) and EMAILS it as an attachment.
        `type` is one of profit-loss, payments, invoices-summary, forecast, payroll, travel-logs.
        Period/date range and report-specific options go in the body (same as the GET report
        endpoints). Recipient is `email` or the team member's on-file email (`teamMemberID`).
      tags: [Reports]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [profit-loss, payments, invoices-summary, forecast, payroll, travel-logs] } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                period: { type: string, enum: [thisWeek, thisMonth, thisQuarter, thisYear, custom] }
                startDate: { type: string }
                endDate: { type: string }
                email: { type: string }
                teamMemberID: { type: string }
                status: { type: string, enum: [paid, unpaid, all], description: invoices-summary only }
                payMode: { type: string, enum: [perActivity, perHour], description: payroll only }
                unit: { type: string, enum: [miles, km], description: travel-logs only }
      responses:
        '200': { description: Sent, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, sentTo: { type: string }, filename: { type: string }, truncated: { type: boolean } } } } } }
        '400': { description: Unknown report type, no recipient email, or invalid range }
  /exports/{type}:
    post:
      summary: Export Data (email CSV)
      description: >-
        Builds a CSV of the company's own RECORDS and EMAILS it as an attachment. This is a flat,
        one-row-per-record table — distinct from /reports/{type}/export, which sends a summary
        report with totals. `type` is one of clients, pets, appointments, activities, invoices,
        expenses, team, services, surcharges. appointments/activities/invoices/expenses accept a period or a
        custom startDate/endDate (default thisMonth); clients/pets/team/services/surcharges always export
        everything on file and IGNORE any period. Capped at 5000 rows (newest first for the dated
        types) — `truncated` reports when the cap was hit. Recipient is `email` or the team
        member's on-file email (`teamMemberID`).
      tags: [Reports]
      parameters:
        - { name: type, in: path, required: true, schema: { type: string, enum: [clients, pets, appointments, activities, invoices, expenses, team, services, surcharges] } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                period: { type: string, enum: [thisWeek, thisMonth, thisQuarter, thisYear, custom], description: Dated types only (appointments, activities, invoices, expenses). }
                startDate: { type: string }
                endDate: { type: string }
                email: { type: string, description: Send to this address (overrides the on-file lookup). }
                teamMemberID: { type: string, description: Resolve the recipient from this team member's on-file email. }
                message: { type: string, description: Optional covering note placed above the "attached" line in the email body. }
                unit: { type: string, enum: [miles, km], description: activities only - the distance column unit. }
      responses:
        '200': { description: Sent, content: { application/json: { schema: { type: object, properties: { success: { type: boolean }, sentTo: { type: string }, filename: { type: string }, rowCount: { type: integer }, truncated: { type: boolean } } } } } }
        '400': { description: Unknown export type, nothing to export, no recipient email, or invalid range }
  /reports/travel-logs:
    get:
      summary: Travel logs (mileage) report
      description: >-
        Distance/mileage report for tax. Total distance + trip count + per-trip
        detail. Distance is returned both in raw meters and converted to the
        requested unit (no monetary amount - mileage rate lives on the team member
        and is not part of this report).
      tags: [Reports]
      parameters:
        - { name: period, in: query, description: 'thisWeek starts on the company country''s first day of week (GB Monday, US Sunday)', schema: { type: string, enum: [thisWeek, thisMonth, thisQuarter, thisYear, custom], default: thisMonth } }
        - { name: startDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD only (other formats rejected)', schema: { type: string } }
        - { name: endDate, in: query, description: 'Required when period=custom. ISO 8601 or YYYY-MM-DD; must be on or after startDate', schema: { type: string } }
        - { name: timezone, in: query, description: 'IANA tz (default: company timezone)', schema: { type: string } }
        - { name: unit, in: query, schema: { type: string, enum: [miles, km], default: km } }
        - { name: teamMemberIds, in: query, description: Comma-separated team member ids to filter by (matched on the logging team member), schema: { type: string } }
      responses:
        '200':
          description: Travel logs report
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { type: string }
                  period: { $ref: '#/components/schemas/ReportPeriod' }
                  unit: { type: string }
                  summary:
                    type: object
                    properties:
                      totalDistanceMeters: { type: number }
                      totalDistance: { type: number }
                      tripCount: { type: integer }
                  trips:
                    type: array
                    description: Newest-first; capped at 1000 entries (truncated=true when capped). Summary covers the full set.
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        startTime: { type: string, format: date-time }
                        endTime: { type: string, format: date-time, nullable: true }
                        durationSeconds: { type: integer, nullable: true }
                        distanceMeters: { type: number }
                        distance: { type: number }
                        loggingTeamMember: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
                        teamMembers:
                          type: array
                          items: { type: object, properties: { id: { type: string }, name: { type: string } } }
                  truncated: { type: boolean, description: Present (true) when the trips list was capped at 1000 entries }
