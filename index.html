<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Walkies API</title>
</head>
<body>
  <script id="api-reference" data-url="openapi.yaml"></script>
  <script>
    // Follow the visitor's OS light/dark setting; hide the "Built with Scalar" footer badge.
    (function () {
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var hideBranding =
        '.scalar-app a[href*="scalar.com"],' +
        '.scalar-app a[href*="github.com/scalar"],' +
        '.scalar-app .scalar-sidebar-footer,' +
        '.scalar-app .open-api-client-button + * a[href*="scalar"] { display: none !important; }';
      document.getElementById('api-reference').dataset.configuration = JSON.stringify({
        layout: 'modern',
        darkMode: prefersDark,
        customCss: hideBranding
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
</body>
</html>
